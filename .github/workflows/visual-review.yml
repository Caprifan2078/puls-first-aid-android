name: PULS offline visual QA contact sheets
on:
  push:
    branches: [qa/puls-visual-review-20261127]
    paths: ['tools/visual_review_bundle.py','tools/test_visual_review_bundle.py','.github/workflows/visual-review.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          command -v ffmpeg || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg; }
          python3 -m unittest discover -s tools -p 'test_visual_review_bundle.py'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 46006594588
          name: PULS-8.22.0-Expanded-Media-APK-Tested
          path: apk
      - run: |
          set -euo pipefail
          APK=$(find apk -type f -name '*.apk' -print -quit)
          test -n "$APK"
          python3 tools/visual_review_bundle.py --apk "$APK" --workers 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PULS-8.22.0-Visual-Review-Offline
          path: visual-review/
          if-no-files-found: error
