name: QA ibuprofen pack photo for PULS 9.8.9
on:
  push:
    branches: [qa/puls-real-media-20261029]
    paths: [.github/workflows/ibuprofen-box-989.yml]
permissions:
  contents: read
jobs:
  get-photo:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify Commons license and download 400mg box
        run: |
          python - <<'PY'
          import json,urllib.request,urllib.parse,hashlib,pathlib,re
          name='Ibuprofen-400.jpg'
          h={'User-Agent':'PULS-packages-QA/0.3 (https://github.com/Caprifan2078/puls-first-aid-android)','Referer':'https://commons.wikimedia.org/'}
          url='https://commons.wikimedia.org/w/api.php?'+urllib.parse.urlencode({'action':'query','format':'json','prop':'imageinfo','iiprop':'url|extmetadata','iiurlwidth':'1000','titles':'File:'+name})
          with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=35) as f:j=json.load(f)
          r=next(iter(j['query']['pages'].values()))['imageinfo'][0]
          lic=re.sub('<[^>]*>','',r['extmetadata']['LicenseShortName']['value'])
          assert 'CC BY-SA 4.0' in lic,lic
          with urllib.request.urlopen(urllib.request.Request(r.get('thumburl') or r['url'],headers=h),timeout=40) as f:b=f.read(4000001)
          assert b[:3]==bytes.fromhex('ffd8ff') and 10000<len(b)<4000000
          pathlib.Path('photo').mkdir()
          pathlib.Path('photo/ibuprofen-box.jpg').write_bytes(b)
          pathlib.Path('photo/manifest.json').write_text(json.dumps({'source':'https://commons.wikimedia.org/wiki/File:Ibuprofen-400.jpg','author':'Wesalius','license':lic,'sha256':hashlib.sha256(b).hexdigest(),'local':'ibuprofen-box.jpg','example_not_RU_pack':True},indent=2))
          print('VALID BOX',len(b),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PULS-989-ibuprofen-pack-photo
          path: photo/
          if-no-files-found: warn