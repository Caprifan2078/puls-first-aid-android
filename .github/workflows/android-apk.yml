name: PULS Android APK — build and install test
on:
  workflow_dispatch:
  push:
    branches: [qa/bootstrap]
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Import full offline assets if uploaded
        shell: bash
        run: |
          set -euo pipefail
          parts=0
          for i in 1 2 3; do
            FILE="PULS_offline_assets_part_${i}.zip"
            if [[ -s "$FILE" ]]; then parts=$((parts+1)); fi
          done
          if [[ "$parts" == 3 ]]; then
            for i in 1 2 3; do unzip -q -o "PULS_offline_assets_part_${i}.zip" -d .; done
            echo "Full offline assets restored."
            python3 tools/check_offline_content.py
          elif [[ "$parts" == 0 ]]; then
            echo "::notice::Building compact offline installation-test edition (no uploaded media packs)"
            test -s app/src/main/assets/index.html
          else
            echo "::error::Found only $parts/3 content packs; upload all three or none."
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile real debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Verify APK exists
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Install and open in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot -no-window -no-audio -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -e
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.puls.firstaid.rebuild/.MainActivity
            sleep 15
            adb shell pidof com.puls.firstaid.rebuild
            adb logcat -d -s PULS_QA:I -v brief > puls-launch-log.txt
            cat puls-launch-log.txt
            grep -q "UI_READY:true" puls-launch-log.txt
      - name: Publish installation-tested APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PULS-Android-APK-Tested
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PULS-Android-Diagnostics
          path: puls-launch-log.txt
          if-no-files-found: ignore
