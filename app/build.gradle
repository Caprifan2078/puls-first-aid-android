plugins { id 'com.android.application' }
android {
    namespace 'com.puls.firstaid.rebuild'
    compileSdk 36
    defaultConfig {
        applicationId 'com.puls.firstaid.rebuild.ui83'
        minSdk 26
        targetSdk 36
        versionCode 30
        versionName '8.19.5-qa-action-first'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources { noCompress += ['mp4'] }
    buildTypes { release { minifyEnabled false } }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.13.0'
}

// Production builds must not bypass the rights gate. Debug builds remain QA-only.
tasks.register('auditReleaseMediaRights', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', 'tools/audit_media_rights.py', '--mode', 'release'
}
tasks.matching { it.name == 'preReleaseBuild' || it.name == 'mergeReleaseAssets' }.configureEach {
    dependsOn tasks.named('auditReleaseMediaRights')
}
