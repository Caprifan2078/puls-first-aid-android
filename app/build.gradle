plugins { id 'com.android.application' }
android {
    namespace 'com.puls.firstaid.rebuild'
    compileSdk 36
    defaultConfig {
        applicationId 'com.puls.firstaid.rebuild.ui83'
        minSdk 26
        targetSdk 36
        versionCode 6
        versionName '8.3.1-mobile-refresh'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes { release { minifyEnabled false } }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.13.0'
}
