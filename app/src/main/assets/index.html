function renderMedDetails(m){const a=MED_DETAILS[m.id],ru=state.lang==="ru";if(!a)return "";return '<details class="med-info"><summary>'+(ru?"О препарате":"About this medicine")+'</summary><p>'+esc(a[state.lang])+'</p>'+(a.caution?'<p class="med-caution">'+esc(a.caution[ru?0:1])+'</p>':"")+(a.redflag?'<div class="med-redflag"><strong>'+(ru?"Когда нужна срочная помощь":"When to seek urgent help")+'</strong><p>'+esc(a.redflag[ru?0:1])+'</p>'+(a.redflagTopic?'<a class="link" href="#/topic/'+esc(a.redflagTopic)+'">'+(ru?"Инструкция первой помощи":"First aid guide")+'</a> ':"")+'<a class="link" href="'+esc(a.redflagSource)+'">'+(ru?"Источник (интернет, EN)":"Source (online, EN)")+'</a></div>':"")+(a.interaction?'<div class="med-caution"><strong>'+(ru?"Важные сочетания":"Important interactions")+'</strong><p>'+esc(a.interaction[ru?0:1])+'</p><a class="link" href="'+esc(a.interactionSource)+'">'+(ru?"Источник (интернет)":"Source (online)")+'</a></div>':"")+'<p class="minor">'+(ru?"Справочная классификация. Не заменяет назначение врача или официальную инструкцию; не подбирайте препарат самостоятельно.":"Reference classification only. Follow the product leaflet and your clinician; do not self-select medicines.")+'</p>'+(a.source?'<a class="link" href="'+esc(a.source)+'">'+(a.sourceKind==="external-reference"?(ru?"MedlinePlus: справочник (интернет, EN)":"MedlinePlus reference (online, EN)"):a.sourceKind==="index"?(ru?"NHS: общий указатель лекарств (интернет, EN)":"NHS medicine index (online, EN)"):a.sourceKind==="candidate"?(ru?"NHS: ссылка требует проверки (интернет, EN)":"NHS: link pending verification (online, EN)"):a.sourceKind==="context"?(ru?"NHS: частный клинический контекст (интернет, EN)":"NHS: specific clinical context (online, EN)"):(ru?"Медицинский источник (интернет, EN)":"Medical source (online, EN)"))+'</a>':'<small>'+(ru?"Отдельный источник требует проверки.":"Individual source needs review.")+'</small>')+'</details>'}
function restoreMedicineGroups(groups,query){document.querySelectorAll(".medicine-group").forEach(d=>{d.open=!!query.trim()||groups.includes(d.dataset.group)})}
function renderMedicineGroups(q,rows=medRows(q)){
 const ru=state.lang==="ru";
 if(!rows.length)return '<div class="empty-search"><strong role="status">'+(ru?"Препараты не найдены":"No medicines found")+'</strong><p>'+(ru?"Попробуйте название или действующее вещество.":"Try the name or active ingredient.")+'</p><button data-action="clear-medicine-search">'+(ru?"Сбросить поиск":"Clear search")+'</button></div>';
 return MED_GROUPS.map(g=>{const matches=rows.filter(m=>m.group===g[0]);if(!matches.length)return "";return '<details class="kitcard medicine-group" data-group="'+esc(g[0])+'" '+(q.trim()?"open":"")+'><summary>'+esc(g[ru?1:2])+' <span class="minor">· '+matches.length+'</span></summary><div class="kititems">'+matches.map(m=>{const a=medicineMedia[m.id];return '<div class="medicine-row">'+(a?'<img loading="lazy" src="media/medicines/'+m.id+'.jpg" alt="'+esc((ru?"Пример упаковки или формы: ":"Example packaging or form: ")+m[state.lang])+'" width="88" height="88">':'')+'<div class="med-label"><strong>'+esc(m[state.lang])+'</strong><small>'+esc(m[ru?"en":"ru"])+'</small>'+renderMedDetails(m)+(a&&(a.rights_review!=="approved"||a.visual_review!=="approved")?'<small class="photo-pending">'+(ru?"Фото: предварительная проверка":"Photo: pending review")+'</small>':"")+(a?'<details class="photo-credit"><summary>'+(ru?"О фотографии":"Photo credits")+'</summary><small>'+esc(a.author+" · "+a.license+" · "+(a.modifications||""))+'</small><a class="link" href="'+esc(a.source)+'">'+(ru?"Источник":"Source")+'</a><a class="link" href="'+esc(a.license_url)+'">'+(ru?"Лицензия":"License")+'</a></details>':'')+'</div></div>'}).join("")+'</div></details>'}).join("");
}
function renderMedicineShelf(){
 const ru=state.lang==="ru",rows=medRows(medicineQuery);
 return '<section class="medicine-shelf"><label class="searchbox"><input id="medicine-search" class="search" type="search" autocomplete="off" value="'+esc(medicineQuery)+'" aria-label="'+(ru?"Поиск препарата":"Find a medicine")+'" placeholder="'+(ru?"Название или действующее вещество":"Name or active ingredient")+'"></label><p class="minor" role="status" id="medicine-count">'+rows.length+' / '+MEDICINES.length+'</p><p class="minor">'+(ru?"Справочный перечень, не рекомендация к приёму. Не определяйте препарат по фото; сверяйте упаковку и инструкцию.":"Reference only, not a treatment recommendation. Never identify medicines by photo; check the label and leaflet.")+'</p><div id="medicine-results">'+renderMedicineGroups(medicineQuery,rows)+'</div><details class="panel secondary"><summary>'+(ru?"Инструкции и безопасность":"Leaflets and safety")+'</summary><p>'+(ru?"Дозировки, противопоказания и правила отпуска зависят от конкретного препарата. Проверяйте местную инструкцию и назначение врача.":"Doses, contraindications and supply rules vary by product. Follow the local leaflet and clinician's instructions.")+'</p><a class="link" href="'+MED_INFO+'">NHS · '+(ru?"Справочник лекарств (англ., интернет)":"Medicines reference (online)")+'</a></details></section>';
}
let medicineBrowseGroups=[];
function updateMedicineSearch(q){if(!medicineQuery.trim())medicineBrowseGroups=[...document.querySelectorAll(".medicine-group[open]")].map(d=>d.dataset.group);medicineQuery=q;const rows=medRows(q);$("#medicine-results").innerHTML=renderMedicineGroups(q,rows);restoreMedicineGroups(medicineBrowseGroups,q);$("#medicine-count").textContent=rows.length+" / "+MEDICINES.length}
function loadMedicineMedia(){
 fetch("media/medicines/manifest.json").then(r=>r.ok?r.json():[]).then(rows=>{if(!Array.isArray(rows))return;rows.forEach(a=>{if(a&&MEDICINES.some(m=>m.id===a.id)&&a.author&&a.license&&typeof a.source==="string"&&a.source.startsWith("https://commons.wikimedia.org/wiki/File:")&&typeof a.license_url==="string"&&MED_LICENSE_URLS.has(a.license_url))medicineMedia[a.id]=a});if(location.hash==="#/kits/medicines"){const results=$("#medicine-results");if(results){const groups=[...results.querySelectorAll(".medicine-group[open]")].map(d=>d.dataset.group);const y=window.scrollY;results.innerHTML=renderMedicineGroups(medicineQuery);restoreMedicineGroups(groups,medicineQuery);restoreRouteScroll(y)}}else if(location.hash==="#/more")refreshLibraryStatus()}).catch(()=>{});
}

 for(const a of records){const entry=perTopic.get(a.topic);if(!entry)continue;if(a.file.endsWith(".jpg")){photos++;entry.photo=true}else if(a.file.endsWith(".mp4")){videos++;entry.video=true}}
 const entries=[...perTopic.values()],hasMedia=x=>x.photo||x.video,hasBoth=x=>x.photo&&x.video;
 return {guides:entries.filter(hasMedia).length,critical:entries.filter(x=>x.critical&&hasMedia(x)).length,photoGuides:entries.filter(x=>x.photo).length,videoGuides:entries.filter(x=>x.video).length,both:entries.filter(hasBoth).length,criticalBoth:entries.filter(x=>x.critical&&hasBoth(x)).length,photos,videos};
}

function validStepBinding(a,p){
 if(a.step_index===undefined)return true;
 return Number.isInteger(a.step_index)&&a.step_index>=0&&a.step_index<p.stepsRu?.length&&a.step_ru===p.stepsRu[a.step_index]&&a.step_en===p.stepsEn[a.step_index];
}
function validateAidMedia(rows){
 if(!Array.isArray(rows))return [];
 const seen=new Set(),topics=new Map(PAGES.map(p=>[p.id,p])),accepted=[];
 for(const a of rows){
 if(accepted.length>=5000)break;
 if(!a||a.clinical_approval!==true||a.visual_review!=="approved"||a.rights_review!=="approved"||typeof a.review_ref!=="string"||!a.review_ref.trim())continue;
 const p=topics.get(a.topic);
 if(!p||!validStepBinding(a,p)||typeof a.file!=="string"||!/^[a-z0-9-]+\.(jpg|mp4)$/.test(a.file)||typeof a.sha256!=="string"||!/^[a-f0-9]{64}$/.test(a.sha256)||typeof a.author!=="string"||!a.author.trim()||typeof a.license!=="string"||!AID_MEDIA_LICENSES.has(a.license_url)||typeof a.source!=="string"||!a.source.startsWith("https://commons.wikimedia.org/wiki/File:")||typeof a.ru!=="string"||!a.ru.trim()||typeof a.en!=="string"||!a.en.trim())continue;
 const key=a.topic+":"+a.file;if(seen.has(key))continue;seen.add(key);accepted.push(a);
 }
 return accepted;
}

document.addEventListener("click",ev=>{let b=ev.target.closest("button");if(!b)return;if(b.id==="langbtn"||b.dataset.action==="lang"){state.lang=state.lang==="ru"?"en":"ru";store.set("lang",state.lang);route()}else if(b.dataset.cat){catalogOffset=0;state.cat=catalogCategory(b.dataset.cat);let input=$("#search");if(input)state.q=input.value;history.replaceState(null,"","#/catalog/"+state.cat);route(true)}else if(b.dataset.kit){state.kitOpen=state.kitOpen===b.dataset.kit?"":b.dataset.kit;store.set("kitOpen",state.kitOpen);let y=window.scrollY;route();window.scrollTo(0,y);document.querySelector('[data-kit="'+state.kitOpen+'"]')?.focus({preventScroll:true})}else if(b.dataset.save){let id=b.dataset.save;state.saved=state.saved.includes(id)?state.saved.filter(x=>x!==id):[...state.saved,id];store.set("saved",state.saved);const selected=state.saved.includes(id);b.classList.toggle("yes",selected);b.textContent=selected?"★":"☆";b.setAttribute("aria-pressed",String(selected));}else if(b.dataset.action==="theme"){state.light=!state.light;store.set("light",state.light);route()}else if(b.dataset.action==="size"){state.large=!state.large;store.set("large",state.large);route()}else if(b.dataset.back){if(currentRouteKey().startsWith("#/topic/")&&history.state?.pulsBack===true){history.back()}else location.hash="#/"+b.dataset.back}});
document.addEventListener("change",ev=>{if(ev.target.id==="num"){let num=ev.target.value.replace(/[^+0-9]/g,"");if(/^\+?[0-9]{2,7}$/.test(num)){state.num=num;store.set("num",num);route()}else{ev.target.value=state.num;alert(state.lang==="ru"?"Введите номер из 2–7 цифр":"Enter 2–7 digits")}}});
document.addEventListener("click",ev=>{const summary=ev.target.closest("#app details > summary");if(!summary||!currentRouteKey().startsWith("#/topic/"))return;const hash=currentRouteKey(),top=summary.getBoundingClientRect().top;requestAnimationFrame(()=>{if(summary.isConnected&&currentRouteKey()===hash){const delta=summary.getBoundingClientRect().top-top;if(Math.abs(delta)>2)window.scrollBy({top:delta,behavior:"instant"})}})},true);
document.addEventListener("click",ev=>{
 const link=ev.target.closest('a[href="#/sos"]');
 if(!link||currentRouteKey()!=="#/sos")return;
 if(ev.button!==0||ev.ctrlKey||ev.metaKey||ev.shiftKey||ev.altKey)return;
 ev.preventDefault();
 const input=$("#sos-search");
 if(input){input.value="";updateSosSearch("");input.blur()}
 document.querySelectorAll("#sos-browse details[open]").forEach(d=>d.open=false);
 restoreRouteScroll(0);
});
document.addEventListener("input",e=>{if(e.target.id==="review-q")updateReviewGallery()});
document.addEventListener("change",e=>{if(["review-kind","review-group"].includes(e.target.id))updateReviewGallery()});
document.addEventListener("click",e=>{if(e.target.id==="review-next"||e.target.id==="review-prev"){reviewOffset=Math.max(0,reviewOffset+(e.target.id==="review-next"?12:-12));updateReviewGallery(false);$("#review-count")?.scrollIntoView({block:"start",behavior:"instant"})}});
document.addEventListener("error",e=>{if(e.target.matches?.(".review-card img,.review-card video")){const p=document.createElement("p");p.textContent=state.lang==="ru"?"Файл не воспроизводится":"Media unavailable";e.target.replaceWith(p)}},true);
