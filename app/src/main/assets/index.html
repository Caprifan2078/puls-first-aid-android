:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:dark;--bg:#071822;--surface:#112733;--surface2:#173342;--border:#284753;--text:#ebf6f4;--muted:#99b3bd;--accent:#55dec5;--emergency:#f56772;--urgent:#ffd07e;--pill:#234451;--focus:#8df6dc;font-size:16px}

*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);padding-bottom:calc(90px + env(safe-area-inset-bottom));min-height:100vh}button,input{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}a{text-decoration:none;color:inherit}button{border:0}strong{font-weight:750}.appheader{position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--bg) 91%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}.head{height:68px;max-width:900px;margin:auto;padding:9px 16px;display:flex;align-items:center;justify-content:space-between}.logo{display:flex;gap:12px;align-items:center;font-weight:900;font-size:21px;letter-spacing:.2px}.logomark{display:grid;place-items:center;background:linear-gradient(145deg,#49dcc2,#129687);color:#06312f;border-radius:15px;width:41px;height:41px;font-size:29px;box-shadow:0 6px 21px #0ad1aa22}.smallinfo{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:1.3px}.topactions{display:flex;gap:7px;align-items:center}.topbtn{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:9px 11px;font-size:13px;font-weight:800}.shell{max-width:900px;margin:auto;padding:18px 15px 30px}.hero{background:linear-gradient(130deg,#123a42 10%,#155d5a 60%,#188a7d);border:1px solid #287b77;padding:24px 20px 20px;border-radius:24px;color:white;position:relative;overflow:hidden}.hero:after{content:"+";font-size:210px;opacity:.08;position:absolute;right:3px;top:-65px;font-weight:800}.kicker{font-size:11px;letter-spacing:1.5px;font-weight:800;color:#baf6e8}.hero h1{font-size:clamp(25px,6vw,35px);line-height:1.13;margin:10px 0}.hero p{margin:0 0 18px;font-size:14px;line-height:1.6;max-width:440px;color:#d6f4ed}.redbtn{display:inline-flex;align-items:center;gap:9px;background:#ed5362;color:white;font-weight:850;border-radius:13px;padding:13px 17px;box-shadow:0 6px 14px #4400051f}.sectiontop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:25px 1px 12px}.sectiontop h2{font-size:18px;margin:0}.minor{color:var(--muted);font-size:12px}.link{color:var(--accent);background:transparent;font-size:13px;font-weight:800;padding:8px}.searchbox{position:relative;display:block;margin:18px 0 0}.searchbox:before{content:"⌕";position:absolute;left:16px;top:9px;color:var(--muted);font-size:27px}.search{display:block;width:100%;background:var(--surface);border:1px solid var(--border);border-radius:15px;color:var(--text);padding:16px 15px 16px 47px;min-height:54px;outline:0}.search::placeholder{color:var(--muted)}.chiprow{display:flex;gap:8px;overflow-x:auto;padding:13px 0 5px;scrollbar-width:none}.chiprow::-webkit-scrollbar{display:none}.chip{border:1px solid var(--border);background:var(--pill);border-radius:40px;padding:10px 15px;white-space:nowrap;font-size:12px;font-weight:800}.chip.active{background:var(--accent);color:#09252d;border-color:transparent}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:11px}.tile{position:relative;display:flex;gap:13px;align-items:center;text-align:left;padding:15px;min-height:90px;width:100%;background:var(--surface);border:1px solid var(--border);border-radius:17px}.tile:active,.card:active{transform:scale(.992)}.tileicon{display:grid;place-items:center;flex:0 0 47px;height:47px;background:#1f635e;color:#8cf3e0;border-radius:14px;font-size:24px;font-weight:850}.tile .name{display:block;font-size:14px;font-weight:850;line-height:1.3}.tile .sub{display:block;font-size:11px;color:var(--muted);margin-top:5px}.arrow{margin-left:auto;color:var(--muted);font-size:22px}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.8px;color:var(--muted)}.eyebrow.danger{color:var(--emergency)}.eyebrow.warning{color:var(--urgent)}.banner{display:flex;align-items:flex-start;gap:11px;background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:13px;color:var(--muted);font-size:12px;line-height:1.45;margin-top:18px}.banner .symbol{font-size:19px}.screenhead h1{margin:7px 0;font-size:28px}.screenhead p{margin:6px 0 17px;font-size:14px;line-height:1.5;color:var(--muted)}.alert{background:#472a37;border:1px solid #99505d;border-radius:17px;padding:17px;line-height:1.5;color:#fff}.alert b{display:block;margin-bottom:5px}.alerts{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:15px}.stat b{display:block;font-size:24px;color:var(--accent);margin-bottom:3px}.stat span{font-size:12px;color:var(--muted)}.panel{background:var(--surface);border:1px solid var(--border);border-radius:19px;padding:17px;margin:15px 0}.panel h3{margin:0 0 12px;font-size:17px}.panel p{line-height:1.5;font-size:13px;color:var(--muted)}.kitcard{background:var(--surface);border:1px solid var(--border);border-radius:18px;margin:12px 0;overflow:hidden}.kithead{display:flex;justify-content:space-between;align-items:center;width:100%;padding:18px;text-align:left;background:transparent;font-weight:850}.kititems{border-top:1px solid var(--border);padding:7px 15px 14px}.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);font-size:14px}.item:last-child{border:0}.item input{width:20px;height:20px;accent-color:#36c8a9;flex-shrink:0}.item.checked{color:var(--muted);text-decoration:line-through}.progress{height:6px;background:var(--pill);border-radius:99px;overflow:hidden;margin-top:8px}.progress>i{display:block;background:var(--accent);height:100%}.settingline{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--border);padding:15px 0}.settingline:last-child{border:0}.settingline label{font-size:14px;font-weight:750}.settingline span{display:block;font-size:11px;color:var(--muted);margin-top:4px}.input{width:115px;max-width:45%;border:1px solid var(--border);background:var(--surface2);color:var(--text);padding:12px;border-radius:10px}.mini{padding:10px 13px;border:1px solid var(--border);border-radius:11px;background:var(--surface2);font-weight:800;font-size:12px}.articlehead{display:flex;align-items:flex-start;gap:12px;margin:14px 0 13px}.articlehead h1{font-size:27px;line-height:1.17;margin:6px 0 0}.back{background:var(--pill);border-radius:12px;padding:10px 13px;font-weight:800;font-size:12px}.sav{background:var(--surface2);border:1px solid var(--border);border-radius:13px;font-size:21px;min-width:46px;height:46px}.sav.yes{color:#ffcf7d}.step{display:flex;align-items:flex-start;gap:14px;padding:16px;margin:11px 0;border:1px solid var(--border);background:var(--surface);border-radius:15px;line-height:1.55;font-size:14px}.stepnum{width:30px;height:30px;flex:0 0 30px;background:#268a7c;color:white;border-radius:10px;display:grid;place-items:center;font-weight:900}.avoid{background:color-mix(in srgb,var(--surface) 75%,#bf394d);border:1px solid #9c4551;border-radius:16px;padding:17px;margin-top:18px}.avoid b{color:var(--emergency)}.avoid p{margin:8px 0 0;font-size:14px;line-height:1.5}.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;justify-content:center;gap:2px;background:color-mix(in srgb,var(--bg) 95%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--border);padding:7px max(8px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom));box-shadow:0 -5px 20px #00000014}.navinner{width:min(100%,900px);display:grid;grid-template-columns:repeat(5,1fr)}.navitem{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-width:0;background:transparent;border-radius:11px;padding:9px 2px 6px;color:var(--muted);font-size:10px;font-weight:800}.navitem span:first-child{font-size:22px;line-height:1}.navitem.active{background:var(--surface2);color:var(--accent)}.navitem.sos:not(.active){color:var(--emergency)}.empty{background:var(--surface);border:1px dashed var(--border);padding:30px 16px;border-radius:17px;text-align:center;color:var(--muted);font-size:14px}.skeleton{padding:50px;text-align:center}.tag{display:inline-block;padding:5px 8px;border-radius:7px;font-size:11px;background:var(--pill);font-weight:850;color:var(--muted)}.tag.critical{background:#602f39;color:#ffb9bf}.tag.urgent{background:#665030;color:#ffe4a1}.foot{font-size:11px;color:var(--muted);line-height:1.5;margin:20px 2px}.count{color:var(--muted);font-size:12px}a.redbtn:hover{background:#fa6272}
@media(min-width:680px){.shell{padding:26px 22px 35px}.tiles{grid-template-columns:repeat(3,1fr)}}@media(max-width:365px){.hero{padding:19px 16px}.navitem{font-size:9px}.head{padding-left:11px;padding-right:11px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}</style></head><body><header class="appheader"><div class="head"><a class="logo" href="#/home" aria-label="ПУЛЬС"><span class="logomark">✚</span><span>ПУЛЬС<div class="smallinfo">FIRST AID · OFFLINE</div></span></a><div class="topactions"><button class="topbtn" id="langbtn" aria-label="Change language">EN</button><a href="#/favorites" class="topbtn" aria-label="Избранное">☆</a></div></div></header><main id="app" class="shell"><div class="skeleton">ПУЛЬС · Загрузка…</div></main><nav class="nav" aria-label="Навигация"><div class="navinner" id="nav"></div></nav><script>
const PAGES=[{"id":"cpr","ru":"Нет сознания, нет дыхания","en":"Unresponsive and not breathing","level":"critical","aliases":"сердце не дышит реанимация cpr cardiac arrest","stepsRu":["Проверь безопасность места. Громко обратись к человеку, оцени реакцию.","Попроси вызвать экстренную службу и принести AED. Проверь нормальное дыхание не дольше 10 секунд.","Если нормального дыхания нет, начни надавливания по центру грудной клетки взрослого 100–120 раз/мин, глубина 5–6 см.","Включи AED и точно выполняй его голосовые команды. Продолжай до прибытия помощи."],"stepsEn":["Check scene safety, shout and check responsiveness.","Call emergency services and ask for an AED. Check normal breathing for no more than 10 seconds.","If not breathing normally, start adult chest compressions in the centre of the chest at 100–120/min, depth 5–6 cm.","Turn on the AED and follow its voice prompts. Continue until help takes over."],"avoidRu":"Не трать время на долгую проверку пульса; редкие судорожные вздохи не являются нормальным дыханием.","avoidEn":"Do not delay checking for a pulse; occasional gasps are not normal breathing.","category":"emergency","icon":"♥"},{"id":"stroke","ru":"Инсульт","en":"Stroke","level":"critical","aliases":"инсульт перекосило лицо речь рука fast stroke","stepsRu":["Вызови экстренную помощь немедленно; отметь, когда человека последний раз видели без симптомов.","Проверь лицо: попроси улыбнуться. Проверь руки: попроси поднять обе. Проверь речь: попроси повторить простую фразу.","Обеспечь покой, наблюдай за дыханием и сознанием до приезда помощи."],"stepsEn":["Call emergency services immediately; note the last known well time.","Check face (smile), both arms (raise) and speech (repeat a phrase).","Keep the person comfortable and monitor breathing and responsiveness until help arrives."],"avoidRu":"Не давай еду, воду или таблетки, если есть нарушения глотания.","avoidEn":"Do not give food, drinks or pills if swallowing may be impaired.","category":"emergency","icon":"⚡"},{"id":"heart","ru":"Подозрение на инфаркт","en":"Possible heart attack","level":"critical","aliases":"инфаркт боль в груди сдавливает грудь heart attack chest pain","stepsRu":["При боли или сдавлении груди, особенно с одышкой, потом, тошнотой или слабостью, вызови экстренную помощь.","Посади человека удобно, обеспечь покой, не позволяй идти пешком или самому ехать за рулём.","При потере сознания и отсутствии нормального дыхания начни СЛР и используй AED."],"stepsEn":["Call emergency services for chest pressure or pain, especially with sweating, breathlessness, nausea or weakness.","Let the person rest comfortably; do not allow them to drive themselves.","If unresponsive and not breathing normally, start CPR and use an AED."],"avoidRu":"Не задерживай вызов помощи ради самостоятельного поиска лекарства.","avoidEn":"Do not delay the call to find medication.","category":"emergency","icon":"♥"},{"id":"bleeding","ru":"Сильное кровотечение","en":"Severe bleeding","level":"critical","aliases":"кровь порез кровопотеря глубокая рана arterial bleeding cut","stepsRu":["Убедись в безопасности и вызови экстренную помощь при опасном кровотечении.","Прижми рану напрямую чистой повязкой, удерживай непрерывное давление.","Если кровотечение из конечности угрожает жизни и доступен жгут, используй сертифицированный жгут по инструкции, выше раны, не поверх сустава.","Запиши время наложения жгута, продолжай наблюдать за человеком."],"stepsEn":["Ensure scene safety and call emergency services for life-threatening bleeding.","Apply firm direct pressure to the wound with a clean dressing and keep pressure on.","For life-threatening limb bleeding, if a purpose-made tourniquet is available, apply it as instructed above the wound, not over a joint.","Record the tourniquet application time and keep monitoring the person."],"avoidRu":"Не ослабляй самостоятельно наложенный жгут; не вынимай глубоко застрявшие предметы.","avoidEn":"Do not loosen a tourniquet; do not remove deeply embedded objects.","category":"emergency","icon":"✚"},{"id":"choking","ru":"Человек подавился","en":"Choking","level":"critical","aliases":"подавился удушье не может говорить choking","stepsRu":["Если человек может кашлять и дышать, побуждай кашлять и следи за состоянием.","Если взрослый или ребёнок старше года не может нормально дышать/говорить, вызови экстренную помощь и применяй чередование 5 ударов между лопатками и 5 толчков в живот.","Если человек потерял сознание, начинай СЛР. Для младенцев до года применяется другой алгоритм."],"stepsEn":["If the person can cough and breathe, encourage coughing and observe.","If an adult or child over one year cannot breathe or speak, call emergency services and alternate 5 back blows with 5 abdominal thrusts.","If they become unresponsive, start CPR. Infants under one year need a different technique."],"avoidRu":"Не пытайся вслепую доставать предмет пальцами. Не применяй толчки в живот младенцам.","avoidEn":"Never perform a blind finger sweep. Never use abdominal thrusts on infants.","category":"emergency","icon":"◉"},{"id":"seizure","ru":"Судороги или эпилепсия","en":"Seizure","level":"critical","aliases":"эпилепсия судороги приступ convulsions epilepsy","stepsRu":["Убери опасные предметы, подложи мягкое под голову и засеки время.","Не удерживай движения и ничего не клади в рот.","Когда судороги закончились, проверь дыхание, при нормальном дыхании поверни на бок.","Вызови помощь при первом приступе, длительности около 5 минут или дольше, повторных приступах, травме или затруднении дыхания."],"stepsEn":["Move hazards away, cushion the head and time the seizure.","Do not restrain the person or put anything in their mouth.","When movements stop, check breathing and place on the side if breathing normally.","Call for help for a first seizure, one lasting 5 minutes or longer, repeated seizures, injury or breathing problems."],"avoidRu":"Не давай воду или таблетки, пока человек не пришёл полностью в сознание.","avoidEn":"Do not give water or pills until fully alert.","category":"emergency","icon":"✦"},{"id":"anaphylaxis","ru":"Анафилаксия","en":"Anaphylaxis","level":"critical","aliases":"аллергия отек горло адреналин anaphylaxis severe allergy","stepsRu":["При внезапном затруднении дыхания, отёке языка/горла или коллапсе немедленно вызывай экстренную помощь.","Помоги применить назначенный человеку автоинъектор адреналина в наружную часть бедра согласно инструкции устройства.","Уложи человека; при выраженной одышке разреши положение с вытянутыми ногами, которое облегчает дыхание.","Наблюдай за дыханием и состоянием до приезда помощи."],"stepsEn":["Call emergency services immediately for sudden breathing difficulty, tongue/throat swelling or collapse.","Assist with their prescribed epinephrine auto-injector into the outer thigh, following the device instructions.","Lay them flat; if breathing is difficult, allow a comfortable position with legs outstretched.","Monitor breathing and responsiveness until emergency care arrives."],"avoidRu":"Не заставляй человека резко вставать или ходить. Антигистаминные не заменяют адреналин.","avoidEn":"Do not let the person suddenly stand or walk. Antihistamines do not replace epinephrine.","category":"emergency","icon":"✧"},{"id":"poison","ru":"Отравление","en":"Poisoning","level":"critical","aliases":"отравился выпил химия таблетки передозировка poisoning overdose","stepsRu":["Убери источник воздействия, не подвергай себя опасности.","Вызови экстренную помощь или токсикологическую службу, особенно при нарушении сознания или дыхания.","Сохрани упаковку вещества и сообщи приблизительное время и количество.","При отсутствии дыхания действуй по алгоритму СЛР, если это безопасно."],"stepsEn":["Remove exposure without putting yourself at risk.","Contact emergency services or a poison centre, especially for reduced consciousness or breathing problems.","Keep the substance packaging and note approximate time and amount.","If not breathing normally, follow CPR guidance when safe."],"avoidRu":"Не вызывай рвоту. Не давай уголь, молоко или лекарства без указания специалиста.","avoidEn":"Do not induce vomiting. Do not give charcoal, milk or medications unless instructed by a professional.","category":"emergency","icon":"⚠"},{"id":"burn","ru":"Ожог","en":"Burn","level":"urgent","aliases":"обжёгся кипяток пар burn scald","stepsRu":["Прекрати воздействие тепла. Охлаждай ожог прохладной проточной водой 20 минут.","Сними украшения и тесную одежду рядом с ожогом, если она не прилипла.","Накрой чистой неприлипающей повязкой. Обратись за помощью при больших/глубоких ожогах, поражении лица, кистей, гениталий, химическом или электрическом ожоге."],"stepsEn":["Stop heat exposure. Cool the burn under cool running water for 20 minutes.","Remove jewellery and nearby tight clothing if not stuck to the skin.","Cover loosely with a clean non-stick dressing. Seek help for large/deep burns, face, hands, genitals, chemical or electrical burns."],"avoidRu":"Не прикладывай лёд, масло или кремы на свежий серьёзный ожог.","avoidEn":"Do not use ice, butter or creams on a fresh serious burn.","category":"injuries","icon":"♨"},{"id":"wound","ru":"Царапина и небольшой порез","en":"Minor scratch or cut","level":"common","aliases":"царапина ссадина порез ранка scratch abrasion cut","stepsRu":["Вымой руки. Промой рану чистой проточной водой.","Прижми чистой салфеткой, если кровоточит.","Закрой чистым пластырем или повязкой, если кожа повреждена; меняй при загрязнении.","Проверь необходимость прививки от столбняка и обращайся за помощью при глубокой, укушенной или сильно загрязнённой ране."],"stepsEn":["Wash hands and rinse the wound with clean running water.","Apply pressure with clean gauze if bleeding.","Cover broken skin with a clean dressing; change if dirty.","Check tetanus immunisation and seek care for deep, bite-related or heavily contaminated wounds."],"avoidRu":"Не зашивай глубокую рану самостоятельно.","avoidEn":"Do not suture a deep wound yourself.","category":"injuries","icon":"✚"},{"id":"fever","ru":"Жар и температура","en":"Fever","level":"common","aliases":"жар температура лихорадка fever hot temperature","stepsRu":["Оцени самочувствие, дыхание и уровень сознания, а не только температуру.","Пей воду, отдыхай и одевайся комфортно.","Если жар сопровождается спутанностью сознания, затруднением дыхания, сыпью, ригидностью шеи или сильным обезвоживанием, нужна срочная помощь.","Младенцам с температурой и людям с серьёзными заболеваниями может требоваться отдельная оценка."],"stepsEn":["Assess wellbeing, breathing and alertness, not just the number on a thermometer.","Drink fluids, rest and wear comfortable clothing.","Seek urgent help for fever with confusion, breathing difficulty, concerning rash, neck stiffness or severe dehydration.","Infants with fever and people with serious illness may need prompt individual assessment."],"avoidRu":"Не давай ребёнку лекарство по взрослой дозе. Дозы зависят от возраста, массы тела и концентрации препарата.","avoidEn":"Never use an adult dose for a child. Doses depend on age, weight and product strength.","category":"everyday","icon":"☀"},{"id":"headache","ru":"Болит голова","en":"Headache","level":"common","aliases":"головная боль мигрень голова болит headache","stepsRu":["При обычной умеренной боли попробуй отдохнуть, пить воду и уменьшить яркий свет.","Проверь, нет ли высокой температуры, рвоты, проблем со зрением или недавней травмы.","Внезапная сильнейшая головная боль, нарушение речи, слабость одной стороны тела или потеря сознания требуют экстренной помощи."],"stepsEn":["For mild headache, try rest, hydration and a quieter environment.","Check for fever, vomiting, vision changes or recent injury.","Sudden worst headache, speech problems, one-sided weakness or unconsciousness need emergency care."],"avoidRu":"Не маскируй внезапную необычную боль повторными обезболивающими без оценки.","avoidEn":"Do not repeatedly treat sudden unusual pain with painkillers without assessment.","category":"everyday","icon":"◉"},{"id":"asthma","ru":"Тяжёлый приступ астмы","en":"Severe asthma attack","level":"critical","aliases":"астма задыхается ингалятор asthma wheezing","stepsRu":["Помоги человеку сесть удобно, сохраняй спокойствие.","Помоги применить его собственный назначенный ингалятор согласно индивидуальному плану астмы.","Если трудно говорить, синюшные губы, сильная одышка или не становится лучше — немедленно вызови экстренную помощь."],"stepsEn":["Help the person sit upright and stay calm.","Assist with their own prescribed reliever inhaler according to their asthma action plan.","Call emergency services for inability to speak, blue lips, severe breathlessness or failure to improve."],"avoidRu":"Не оставляй человека одного; не заменяй назначенный ингалятор неизвестным препаратом.","avoidEn":"Do not leave them alone or substitute an unfamiliar medicine.","category":"emergency","icon":"☁"},{"id":"heatstroke","ru":"Тепловой удар","en":"Heatstroke","level":"critical","aliases":"перегрев солнце тепловой удар heat stroke","stepsRu":["Если у человека спутанность сознания, судороги или нарушение сознания на фоне жары — немедленно звони в экстренную службу.","Перенеси в прохладное место, сними лишнюю одежду.","Начинай быстро охлаждать прохладной водой, мокрой тканью и обдувом, пока помощь в пути.","Следи за дыханием и сознанием."],"stepsEn":["Call emergency services immediately for confusion, seizures or reduced consciousness in extreme heat.","Move to a cool place and remove excess clothing.","Begin rapid cooling with cool water, wet cloths and airflow while help is on the way.","Monitor breathing and alertness."],"avoidRu":"Не давай пить человеку без сознания или с нарушенным глотанием.","avoidEn":"Do not give drinks to anyone unconscious or unable to swallow safely.","category":"environment","icon":"☀"},{"id":"lowbloodsugar","ru":"Низкий сахар","en":"Low blood sugar","level":"urgent","aliases":"диабет гипогликемия трясёт потеет sugar low glucose","stepsRu":["Если человек с диабетом в сознании и может безопасно глотать, дай быстродействующий сахар по его плану лечения.","Повтори измерение сахара, если есть глюкометр, и следуй индивидуальным рекомендациям.","Если человек сонлив, без сознания, не может глотать или есть судороги, вызови экстренную помощь; следи за дыханием."],"stepsEn":["If awake and able to swallow safely, offer fast-acting sugar according to their diabetes plan.","Recheck glucose if a meter is available and follow individual instructions.","If drowsy, unconscious, unable to swallow or seizing, call emergency services and monitor breathing."],"avoidRu":"Никогда не вливай жидкость и не клади пищу в рот человеку без сознания.","avoidEn":"Never put liquids or food in an unconscious person's mouth.","category":"emergency","icon":"◈"},{"id":"child","ru":"Младенец: тревожные признаки","en":"Infant danger signs","level":"urgent","aliases":"грудничок младенец не дышит температура ребёнок baby infant","stepsRu":["При отсутствии нормального дыхания или сознания немедленно вызови экстренную помощь и следуй указаниям диспетчера по СЛР младенца.","При лихорадке у младенца младше трёх месяцев, вялости, плохом кормлении или выраженной одышке нужна срочная медицинская оценка.","Не используй взрослые приёмы при удушье и реанимации младенца."],"stepsEn":["Call emergency services immediately if the infant is unresponsive or not breathing normally; follow dispatcher infant CPR guidance.","For fever in infants under 3 months, lethargy, poor feeding or marked breathing difficulty, seek urgent medical assessment.","Infant choking and CPR techniques differ from adult techniques."],"avoidRu":"Не делай толчки в живот младенцу; не тряси ребёнка.","avoidEn":"Do not use abdominal thrusts on an infant or shake a baby.","category":"children","icon":"♡"},{"id":"nosebleed","ru":"Носовое кровотечение","en":"Nosebleed","level":"common","category":"injuries","aliases":"нос кровь из носа nose bleed","stepsRu":["Сядь и немного наклони голову вперёд.","Зажми мягкую часть носа непрерывно на 10–15 минут.","Если кровотечение сильное, после травмы или не останавливается — нужна медицинская помощь."],"stepsEn":["Sit upright and lean slightly forward.","Pinch the soft part of the nose continuously for 10–15 minutes.","Seek medical attention for heavy, traumatic or persistent bleeding."],"avoidRu":"Не запрокидывай голову назад.","avoidEn":"Do not tilt your head back.","icon":"✚"},{"id":"sprain","ru":"Растяжение связок","en":"Sprain","level":"common","category":"injuries","aliases":"подвернул ногу сустав растяжение sprain ankle","stepsRu":["Прекрати нагрузку и защити сустав от повторной травмы.","При необходимости приложи холод через ткань на короткие промежутки и обеспечь покой.","Если невозможно опереться на конечность, есть деформация или сильная боль — обратись к врачу."],"stepsEn":["Stop activity and protect the joint.","Use a wrapped cold pack briefly for comfort and rest.","Get medical assessment for inability to bear weight, deformity or severe pain."],"avoidRu":"Не пытайся вправить сустав самостоятельно.","avoidEn":"Do not attempt to relocate a joint yourself.","icon":"♧"},{"id":"fracture","ru":"Перелом или вывих","en":"Fracture or dislocation","level":"urgent","category":"injuries","aliases":"сломал руку ногу кость вывих fracture dislocation","stepsRu":["Останови движение повреждённой конечности.","Поддержи её в положении, в котором она находится, и организуй медицинскую помощь.","Если нарушено кровообращение, выраженная деформация или открытая рана — вызывай экстренную помощь."],"stepsEn":["Keep the injured limb still.","Support it in its current position and arrange medical evaluation.","Call emergency services for impaired circulation, major deformity or open fracture."],"avoidRu":"Не выпрямляй и не вправляй конечность силой.","avoidEn":"Do not force a bent limb straight or attempt realignment.","icon":"⊕"},{"id":"faint","ru":"Обморок","en":"Fainting","level":"common","category":"emergency","aliases":"упал в обморок потерял сознание faint collapse","stepsRu":["Оцени реакцию и нормальное дыхание.","Если человек дышит нормально и приходит в себя, уложи на спину и обеспечь доступ воздуха.","Если нет нормального дыхания — вызывай помощь и начинай СЛР. После необычного обморока нужна медицинская оценка."],"stepsEn":["Check responsiveness and normal breathing.","If breathing normally and recovering, lay the person down and monitor them.","If not breathing normally, call emergency services and start CPR. Arrange medical assessment for unexplained fainting."],"avoidRu":"Не поднимай человека резко на ноги.","avoidEn":"Do not force the person to stand up abruptly.","icon":"✦"},{"id":"unconscious","ru":"Без сознания, но дышит","en":"Unconscious but breathing","level":"critical","category":"emergency","aliases":"без сознания дышит recovery position unconscious","stepsRu":["Вызови экстренную помощь, проверь нормальное дыхание.","Если нет подозрения на травму позвоночника, аккуратно уложи в устойчивое боковое положение.","Непрерывно проверяй дыхание; при его остановке начинай СЛР."],"stepsEn":["Call emergency services and confirm normal breathing.","If no suspected spinal injury, gently place in the recovery position.","Keep checking breathing; start CPR if normal breathing stops."],"avoidRu":"Не оставляй человека одного. Не давай пить.","avoidEn":"Never leave them alone or give anything to drink.","icon":"✦"},{"id":"headinjury","ru":"Травма головы","en":"Head injury","level":"urgent","category":"injuries","aliases":"ударился головой сотрясение concussion head","stepsRu":["После удара оцени сознание, дыхание и выраженность симптомов.","При потере сознания, повторной рвоте, судорогах, нарастающей боли или спутанности немедленно обращайся за экстренной помощью.","Пока помощь в пути, избегай лишних движений головы и шеи."],"stepsEn":["Check consciousness, breathing and symptoms after injury.","Call emergency services for loss of consciousness, repeated vomiting, seizures, worsening pain or confusion.","Keep head and neck movement minimal while waiting."],"avoidRu":"Не оставляй человека с серьёзными симптомами без наблюдения.","avoidEn":"Do not leave a person with serious symptoms unattended.","icon":"◉"},{"id":"spine","ru":"Подозрение на травму позвоночника","en":"Possible spinal injury","level":"critical","category":"emergency","aliases":"шея спина позвоночник травма spinal injury","stepsRu":["Немедленно вызови экстренную помощь.","Не перемещай человека без необходимости, попроси его не двигаться.","Контролируй дыхание и сознание; при угрозе жизни действуй по указаниям диспетчера."],"stepsEn":["Call emergency services immediately.","Avoid unnecessary movement and ask the person to stay still.","Monitor breathing and responsiveness; follow emergency dispatcher instructions if life is threatened."],"avoidRu":"Не пытайся самостоятельно выправлять шею или спину.","avoidEn":"Do not attempt to straighten or manipulate the spine.","icon":"✚"},{"id":"animalbite","ru":"Укус животного","en":"Animal bite","level":"common","category":"injuries","aliases":"собака кошка укус animal bite rabies","stepsRu":["Промой место укуса большим количеством проточной воды с мылом.","Наложи чистую повязку, останови кровотечение прямым давлением.","Обратись за медицинской помощью для оценки риска бешенства, инфекции и столбняка."],"stepsEn":["Wash the bite thoroughly under running water with soap.","Apply a clean dressing and pressure for bleeding.","Seek medical advice about rabies, infection and tetanus risk."],"avoidRu":"Не откладывай оценку бешенства после неизвестного или дикого животного.","avoidEn":"Do not delay rabies assessment after an unknown or wild animal bite.","icon":"♧"},{"id":"insect","ru":"Укус или ужаление насекомого","en":"Insect sting or bite","level":"common","category":"everyday","aliases":"комар оса пчела укус насекомое bee sting insect","stepsRu":["Если жало видно в коже, осторожно удали его, не задерживая помощь.","Промой кожу, приложи прохладный компресс через ткань.","При отёке языка или горла, одышке или слабости вызывай экстренную помощь: возможна анафилаксия."],"stepsEn":["Remove a visible stinger promptly and gently.","Wash the skin and use a wrapped cool compress.","Call emergency services for throat swelling, breathing difficulty or collapse: possible anaphylaxis."],"avoidRu":"Не игнорируй быстро нарастающий отёк и затруднение дыхания.","avoidEn":"Do not ignore rapidly worsening swelling or breathing difficulty.","icon":"♧"},{"id":"tick","ru":"Присосался клещ","en":"Tick bite","level":"common","category":"everyday","aliases":"клещ укус клеща tick","stepsRu":["Аккуратно захвати клеща чистым пинцетом как можно ближе к коже.","Потяни ровно, без рывков. Очисти место укуса.","Если появляется расширяющееся покраснение, лихорадка или другие симптомы — обратись к врачу."],"stepsEn":["Use clean fine-tipped tweezers close to the skin.","Pull steadily without twisting. Clean the bite area.","Seek medical attention for spreading rash, fever or other symptoms."],"avoidRu":"Не прижигай клеща и не заливай маслом.","avoidEn":"Do not burn the tick or cover it in oil.","icon":"♧"},{"id":"dehydration","ru":"Обезвоживание","en":"Dehydration","level":"common","category":"everyday","aliases":"не хватает воды сухость жажда dehydration","stepsRu":["Пей небольшими порциями воду или раствор для пероральной регидратации, если можешь глотать.","При сильной жажде и слабости ограничь нагрузку, перейди в прохладное место.","При спутанности сознания, отсутствии мочи или неспособности пить нужна срочная медицинская помощь."],"stepsEn":["Sip water or oral rehydration solution if able to swallow.","Rest and move to a cooler place.","Seek urgent help for confusion, little or no urine, or inability to drink."],"avoidRu":"Не вливай жидкость человеку без сознания.","avoidEn":"Never give liquids by mouth to an unconscious person.","icon":"◈"},{"id":"vomit","ru":"Рвота","en":"Vomiting","level":"common","category":"everyday","aliases":"тошнота вырвало рвет nausea vomiting","stepsRu":["Отдыхай и пробуй частые маленькие глотки воды или раствора для регидратации.","Следи за признаками обезвоживания.","Кровь в рвоте, сильная боль, спутанность, симптомы у младенца — повод для срочной оценки."],"stepsEn":["Rest and take frequent small sips of water or oral rehydration solution.","Watch for dehydration.","Seek urgent care for blood in vomit, severe pain, confusion or concerning infant symptoms."],"avoidRu":"Не пытайся заставить пить большими объёмами сразу.","avoidEn":"Do not force large amounts of fluid at once.","icon":"◈"},{"id":"diarrhea","ru":"Диарея","en":"Diarrhoea","level":"common","category":"everyday","aliases":"понос жидкий стул живот diarrhea diarrhoea","stepsRu":["Пей жидкости и при необходимости раствор для регидратации.","Мой руки и избегай приготовления еды другим при кишечной инфекции.","Если есть кровь, сильное обезвоживание, выраженная боль или длительные симптомы — обратись к врачу."],"stepsEn":["Drink fluids and use oral rehydration solution if needed.","Wash hands and avoid preparing food for others during a stomach infection.","Seek medical advice for blood, severe dehydration, severe pain or persistent symptoms."],"avoidRu":"Не принимай антибиотики без назначения.","avoidEn":"Do not take antibiotics without medical advice.","icon":"◈"},{"id":"abdominal","ru":"Боль в животе","en":"Abdominal pain","level":"common","category":"everyday","aliases":"живот болит колет abdomen stomach pain","stepsRu":["Оцени силу, место и длительность боли.","Отдыхай, пей понемногу, если нет рвоты и можешь глотать.","Внезапная сильная боль, напряжение живота, обморок, кровь или беременность — повод для неотложной помощи."],"stepsEn":["Note the location, intensity and duration.","Rest and sip fluid if you can swallow without vomiting.","Sudden severe pain, rigid abdomen, fainting, blood or pregnancy need urgent evaluation."],"avoidRu":"Не пытайся заглушить сильную неизвестную боль бесконтрольными лекарствами.","avoidEn":"Do not mask severe unexplained pain with repeated uncontrolled medication.","icon":"◈"},{"id":"eye","ru":"Инородное тело в глазу","en":"Something in the eye","level":"common","category":"injuries","aliases":"соринка глаз пыль глаз болит eye foreign body","stepsRu":["Не три глаз.","При мелкой пыли осторожно промой глаз чистой водой или физраствором.","При застрявшем предмете, травме, химическом воздействии или ухудшении зрения срочно обратись за помощью."],"stepsEn":["Do not rub the eye.","For loose dust, gently rinse with clean water or sterile saline.","Seek urgent help for an embedded object, injury, chemicals or vision changes."],"avoidRu":"Не пытайся извлечь глубоко застрявший предмет.","avoidEn":"Never remove an embedded object yourself.","icon":"◉"},{"id":"chemical","ru":"Химический ожог","en":"Chemical burn","level":"critical","category":"emergency","aliases":"химия кислота щелочь химический ожог chemical","stepsRu":["Обеспечь собственную безопасность и вызови экстренную помощь при серьёзном воздействии.","Сними загрязнённую одежду, избегая контакта с веществом.","Промывай поражённую кожу большим количеством проточной воды; если вещество сухое, сначала аккуратно стряхни его, не касаясь руками.","При попадании в глаз немедленно длительно промывай водой и обратись за срочной помощью."],"stepsEn":["Protect yourself and call emergency services for serious exposure.","Remove contaminated clothing without touching the chemical.","Flush the skin with plenty of running water; gently brush away dry powder first without direct contact.","For eye exposure, rinse immediately and seek urgent evaluation."],"avoidRu":"Не смешивай вещества для «нейтрализации».","avoidEn":"Do not mix chemicals to try to neutralise them.","icon":"⚠"},{"id":"electric","ru":"Удар электрическим током","en":"Electric shock","level":"critical","category":"emergency","aliases":"ток ударило электричество lightning shock electricity","stepsRu":["Не прикасайся к человеку, пока источник тока не отключён.","Отключи питание, если безопасно, и вызови экстренную помощь.","Когда контакт безопасен, проверь сознание и дыхание; при необходимости начни СЛР и используй AED."],"stepsEn":["Do not touch the person while the power source is active.","Switch off power if safe and call emergency services.","Once safe, check responsiveness and breathing; start CPR and use AED if needed."],"avoidRu":"Не приближайся к высоковольтному оборудованию.","avoidEn":"Stay away from high-voltage equipment.","icon":"⚡"},{"id":"cold","ru":"Переохлаждение","en":"Hypothermia","level":"common","category":"environment","aliases":"замерз холод озноб переохлаждение cold hypothermia","stepsRu":["Перенеси человека в тёплое укрытие, сними мокрую одежду, укутай сухими слоями.","Давай тёплое питьё только если человек полностью в сознании и может глотать.","При спутанности, сильной сонливости или нарушении дыхания вызывай экстренную помощь."],"stepsEn":["Move into shelter, remove wet clothes and wrap in dry layers.","Offer a warm drink only when fully alert and able to swallow.","Call emergency services for confusion, extreme drowsiness or breathing problems."],"avoidRu":"Не растирай конечности и не грей резко сильным жаром.","avoidEn":"Do not rub limbs or apply intense direct heat.","icon":"❄"},{"id":"frostbite","ru":"Обморожение","en":"Frostbite","level":"common","category":"environment","aliases":"обморозил пальцы мороз frostbite","stepsRu":["Уйди с холода, сними мокрые или тесные вещи.","Защити участок от повторного охлаждения и обратись за медицинской оценкой при выраженном изменении цвета или онемении.","Не нагружай обмороженную стопу при возможности."],"stepsEn":["Get out of the cold and remove wet or tight clothing.","Protect the area from refreezing; seek medical assessment for discoloration or numbness.","Avoid walking on a badly frostbitten foot if possible."],"avoidRu":"Не растирай снегом, не используй открытый огонь.","avoidEn":"Do not rub with snow or heat over a flame.","icon":"❄"},{"id":"drowning","ru":"Человек тонет","en":"Drowning","level":"critical","category":"emergency","aliases":"утонул вода не дышит drowning","stepsRu":["Вызови экстренную помощь и не рискуй своей жизнью в воде.","Если возможно, используй спасательное средство и безопасно извлеки человека из воды.","Проверь нормальное дыхание, следуй инструкциям диспетчера; при отсутствии дыхания начни СЛР, особенно важны спасательные вдохи, если обучен."],"stepsEn":["Call emergency services and do not endanger yourself in the water.","Use a flotation aid and rescue safely if possible.","Check breathing and follow dispatcher instructions; if not breathing, start CPR. Rescue breaths are especially important if trained."],"avoidRu":"Не пытайся «выливать воду из лёгких».","avoidEn":"Do not try to drain water from the lungs.","icon":"≈"},{"id":"panic","ru":"Паническая атака","en":"Panic attack","level":"common","category":"everyday","aliases":"паника тревога страх сердцебиение anxiety panic","stepsRu":["Перейди в спокойное безопасное место и постарайся замедлить дыхание без задержек.","Назови несколько предметов вокруг, почувствуй опору ног — это помогает заземлиться.","При первой в жизни боли в груди, потере сознания или выраженной одышке нужна медицинская оценка."],"stepsEn":["Move to a quiet, safe place and slow breathing gently without breath-holding.","Name objects around you and feel your feet on the ground.","New chest pain, fainting or severe breathlessness need medical evaluation."],"avoidRu":"Не списывай новую сильную боль в груди на тревогу автоматически.","avoidEn":"Do not assume new severe chest pain is only anxiety.","icon":"♡"},{"id":"tooth","ru":"Зубная боль","en":"Toothache","level":"common","category":"everyday","aliases":"зуб болит dental toothache","stepsRu":["Аккуратно очисти рот и прополощи водой.","Избегай слишком горячего и холодного, договорись об осмотре стоматолога.","При отёке лица или шеи, лихорадке, затруднении дыхания или глотания нужна срочная помощь."],"stepsEn":["Rinse the mouth gently with water.","Avoid very hot or cold foods and arrange dental care.","Seek urgent care for face or neck swelling, fever, breathing or swallowing difficulties."],"avoidRu":"Не прикладывай таблетки к десне.","avoidEn":"Do not place pills directly onto gum tissue.","icon":"✚"},{"id":"childfever","ru":"Температура у ребёнка","en":"Fever in a child","level":"urgent","category":"children","aliases":"ребенок жар температура температура малыш child fever","stepsRu":["Следи за общим состоянием, дыханием, питьём и активностью.","Обеспечь комфорт, предлагай пить по возрасту.","При температуре у ребёнка до 3 месяцев, затруднении дыхания, сонливости, судорогах или необычной сыпи обратись за срочной медицинской оценкой."],"stepsEn":["Watch alertness, breathing, feeding and hydration.","Keep comfortable and offer age-appropriate fluids.","Urgent assessment is needed for fever in babies under 3 months, breathing difficulty, unusual drowsiness, seizures or concerning rash."],"avoidRu":"Не давай взрослую дозу лекарства ребёнку.","avoidEn":"Do not use adult medication doses for children.","icon":"♡"},{"id":"eyebleeding","ru":"Травма глаза","en":"Eye injury","level":"urgent","category":"injuries","aliases":"глаз травма удар кровь eye injury","stepsRu":["Не дави на глаз и не три его.","Если есть инородное тело, не извлекай его самостоятельно; защити глаз без давления.","При боли, ухудшении зрения, химическом воздействии или кровотечении — срочно за медицинской помощью."],"stepsEn":["Do not press or rub the eye.","Do not remove an embedded object; protect the eye without pressure.","Seek urgent care for pain, vision changes, chemical exposure or bleeding."],"avoidRu":"Не накладывай тугую повязку с давлением на глаз.","avoidEn":"Never apply a tight pressure dressing over the eye.","icon":"◉"},{"id":"dentalavulsion","ru":"Выбит постоянный зуб","en":"Knocked-out adult tooth","level":"urgent","category":"injuries","aliases":"выбил зуб сломал зуб knocked tooth","stepsRu":["Возьми выбитый постоянный зуб за коронку, не трогая корень.","Если загрязнён, кратко ополосни физраствором или молоком, не скреби.","Незамедлительно обратись к стоматологу. Для транспортировки держи зуб во влажной среде (например, молоке)."],"stepsEn":["Hold a knocked-out permanent tooth by the crown, not the root.","If dirty, gently rinse briefly in saline or milk, do not scrub.","Seek emergency dental care. Transport the tooth in milk or appropriate tooth storage solution."],"avoidRu":"Нельзя возвращать на место выбитый молочный зуб.","avoidEn":"Do not reimplant a knocked-out baby tooth.","icon":"✚"}];

rs.",moretxt:"Your preferences and saved guides.",sostitle:"Emergency first aid",sossub:"For life-threatening emergencies, call your local emergency number first.",steps:"What to do",doNot:"What NOT to do",none:"No matches found",back:"← Back",source:"Educational information only; seek professional advice when unsure.",find:"Search",ready:"prepared",settings:"Settings",local:"Preferences remain on this device.",number:"Emergency phone number",numdesc:"Default 112, works in the EU and some other countries",save:"Save",lang:"App language",contrast:"Light theme",fontsize:"Larger text",saved:"Saved guides",savedsub:"Guides you bookmarked.",emptyFav:"No saved guides yet. Open a guide and press ☆.",count:"topics",kitnote:"Indicative checklists. Check expiry dates and local regulations. Medication advice is individual.",warningSos:"Check the scene is safe before helping. Don't put yourself in danger.",country:"Change your local number under More.",offline:"Works offline",quick:"Common searches"}};
const CATS=[["all","Все","All"],["emergency","Экстренные","Emergency"],["injuries","Травмы","Injuries"],["everyday","Самочувствие","Everyday"],["environment","Окружающая среда","Environment"],["children","Дети","Children"]];
const store={get(k,d){try{let s=localStorage.getItem("puls3."+k);return s===null?d:JSON.parse(s)}catch(_){return d}},set(k,v){try{localStorage.setItem("puls3."+k,JSON.stringify(v));return true}catch(_){return false}}};
const state={lang:store.get("lang","ru")==="en"?"en":"ru",light:!!store.get("light",false),large:!!store.get("large",false),num:store.get("num","112"),saved:store.get("saved",[]),check:store.get("check",{}),q:"",cat:"all",kitOpen:"home"};
const $=s=>document.querySelector(s);
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const t=k=>I[state.lang][k]||k;
const caption=(p)=>p[state.lang]||p.ru;
const norm=s=>String(s||"").toLowerCase().replace(/ё/g,"е").replace(/[^a-zа-яa-z0-9 ]/ig," ").replace(/\s+/g," ").trim();
const match=(p,q)=>{const query=norm(q).split(" ").filter(Boolean);const hay=norm(p.ru+" "+p.en+" "+p.aliases+" "+(p.stepsRu||[]).join(" ")+" "+(p.stepsEn||[]).join(" "));return query.every(w=>hay.includes(w)||(w.length>=4&&hay.split(" ").some(z=>z.startsWith(w.slice(0,4)))))};
const dial=()=>'<a class="redbtn" href="tel:'+esc(state.num)+'" aria-label="'+esc(t("call"))+'">☎ '+esc(state.num)+' · '+esc(t("call"))+'</a>';
const warn=()=>'<div class="banner"><span class="symbol">ⓘ</span><span>'+esc(t("warning"))+'</span></div>';
const tag=p=>'<span class="tag '+p.level+'">'+(p.level==="critical"?"SOS":p.level==="urgent"?(state.lang==="ru"?"ВАЖНО":"URGENT"):(state.lang==="ru"?"ИНСТРУКЦИЯ":"GUIDE"))+'</span>';
const card=p=>'<a class="tile" href="#/topic/'+encodeURIComponent(p.id)+'"><span class="tileicon" aria-hidden="true">'+esc(p.icon)+'</span><span style="flex:1;min-width:0"><span class="name">'+esc(caption(p))+'</span><span class="sub">'+(p.level==="critical"?"● SOS":p.level==="urgent"?"◐ "+(state.lang==="ru"?"Важно":"Urgent"):"↗ "+(state.lang==="ru"?"Пошагово":"Step by step"))+'</span></span><span class="arrow">›</span></a>';
const categoryButtons=()=>'<div class="chiprow">'+CATS.map(c=>'<button class="chip '+(state.cat===c[0]?"active":"")+'" data-cat="'+c[0]+'">'+esc(c[state.lang==="ru"?1:2])+'</button>').join("")+'</div>';
const search=()=>'<label class="searchbox"><input id="search" class="search" type="search" autocomplete="off" placeholder="'+esc(t("q"))+'" value="'+esc(state.q)+'" aria-label="'+esc(t("find"))+'"></label>';
const title=(h,p)=>'<div class="screenhead"><div class="kicker" style="color:var(--accent)">ПУЛЬС · OFFLINE</div><h1>'+esc(h)+'</h1><p>'+esc(p)+'</p></div>';
function renderHome(){const priority=["cpr","stroke","bleeding","choking","heart","anaphylaxis"].map(id=>PAGES.find(x=>x.id===id)).filter(Boolean);
return '<section class="hero"><span class="kicker">'+esc(t("offline")).toUpperCase()+'</span><h1>'+esc(t("slogan"))+'</h1><p>'+esc(t("hero"))+'</p>'+dial()+'</section>'+search()+'<div class="sectiontop"><h2>'+esc(t("fast"))+'</h2><a class="link" href="#/sos">'+esc(t("show"))+' →</a></div><div class="tiles">'+priority.map(card).join("")+'</div><div class="sectiontop"><h2>'+esc(t("browse"))+'</h2><a href="#/catalog" class="link">'+t("all")+' →</a></div><div class="alerts"><div class="stat"><b>'+PAGES.length+'</b><span>'+esc(t("count"))+'</span></div><div class="stat"><b>3</b><span>'+esc(t("kits"))+'</span></div></div>'+warn();}
function renderSos(){const urgent=PAGES.filter(p=>p.level==="critical");return title(t("sostitle"),t("sossub"))+'<div class="alert"><b>⚠ '+esc(t("warningSos"))+'</b><div style="margin:13px 0">'+dial()+'</div><div style="font-size:12px;opacity:.82">'+esc(t("country"))+'</div></div><div class="sectiontop"><h2>'+esc(t("fast"))+'</h2><span class="count">'+urgent.length+'</span></div><div class="tiles">'+urgent.map(card).join("")+'</div>'+warn();}
function renderCatalog(){let arr=PAGES.filter(p=>(state.cat==="all"||p.category===state.cat)&&(!state.q||match(p,state.q)));return title(t("catalog"),t("browse"))+search()+categoryButtons()+'<div class="sectiontop"><h2>'+esc(t("all"))+'</h2><span class="count" id="resultcount">'+arr.length+' '+t("count")+'</span></div><div id="results" class="tiles">'+(arr.length?arr.map(card).join(""):'<div class="empty">'+esc(t("none"))+'</div>')+'</div>'+warn();}
function renderKits(){return title(t("kits"),t("kitnote"))+KITS.map(k=>{const sum=k.items.filter((it,i)=>state.check[k.id+":"+i]).length;const open=state.kitOpen===k.id;return '<section class="kitcard"><button class="kithead" data-kit="'+k.id+'"><span>'+esc(k[state.lang])+'<span class="minor" style="display:block;margin-top:5px">'+sum+' / '+k.items.length+' '+esc(t("ready"))+'</span></span><span>'+ (open?"▾":"›")+'</span></button><div style="padding:0 18px 13px"><div class="progress"><i style="width:'+(sum/k.items.length*100).toFixed(1)+'%"></i></div></div>'+(open?'<div class="kititems">'+k.items.map((it,i)=>{let checked=!!state.check[k.id+":"+i];return '<label class="item '+(checked?"checked":"")+'"><input type="checkbox" data-check="'+k.id+":"+i+'" '+(checked?"checked":"")+'><span>'+esc(it[state.lang==="ru"?0:1])+'</span></label>'}).join("")+'</div>':"")+'</section>'}).join("")+warn();}
function renderMore(){return title(t("more"),t("moretxt"))+'<div class="panel"><h3>'+esc(t("settings"))+'</h3><div class="settingline"><div><label for="num">'+esc(t("number"))+'</label><span>'+esc(t("numdesc"))+'</span></div><input id="num" class="input" inputmode="tel" maxlength="9" value="'+esc(state.num)+'"></div><div class="settingline"><div><label>'+esc(t("lang"))+'</label></div><button class="mini" data-action="lang">'+(state.lang==="ru"?"Русский ↔ English":"English ↔ Русский")+'</button></div><div class="settingline"><div><label>'+esc(t("contrast"))+'</label></div><button class="mini" data-action="theme">'+(state.light?"● ON":"○ OFF")+'</button></div><div class="settingline"><div><label>'+esc(t("fontsize"))+'</label></div><button class="mini" data-action="size">'+(state.large?"● ON":"○ OFF")+'</button></div><p>'+esc(t("local"))+'</p></div><a class="tile" href="#/favorites"><span class="tileicon">☆</span><span style="flex:1"><span class="name">'+esc(t("favorites"))+'</span><span class="sub">'+state.saved.length+' '+esc(t("count"))+'</span></span><span class="arrow">›</span></a>'+warn();}
function renderFavorites(){let ar=PAGES.filter(p=>state.saved.includes(p.id));return '<button class="back" data-back="more">'+esc(t("back"))+'</button>'+title(t("favorites"),t("savedsub"))+'<div class="tiles">'+(ar.length?ar.map(card).join(""):'<div class="empty">'+esc(t("emptyFav"))+'</div>')+'</div>'}
function renderTopic(p){const steps=state.lang==="ru"?p.stepsRu:p.stepsEn;return '<button class="back" id="back" data-back="catalog">'+esc(t("back"))+'</button><div class="articlehead"><div style="flex:1">'+tag(p)+'<h1>'+esc(caption(p))+'</h1></div><button class="sav '+(state.saved.includes(p.id)?"yes":"")+'" data-save="'+p.id+'" aria-label="Save guide">'+(state.saved.includes(p.id)?"★":"☆")+'</button></div>'+(p.level!=="common"?'<div class="alert">'+dial()+'<div style="margin-top:10px;font-size:12px">'+esc(t("country"))+'</div></div>':"")+'<div class="sectiontop"><h2>'+esc(t("steps"))+'</h2><span class="minor">'+steps.length+' '+(state.lang==="ru"?"шага":"steps")+'</span></div>'+steps.map((x,i)=>'<div class="step"><span class="stepnum">'+(i+1)+'</span><span>'+esc(x)+'</span></div>').join("")+'<div class="avoid"><b>⚠ '+esc(t("doNot"))+'</b><p>'+esc(state.lang==="ru"?p.avoidRu:p.avoidEn)+'</p></div><p class="foot">'+esc(t("source"))+'</p>';}
function drawNav(route){const current=route==="favorites"?"more":route==="topic"?"catalog":route;$("#nav").innerHTML=NAV.map(n=>'<a href="#/'+n[0]+'" class="navitem '+(current===n[0]?"active":"")+' '+(n[0]==="sos"?"sos":"")+'" '+(current===n[0]?'aria-current="page"':'')+'><span aria-hidden="true">'+n[1]+'</span><span>'+esc(n[state.lang==="ru"?2:3])+'</span></a>').join("")}
function route(){let parts=location.hash.replace(/^#\/?/,"").split("/");let page=parts[0]||"home";let content="";let topic=page==="topic"?PAGES.find(p=>p.id===decodeURIComponent(parts[1]||"")):null;if(page==="topic"&&!topic)page="catalog";document.documentElement.lang=state.lang;document.body.classList.toggle("light",state.light);document.documentElement.style.fontSize=state.large?"18px":"16px";$("#langbtn").textContent=state.lang==="ru"?"EN":"RU";let navpage=page;if(page==="topic")content=renderTopic(topic);else if(page==="home")content=renderHome();else if(page==="sos")content=renderSos();else if(page==="catalog")content=renderCatalog();else if(page==="kits")content=renderKits();else if(page==="more")content=renderMore();else if(page==="favorites")content=renderFavorites();else{location.hash="#/home";return}$("#app").innerHTML=content;drawNav(navpage);window.scrollTo(0,0);}
function liveSearch(){const q=$("#search");if(!q)return;state.q=q.value;let here=location.hash.split("/")[1];if(here==="home"&&!state.q.trim())return;if(here==="home"&&state.q.trim()){state.cat="all";location.hash="#/catalog";return}if(here==="catalog"){let arr=PAGES.filter(p=>(state.cat==="all"||p.category===state.cat)&&(!state.q||match(p,state.q)));$("#results").innerHTML=arr.length?arr.map(card).join(""):'<div class="empty">'+esc(t("none"))+'</div>';$("#resultcount").textContent=arr.length+" "+t("count")}}
document.addEventListener("input",ev=>{if(ev.target.id==="search")liveSearch()});
document.addEventListener("change",ev=>{if(ev.target.matches("[data-check]")){state.check[ev.target.dataset.check]=ev.target.checked;store.set("check",state.check);let y=window.scrollY;route();window.scrollTo(0,y)}});
document.addEventListener("click",ev=>{let b=ev.target.closest("button");if(!b)return;if(b.id==="langbtn"||b.dataset.action==="lang"){state.lang=state.lang==="ru"?"en":"ru";store.set("lang",state.lang);route()}else if(b.dataset.cat){state.cat=b.dataset.cat;let input=$("#search");if(input)state.q=input.value;let y=window.scrollY;route();window.scrollTo(0,y)}else if(b.dataset.kit){state.kitOpen=state.kitOpen===b.dataset.kit?"":b.dataset.kit;let y=window.scrollY;route();window.scrollTo(0,y)}else if(b.dataset.save){let id=b.dataset.save;state.saved=state.saved.includes(id)?state.saved.filter(x=>x!==id):[...state.saved,id];store.set("saved",state.saved);route()}else if(b.dataset.action==="theme"){state.light=!state.light;store.set("light",state.light);route()}else if(b.dataset.action==="size"){state.large=!state.large;store.set("large",state.large);route()}else if(b.dataset.back){if(history.length>1)history.back();else location.hash="#/"+b.dataset.back}});
document.addEventListener("change",ev=>{if(ev.target.id==="num"){let num=ev.target.value.replace(/[^+0-9]/g,"");if(/^\+?[0-9]{2,7}$/.test(num)){state.num=num;store.set("num",num);route()}else{ev.target.value=state.num;alert(state.lang==="ru"?"Введите номер из 2–7 цифр":"Enter 2–7 digits")}}});
window.addEventListener("hashchange",route);if(!location.hash)history.replaceState(null,"","#/home");route();
</script></body></html>
