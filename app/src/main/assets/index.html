olid var(--accent);outline-offset:2px}.aid-media{scroll-margin-block:16px}</style></head><body><header class="appheader"><div class="head"><a class="logo" href="#/home" aria-label="ПУЛЬС"><span class="logomark">✚</span><span>ПУЛЬС<div class="smallinfo">FIRST AID · OFFLINE</div></span></a><div class="topactions"><button class="topbtn" id="langbtn" aria-label="Change language">EN</button></div></div></header><main id="app" class="shell"><div class="skeleton">ПУЛЬС · Загрузка…</div></main><nav class="nav" aria-label="Навигация"><div class="navinner" id="nav"></div></nav><script>
const PAGES=[{"id":"cpr","ru":"Нет сознания, нет дыхания","en":"Unresponsive and not breathing","level":"critical","aliases":"сердце не дышит реанимация cpr cardiac arrest","stepsRu":["Убедись, что подходить безопасно. Проверь, реагирует ли человек.","Если реакции нет, сразу вызови экстренную службу, включи громкую связь и оцени дыхание. Попроси окружающих принести дефибриллятор (AED).","Если взрослый без сознания и не дышит нормально, немедленно начни надавливания на нижнюю половину грудины: 100–120 в минуту, глубина 5–6 см. После каждого надавливания полностью освобождай грудную клетку.","Если обучен искусственному дыханию, чередуй 30 надавливаний и 2 вдоха. Иначе продолжай непрерывные надавливания. Следуй указаниям диспетчера.","Как только доступен AED, включи его и выполняй команды. Продолжай, пока помощь не примет пострадавшего, не восстановится нормальное дыхание или ты не будешь физически способен продолжать."],"stepsEn":["Make sure it is safe to approach. Check responsiveness.","If unresponsive, call emergency services immediately on speakerphone and assess breathing. Ask bystanders to bring an AED.","If an adult is unresponsive and breathing abnormally, start compressions on the lower half of the breastbone at 100–120 per minute and 5–6 cm deep. Allow the chest to recoil fully.","If trained in rescue breaths, alternate 30 compressions and 2 breaths. Otherwise keep compressing continuously. Follow the call handler's instructions.","Switch on the AED as soon as it is available and follow its prompts. Continue until professionals take over, normal breathing returns or you are physically unable to continue."],"avoidRu":"Не задерживай вызов ради проверки пульса. Редкие судорожные вздохи — не нормальное дыхание.","avoidEn":"Do not delay calling to check a pulse. Occasional gasps are not normal breathing.","category":"emergency","icon":"♥"},{"id":"stroke","ru":"Инсульт","en":"Stroke","level":"critical","aliases":"инсульт перекосило лицо речь рука fast stroke","stepsRu":["Вызови экстренную помощь немедленно; отметь, когда человека последний раз видели без симптомов.","Проверь лицо: попроси улыбнуться. Проверь руки: попроси поднять обе. Проверь речь: попроси повторить простую фразу.","Обеспечь покой, наблюдай за дыханием и сознанием до приезда помощи."],"stepsEn":["Call emergency services immediately; note the last known well time.","Check face (smile), both arms (raise) and speech (repeat a phrase).","Keep the person comfortable and monitor breathing and responsiveness until help arrives."],"avoidRu":"Не давай еду, воду или таблетки, если есть нарушения глотания.","avoidEn":"Do not give food, drinks or pills if swallowing may be impaired.","category":"emergency","icon":"⚡"},{"id":"heart","ru":"Подозрение на инфаркт","en":"Possible heart attack","level":"critical","aliases":"инфаркт боль в груди сдавливает грудь heart attack chest pain","stepsRu":["При боли или сдавлении груди, особенно с одышкой, потом, тошнотой или слабостью, вызови экстренную помощь.","Посади человека удобно, обеспечь покой, не позволяй идти пешком или самому ехать за рулём.","При потере сознания и отсутствии нормального дыхания начни СЛР и используй AED."],"stepsEn":["Call emergency services for chest pressure or pain, especially with sweating, breathlessness, nausea or weakness.","Let the person rest comfortably; do not allow them to drive themselves.","If unresponsive and not breathing normally, start CPR and use an AED."],"avoidRu":"Не задерживай вызов помощи ради самостоятельного поиска лекарства.","avoidEn":"Do not delay the call to find medication.","category":"emergency","icon":"♥"},{"id":"bleeding","ru":"Сильное кровотечение","en":"Severe bleeding","level":"critical","aliases":"кровь порез кровопотеря глубокая рана arterial bleeding cut","stepsRu":["Убедись в безопасности и вызови экстренную помощь при опасном кровотечении.","Прижми рану напрямую чистой повязкой, удерживай непрерывное давление.","Если кровотечение из конечности угрожает жизни и доступен жгут, используй сертифицированный жгут по инструкции, выше раны, не поверх сустава.","Запиши время наложения жгута, продолжай наблюдать за человеком."],"stepsEn":["Ensure scene safety and call emergency services for life-threatening bleeding.","Apply firm direct pressure to the wound with a clean dressing and keep pressure on.","For life-threatening limb bleeding, if a purpose-made tourniquet is available, apply it as instructed above the wound, not over a joint.","Record the tourniquet application time and keep monitoring the person."],"avoidRu":"Не ослабляй самостоятельно наложенный жгут; не вынимай глубоко застрявшие предметы.","avoidEn":"Do not loosen a tourniquet; do not remove deeply embedded objects.","category":"emergency","icon":"✚"},{"id":"choking","ru":"Человек подавился","en":"Choking","level":"critical","aliases":"подавился удушье не может говорить choking","stepsRu":["Если человек может кашлять и дышать, побуждай кашлять и следи за состоянием.","Если взрослый или ребёнок старше года не может нормально дышать/говорить, вызови экстренную помощь и применяй чередование 5 ударов между лопатками и 5 толчков в живот.","Если человек потерял сознание, начинай СЛР. Для младенцев до года применяется другой алгоритм.","Для младенца до года открой отдельный алгоритм. После толчков в живот или надавливаний на грудную клетку необходим медицинский осмотр."],"stepsEn":["If the person can cough and breathe, encourage coughing and observe.","If an adult or child over one year cannot breathe or speak, call emergency services and alternate 5 back blows with 5 abdominal thrusts.","If they become unresponsive, start CPR. Infants under one year need a different technique.","For infants under one year, use the separate infant guide. Medical assessment is needed after abdominal thrusts or chest compressions."],"avoidRu":"Не пытайся вслепую доставать предмет пальцами. Не применяй толчки в живот младенцам.","avoidEn":"Never perform a blind finger sweep. Never use abdominal thrusts on infants.","category":"emergency","icon":"◉"},{"id":"seizure","ru":"Судороги или эпилепсия","en":"Seizure","level":"critical","aliases":"эпилепсия судороги приступ convulsions epilepsy","stepsRu":["Убери опасные предметы, подложи мягкое под голову и засеки время.","Не удерживай движения и ничего не клади в рот.","Когда судороги закончились, проверь дыхание, при нормальном дыхании поверни на бок.","Вызови помощь при первом приступе, длительности около 5 минут или дольше, повторных приступах, травме или затруднении дыхания."],"stepsEn":["Move hazards away, cushion the head and time the seizure.","Do not restrain the person or put anything in their mouth.","When movements stop, check breathing and place on the side if breathing normally.","Call for help for a first seizure, one lasting 5 minutes or longer, repeated seizures, injury or breathing problems."],"avoidRu":"Не давай воду или таблетки, пока человек не пришёл полностью в сознание.","avoidEn":"Do not give water or pills until fully alert.","category":"emergency","icon":"✦"},{"id":"anaphylaxis","ru":"Анафилаксия","en":"Anaphylaxis","level":"critical","aliases":"аллергия отек горло адреналин anaphylaxis severe allergy","stepsRu":["При внезапном затруднении дыхания, отёке языка/горла или коллапсе немедленно вызывай экстренную помощь.","Помоги применить назначенный человеку автоинъектор адреналина в наружную часть бедра согласно инструкции устройства.","Уложи человека; при выраженной одышке разреши положение с вытянутыми ногами, которое облегчает дыхание.","Если через 5 минут улучшения нет и доступен второй автоинъектор, помоги применить его согласно указаниям диспетчера и инструкции.","Наблюдай за дыханием и состоянием до приезда помощи."],"stepsEn":["Call emergency services immediately for sudden breathing difficulty, tongue/throat swelling or collapse.","Assist with their prescribed epinephrine auto-injector into the outer thigh, following the device instructions.","Lay them flat; if breathing is difficult, allow a comfortable position with legs outstretched.","If symptoms persist after five minutes and a second autoinjector is available, assist with its use following dispatcher and device instructions.","Monitor breathing and responsiveness until emergency care arrives."],"avoidRu":"Не заставляй человека резко вставать или ходить. Антигистаминные не заменяют адреналин.","avoidEn":"Do not let the person suddenly stand or walk. Antihistamines do not replace epinephrine.","category":"emergency","icon":"✧"},{"id":"poison","ru":"Отравление","en":"Poisoning","level":"critical","aliases":"отравился выпил химия таблетки передозировка poisoning overdose","stepsRu":["Убери источник воздействия, не подвергай себя опасности.","Вызови экстренную помощь или токсикологическую службу, особенно при нарушении сознания или дыхания.","Сохрани упаковку вещества и сообщи приблизительное время и количество.","При отсутствии дыхания действуй по алгоритму СЛР, если это безопасно."],"stepsEn":["Remove exposure without putting yourself at risk.","Contact emergency services or a poison centre, especially for reduced consciousness or breathing problems.","Keep the substance packaging and note approximate time and amount.","If not breathing normally, follow CPR guidance when safe."],"avoidRu":"Не вызывай рвоту. Не давай уголь, молоко или лекарства без указания специалиста.","avoidEn":"Do not induce vomiting. Do not give charcoal, milk or medications unless instructed by a professional.","category":"emergency","icon":"⚠"},{"id":"burn","ru":"Ожог","en":"Burn","level":"urgent","aliases":"обжёгся кипяток пар burn scald","stepsRu":["Прекрати воздействие тепла. Охлаждай ожог прохладной проточной водой 20 минут.","Сними украшения и тесную одежду рядом с ожогом, если она не прилипла.","Накрой чистой неприлипающей повязкой. Обратись за помощью при больших/глубоких ожогах, поражении лица, кистей, гениталий, химическом или электрическом ожоге."],"stepsEn":["Stop heat exposure. Cool the burn under cool running water for 20 minutes.","Remove jewellery and nearby tight clothing if not stuck to the skin.","Cover loosely with a clean non-stick dressing. Seek help for large/deep burns, face, hands, genitals, chemical or electrical burns."],"avoidRu":"Не прикладывай лёд, масло или кремы на свежий серьёзный ожог.","avoidEn":"Do not use ice, butter or creams on a fresh serious burn.","category":"injuries","icon":"♨"},{"id":"wound","ru":"Царапина и небольшой порез","en":"Minor scratch or cut","level":"common","aliases":"царапина ссадина порез ранка scratch abrasion cut","stepsRu":["Вымой руки. Промой рану чистой проточной водой.","Прижми чистой салфеткой, если кровоточит.","Закрой чистым пластырем или повязкой, если кожа повреждена; меняй при загрязнении.","Проверь необходимость прививки от столбняка и обращайся за помощью при глубокой, укушенной или сильно загрязнённой ране."],"stepsEn":["Wash hands and rinse the wound with clean running water.","Apply pressure with clean gauze if bleeding.","Cover broken skin with a clean dressing; change if dirty.","Check tetanus immunisation and seek care for deep, bite-related or heavily contaminated wounds."],"avoidRu":"Не зашивай глубокую рану самостоятельно.","avoidEn":"Do not suture a deep wound yourself.","category":"injuries","icon":"✚"},{"id":"fever","ru":"Жар и температура","en":"Fever","level":"common","aliases":"жар температура лихорадка fever hot temperature","stepsRu":["Оцени самочувствие, дыхание и уровень сознания, а не только температуру.","Пей воду, отдыхай и одевайся комфортно.","Если жар сопровождается спутанностью сознания, затруднением дыхания, сыпью, ригидностью шеи или сильным обезвоживанием, нужна срочная помощь.","Младенцам с температурой и людям с серьёзными заболеваниями может требоваться отдельная оценка."],"stepsEn":["Assess wellbeing, breathing and alertness, not just the number on a thermometer.","Drink fluids, rest and wear comfortable clothing.","Seek urgent help for fever with confusion, breathing difficulty, concerning rash, neck stiffness or severe dehydration.","Infants with fever and people with serious illness may need prompt individual assessment."],"avoidRu":"Не давай ребёнку лекарство по взрослой дозе. Дозы зависят от возраста, массы тела и концентрации препарата.","avoidEn":"Never use an adult dose for a child. Doses depend on age, weight and product strength.","category":"everyday","icon":"☀"},{"id":"headache","ru":"Болит голова","en":"Headache","level":"common","aliases":"головная боль мигрень голова болит headache","stepsRu":["При обычной умеренной боли попробуй отдохнуть, пить воду и уменьшить яркий свет.","Проверь, нет ли высокой температуры, рвоты, проблем со зрением или недавней травмы.","Внезапная сильнейшая головная боль, нарушение речи, слабость одной стороны тела или потеря сознания требуют экстренной помощи."],"stepsEn":["For mild headache, try rest, hydration and a quieter environment.","Check for fever, vomiting, vision changes or recent injury.","Sudden worst headache, speech problems, one-sided weakness or unconsciousness need emergency care."],"avoidRu":"Не маскируй внезапную необычную боль повторными обезболивающими без оценки.","avoidEn":"Do not repeatedly treat sudden unusual pain with painkillers without assessment.","category":"everyday","icon":"◉"},{"id":"asthma","ru":"Тяжёлый приступ астмы","en":"Severe asthma attack","level":"critical","aliases":"астма задыхается ингалятор asthma wheezing","stepsRu":["Помоги человеку сесть удобно, сохраняй спокойствие.","Помоги применить его собственный назначенный ингалятор согласно индивидуальному плану астмы.","Если трудно говорить, синюшные губы, сильная одышка или не становится лучше — немедленно вызови экстренную помощь."],"stepsEn":["Help the person sit upright and stay calm.","Assist with their own prescribed reliever inhaler according to their asthma action plan.","Call emergency services for inability to speak, blue lips, severe breathlessness or failure to improve."],"avoidRu":"Не оставляй человека одного; не заменяй назначенный ингалятор неизвестным препаратом.","avoidEn":"Do not leave them alone or substitute an unfamiliar medicine.","category":"emergency","icon":"☁"},{"id":"heatstroke","ru":"Тепловой удар","en":"Heatstroke","level":"critical","aliases":"перегрев солнце тепловой удар heat stroke","stepsRu":["Если у человека спутанность сознания, судороги или нарушение сознания на фоне жары — немедленно звони в экстренную службу.","Перенеси в прохладное место, сними лишнюю одежду.","Начинай быстро охлаждать прохладной водой, мокрой тканью и обдувом, пока помощь в пути.","Следи за дыханием и сознанием."],"stepsEn":["Call emergency services immediately for confusion, seizures or reduced consciousness in extreme heat.","Move to a cool place and remove excess clothing.","Begin rapid cooling with cool water, wet cloths and airflow while help is on the way.","Monitor breathing and alertness."],"avoidRu":"Не давай пить человеку без сознания или с нарушенным глотанием.","avoidEn":"Do not give drinks to anyone unconscious or unable to swallow safely.","category":"environment","icon":"☀"},{"id":"lowbloodsugar","ru":"Низкий сахар","en":"Low blood sugar","level":"urgent","aliases":"диабет гипогликемия трясёт потеет sugar low glucose","stepsRu":["Если человек с диабетом в сознании и может безопасно глотать, дай быстродействующий сахар по его плану лечения.","Повтори измерение сахара, если есть глюкометр, и следуй индивидуальным рекомендациям.","Если человек сонлив, без сознания, не может глотать или есть судороги, вызови экстренную помощь; следи за дыханием."],"stepsEn":["If awake and able to swallow safely, offer fast-acting sugar according to their diabetes plan.","Recheck glucose if a meter is available and follow individual instructions.","If drowsy, unconscious, unable to swallow or seizing, call emergency services and monitor breathing."],"avoidRu":"Никогда не вливай жидкость и не клади пищу в рот человеку без сознания.","avoidEn":"Never put liquids or food in an unconscious person's mouth.","category":"emergency","icon":"◈"},{"id":"child","ru":"Младенец: тревожные признаки","en":"Infant danger signs","level":"urgent","aliases":"грудничок младенец не дышит температура ребёнок baby infant","stepsRu":["При отсутствии нормального дыхания или сознания немедленно вызови экстренную помощь и следуй указаниям диспетчера по СЛР младенца.","При лихорадке у младенца младше трёх месяцев, вялости, плохом кормлении или выраженной одышке нужна срочная медицинская оценка.","Не используй взрослые приёмы при удушье и реанимации младенца."],"stepsEn":["Call emergency services immediately if the infant is unresponsive or not breathing normally; follow dispatcher infant CPR guidance.","For fever in infants under 3 months, lethargy, poor feeding or marked breathing difficulty, seek urgent medical assessment.","Infant choking and CPR techniques differ from adult techniques."],"avoidRu":"Не делай толчки в живот младенцу; не тряси ребёнка.","avoidEn":"Do not use abdominal thrusts on an infant or shake a baby.","category":"children","icon":"♡"},{"id":"nosebleed","ru":"Носовое кровотечение","en":"Nosebleed","level":"common","category":"injuries","aliases":"нос кровь из носа nose bleed","stepsRu":["Сядь и немного наклони голову вперёд.","Зажми мягкую часть носа непрерывно на 10–15 минут.","Если кровотечение сильное, после травмы или не останавливается — нужна медицинская помощь."],"stepsEn":["Sit upright and lean slightly forward.","Pinch the soft part of the nose continuously for 10–15 minutes.","Seek medical attention for heavy, traumatic or persistent bleeding."],"avoidRu":"Не запрокидывай голову назад.","avoidEn":"Do not tilt your head back.","icon":"✚"},{"id":"sprain","ru":"Растяжение связок","en":"Sprain","level":"common","category":"injuries","aliases":"подвернул ногу сустав растяжение sprain ankle","stepsRu":["Прекрати нагрузку и защити сустав от повторной травмы.","При необходимости приложи холод через ткань на короткие промежутки и обеспечь покой.","Если невозможно опереться на конечность, есть деформация или сильная боль — обратись к врачу."],"stepsEn":["Stop activity and protect the joint.","Use a wrapped cold pack briefly for comfort and rest.","Get medical assessment for inability to bear weight, deformity or severe pain."],"avoidRu":"Не пытайся вправить сустав самостоятельно.","avoidEn":"Do not attempt to relocate a joint yourself.","icon":"♧"},{"id":"fracture","ru":"Перелом или вывих","en":"Fracture or dislocation","level":"urgent","category":"injuries","aliases":"сломал руку ногу кость вывих fracture dislocation","stepsRu":["Останови движение повреждённой конечности.","Поддержи её в положении, в котором она находится, и организуй медицинскую помощь.","Если нарушено кровообращение, выраженная деформация или открытая рана — вызывай экстренную помощь."],"stepsEn":["Keep the injured limb still.","Support it in its current position and arrange medical evaluation.","Call emergency services for impaired circulation, major deformity or open fracture."],"avoidRu":"Не выпрямляй и не вправляй конечность силой.","avoidEn":"Do not force a bent limb straight or attempt realignment.","icon":"⊕"},{"id":"faint","ru":"Обморок","en":"Fainting","level":"common","category":"emergency","aliases":"упал в обморок потерял сознание faint collapse","stepsRu":["Оцени реакцию и нормальное дыхание.","Если человек дышит нормально и приходит в себя, уложи на спину и обеспечь доступ воздуха.","Если нет нормального дыхания — вызывай помощь и начинай СЛР. После необычного обморока нужна медицинская оценка."],"stepsEn":["Check responsiveness and normal breathing.","If breathing normally and recovering, lay the person down and monitor them.","If not breathing normally, call emergency services and start CPR. Arrange medical assessment for unexplained fainting."],"avoidRu":"Не поднимай человека резко на ноги.","avoidEn":"Do not force the person to stand up abruptly.","icon":"✦"},{"id":"unconscious","ru":"Без сознания, но дышит","en":"Unconscious but breathing","level":"critical","category":"emergency","aliases":"без сознания дышит recovery position unconscious","stepsRu":["Если человек не реагирует, немедленно вызови экстренную помощь и проверь дыхание.","При нормальном дыхании и отсутствии травмы уложи человека на бок. При подозрении на травму не переводи в боковое положение автоматически; следуй указаниям диспетчера.","Продолжай наблюдать за дыханием. Если оно становится ненормальным или исчезает, начинай СЛР."],"stepsEn":["If the person is unresponsive, call emergency services immediately and assess breathing.","If breathing normally and there is no trauma, place them on their side. If trauma is suspected, do not automatically move into recovery position; follow the call handler's instructions.","Keep checking breathing. Start CPR if breathing becomes abnormal or stops."],"avoidRu":"Не оставляй человека одного. Не давай пить.","avoidEn":"Never leave them alone or give anything to drink.","icon":"✦"},{"id":"headinjury","ru":"Травма головы","en":"Head injury","level":"urgent","category":"injuries","aliases":"ударился головой сотрясение concussion head","stepsRu":["После удара оцени сознание, дыхание и выраженность симптомов.","При потере сознания, повторной рвоте, судорогах, нарастающей боли или спутанности немедленно обращайся за экстренной помощью.","Пока помощь в пути, избегай лишних движений головы и шеи."],"stepsEn":["Check consciousness, breathing and symptoms after injury.","Call emergency services for loss of consciousness, repeated vomiting, seizures, worsening pain or confusion.","Keep head and neck movement minimal while waiting."],"avoidRu":"Не оставляй человека с серьёзными симптомами без наблюдения.","avoidEn":"Do not leave a person with serious symptoms unattended.","icon":"◉"},{"id":"spine","ru":"Подозрение на травму позвоночника","en":"Possible spinal injury","level":"critical","category":"emergency","aliases":"шея спина позвоночник травма spinal injury","stepsRu":["Немедленно вызови экстренную помощь.","Не перемещай человека без необходимости, попроси его не двигаться.","Контролируй дыхание и сознание; при угрозе жизни действуй по указаниям диспетчера."],"stepsEn":["Call emergency services immediately.","Avoid unnecessary movement and ask the person to stay still.","Monitor breathing and responsiveness; follow emergency dispatcher instructions if life is threatened."],"avoidRu":"Не пытайся самостоятельно выправлять шею или спину.","avoidEn":"Do not attempt to straighten or manipulate the spine.","icon":"✚"},{"id":"animalbite","ru":"Укус животного","en":"Animal bite","level":"common","category":"injuries","aliases":"собака кошка укус animal bite rabies","stepsRu":["Промой место укуса большим количеством проточной воды с мылом.","Наложи чистую повязку, останови кровотечение прямым давлением.","Обратись за медицинской помощью для оценки риска бешенства, инфекции и столбняка."],"stepsEn":["Wash the bite thoroughly under running water with soap.","Apply a clean dressing and pressure for bleeding.","Seek medical advice about rabies, infection and tetanus risk."],"avoidRu":"Не откладывай оценку бешенства после неизвестного или дикого животного.","avoidEn":"Do not delay rabies assessment after an unknown or wild animal bite.","icon":"♧"},{"id":"insect","ru":"Укус или ужаление насекомого","en":"Insect sting or bite","level":"common","category":"everyday","aliases":"комар оса пчела укус насекомое bee sting insect","stepsRu":["Если жало видно в коже, осторожно удали его, не задерживая помощь.","Промой кожу, приложи прохладный компресс через ткань.","При отёке языка или горла, одышке или слабости вызывай экстренную помощь: возможна анафилаксия."],"stepsEn":["Remove a visible stinger promptly and gently.","Wash the skin and use a wrapped cool compress.","Call emergency services for throat swelling, breathing difficulty or collapse: possible anaphylaxis."],"avoidRu":"Не игнорируй быстро нарастающий отёк и затруднение дыхания.","avoidEn":"Do not ignore rapidly worsening swelling or breathing difficulty.","icon":"♧"},{"id":"tick","ru":"Присосался клещ","en":"Tick bite","level":"common","category":"everyday","aliases":"клещ укус клеща tick","stepsRu":["Аккуратно захвати клеща чистым пинцетом как можно ближе к коже.","Потяни ровно, без рывков. Очисти место укуса.","Если появляется расширяющееся покраснение, лихорадка или другие симптомы — обратись к врачу."],"stepsEn":["Use clean fine-tipped tweezers close to the skin.","Pull steadily without twisting. Clean the bite area.","Seek medical attention for spreading rash, fever or other symptoms."],"avoidRu":"Не прижигай клеща и не заливай маслом.","avoidEn":"Do not burn the tick or cover it in oil.","icon":"♧"},{"id":"dehydration","ru":"Обезвоживание","en":"Dehydration","level":"common","category":"everyday","aliases":"не хватает воды сухость жажда dehydration","stepsRu":["Пей небольшими порциями воду или раствор для пероральной регидратации, если можешь глотать.","При сильной жажде и слабости ограничь нагрузку, перейди в прохладное место.","При спутанности сознания, отсутствии мочи или неспособности пить нужна срочная медицинская помощь."],"stepsEn":["Sip water or oral rehydration solution if able to swallow.","Rest and move to a cooler place.","Seek urgent help for confusion, little or no urine, or inability to drink."],"avoidRu":"Не вливай жидкость человеку без сознания.","avoidEn":"Never give liquids by mouth to an unconscious person.","icon":"◈"},{"id":"vomit","ru":"Рвота","en":"Vomiting","level":"common","category":"everyday","aliases":"тошнота вырвало рвет nausea vomiting","stepsRu":["Отдыхай и пробуй частые маленькие глотки воды или раствора для регидратации.","Следи за признаками обезвоживания.","Кровь в рвоте, сильная боль, спутанность, симптомы у младенца — повод для срочной оценки."],"stepsEn":["Rest and take frequent small sips of water or oral rehydration solution.","Watch for dehydration.","Seek urgent care for blood in vomit, severe pain, confusion or concerning infant symptoms."],"avoidRu":"Не пытайся заставить пить большими объёмами сразу.","avoidEn":"Do not force large amounts of fluid at once.","icon":"◈"},{"id":"diarrhea","ru":"Диарея","en":"Diarrhoea","level":"common","category":"everyday","aliases":"понос жидкий стул живот diarrhea diarrhoea","stepsRu":["Пей жидкости и при необходимости раствор для регидратации.","Мой руки и избегай приготовления еды другим при кишечной инфекции.","Если есть кровь, сильное обезвоживание, выраженная боль или длительные симптомы — обратись к врачу."],"stepsEn":["Drink fluids and use oral rehydration solution if needed.","Wash hands and avoid preparing food for others during a stomach infection.","Seek medical advice for blood, severe dehydration, severe pain or persistent symptoms."],"avoidRu":"Не принимай антибиотики без назначения.","avoidEn":"Do not take antibiotics without medical advice.","icon":"◈"},{"id":"abdominal","ru":"Боль в животе","en":"Abdominal pain","level":"common","category":"everyday","aliases":"живот болит колет abdomen stomach pain","stepsRu":["Оцени силу, место и длительность боли.","Отдыхай, пей понемногу, если нет рвоты и можешь глотать.","Внезапная сильная боль, напряжение живота, обморок, кровь или беременность — повод для неотложной помощи."],"stepsEn":["Note the location, intensity and duration.","Rest and sip fluid if you can swallow without vomiting.","Sudden severe pain, rigid abdomen, fainting, blood or pregnancy need urgent evaluation."],"avoidRu":"Не пытайся заглушить сильную неизвестную боль бесконтрольными лекарствами.","avoidEn":"Do not mask severe unexplained pain with repeated uncontrolled medication.","icon":"◈"},{"id":"eye","ru":"Инородное тело в глазу","en":"Something in the eye","level":"common","category":"injuries","aliases":"соринка глаз пыль глаз болит eye foreign body","stepsRu":["Не три глаз.","При мелкой пыли осторожно промой глаз чистой водой или физраствором.","При застрявшем предмете, травме, химическом воздействии или ухудшении зрения срочно обратись за помощью."],"stepsEn":["Do not rub the eye.","For loose dust, gently rinse with clean water or sterile saline.","Seek urgent help for an embedded object, injury, chemicals or vision changes."],"avoidRu":"Не пытайся извлечь глубоко застрявший предмет.","avoidEn":"Never remove an embedded object yourself.","icon":"◉"},{"id":"chemical","ru":"Химический ожог","en":"Chemical burn","level":"critical","category":"emergency","aliases":"химия кислота щелочь химический ожог chemical","stepsRu":["Обеспечь собственную безопасность и вызови экстренную помощь при серьёзном воздействии.","Сними загрязнённую одежду, избегая контакта с веществом.","Промывай поражённую кожу большим количеством проточной воды; если вещество сухое, сначала аккуратно стряхни его, не касаясь руками.","При попадании в глаз немедленно длительно промывай водой и обратись за срочной помощью."],"stepsEn":["Protect yourself and call emergency services for serious exposure.","Remove contaminated clothing without touching the chemical.","Flush the skin with plenty of running water; gently brush away dry powder first without direct contact.","For eye exposure, rinse immediately and seek urgent evaluation."],"avoidRu":"Не смешивай вещества для «нейтрализации».","avoidEn":"Do not mix chemicals to try to neutralise them.","icon":"⚠"},{"id":"electric","ru":"Удар электрическим током","en":"Electric shock","level":"critical","category":"emergency","aliases":"ток ударило электричество lightning shock electricity","stepsRu":["Не прикасайся к человеку, пока источник тока не отключён.","Отключи питание, если безопасно, и вызови экстренную помощь.","Когда контакт безопасен, проверь сознание и дыхание; при необходимости начни СЛР и используй AED."],"stepsEn":["Do not touch the person while the power source is active.","Switch off power if safe and call emergency services.","Once safe, check responsiveness and breathing; start CPR and use AED if needed."],"avoidRu":"Не приближайся к высоковольтному оборудованию.","avoidEn":"Stay away from high-voltage equipment.","icon":"⚡"},{"id":"cold","ru":"Переохлаждение","en":"Hypothermia","level":"common","category":"environment","aliases":"замерз холод озноб переохлаждение cold hypothermia","stepsRu":["Перенеси человека в тёплое укрытие, сними мокрую одежду, укутай сухими слоями.","Давай тёплое питьё только если человек полностью в сознании и может глотать.","При спутанности, сильной сонливости или нарушении дыхания вызывай экстренную помощь."],"stepsEn":["Move into shelter, remove wet clothes and wrap in dry layers.","Offer a warm drink only when fully alert and able to swallow.","Call emergency services for confusion, extreme drowsiness or breathing problems."],"avoidRu":"Не растирай конечности и не грей резко сильным жаром.","avoidEn":"Do not rub limbs or apply intense direct heat.","icon":"❄"},{"id":"frostbite","ru":"Обморожение","en":"Frostbite","level":"common","category":"environment","aliases":"обморозил пальцы мороз frostbite","stepsRu":["Уйди с холода, сними мокрые или тесные вещи.","Защити участок от повторного охлаждения и обратись за медицинской оценкой при выраженном изменении цвета или онемении.","Не нагружай обмороженную стопу при возможности."],"stepsEn":["Get out of the cold and remove wet or tight clothing.","Protect the area from refreezing; seek medical assessment for discoloration or numbness.","Avoid walking on a badly frostbitten foot if possible."],"avoidRu":"Не растирай снегом, не используй открытый огонь.","avoidEn":"Do not rub with snow or heat over a flame.","icon":"❄"},{"id":"drowning","ru":"Человек тонет","en":"Drowning","level":"critical","category":"emergency","aliases":"утонул вода не дышит drowning","stepsRu":["Вызови экстренную помощь и не рискуй своей жизнью в воде.","Если возможно, используй спасательное средство и безопасно извлеки человека из воды.","Проверь нормальное дыхание, следуй инструкциям диспетчера; при отсутствии дыхания начни СЛР, особенно важны спасательные вдохи, если обучен."],"stepsEn":["Call emergency services and do not endanger yourself in the water.","Use a flotation aid and rescue safely if possible.","Check breathing and follow dispatcher instructions; if not breathing, start CPR. Rescue breaths are especially important if trained."],"avoidRu":"Не пытайся «выливать воду из лёгких».","avoidEn":"Do not try to drain water from the lungs.","icon":"≈"},{"id":"panic","ru":"Паническая атака","en":"Panic attack","level":"common","category":"everyday","aliases":"паника тревога страх сердцебиение anxiety panic","stepsRu":["Перейди в спокойное безопасное место и постарайся замедлить дыхание без задержек.","Назови несколько предметов вокруг, почувствуй опору ног — это помогает заземлиться.","При первой в жизни боли в груди, потере сознания или выраженной одышке нужна медицинская оценка."],"stepsEn":["Move to a quiet, safe place and slow breathing gently without breath-holding.","Name objects around you and feel your feet on the ground.","New chest pain, fainting or severe breathlessness need medical evaluation."],"avoidRu":"Не списывай новую сильную боль в груди на тревогу автоматически.","avoidEn":"Do not assume new severe chest pain is only anxiety.","icon":"♡"},{"id":"tooth","ru":"Зубная боль","en":"Toothache","level":"common","category":"everyday","aliases":"зуб болит dental toothache","stepsRu":["Аккуратно очисти рот и прополощи водой.","Избегай слишком горячего и холодного, договорись об осмотре стоматолога.","При отёке лица или шеи, лихорадке, затруднении дыхания или глотания нужна срочная помощь."],"stepsEn":["Rinse the mouth gently with water.","Avoid very hot or cold foods and arrange dental care.","Seek urgent care for face or neck swelling, fever, breathing or swallowing difficulties."],"avoidRu":"Не прикладывай таблетки к десне.","avoidEn":"Do not place pills directly onto gum tissue.","icon":"✚"},{"id":"childfever","ru":"Температура у ребёнка","en":"Fever in a child","level":"urgent","category":"children","aliases":"ребенок жар температура температура малыш child fever","stepsRu":["Следи за общим состоянием, дыханием, питьём и активностью.","Обеспечь комфорт, предлагай пить по возрасту.","При температуре у ребёнка до 3 месяцев, затруднении дыхания, сонливости, судорогах или необычной сыпи обратись за срочной медицинской оценкой."],"stepsEn":["Watch alertness, breathing, feeding and hydration.","Keep comfortable and offer age-appropriate fluids.","Urgent assessment is needed for fever in babies under 3 months, breathing difficulty, unusual drowsiness, seizures or concerning rash."],"avoidRu":"Не давай взрослую дозу лекарства ребёнку.","avoidEn":"Do not use adult medication doses for children.","icon":"♡"},{"id":"eyebleeding","ru":"Травма глаза","en":"Eye injury","level":"urgent","category":"injuries","aliases":"глаз травма удар кровь eye injury","stepsRu":["Не дави на глаз и не три его.","Если есть инородное тело, не извлекай его самостоятельно; защити глаз без давления.","При боли, ухудшении зрения, химическом воздействии или кровотечении — срочно за медицинской помощью."],"stepsEn":["Do not press or rub the eye.","Do not remove an embedded object; protect the eye without pressure.","Seek urgent care for pain, vision changes, chemical exposure or bleeding."],"avoidRu":"Не накладывай тугую повязку с давлением на глаз.","avoidEn":"Never apply a tight pressure dressing over the eye.","icon":"◉"},{"id":"dentalavulsion","ru":"Выбит постоянный зуб","en":"Knocked-out adult tooth","level":"urgent","category":"injuries","aliases":"выбил зуб сломал зуб knocked tooth","stepsRu":["Возьми выбитый постоянный зуб за коронку, не трогая корень.","Если загрязнён, кратко ополосни физраствором или молоком, не скреби.","Незамедлительно обратись к стоматологу. Для транспортировки держи зуб во влажной среде (например, молоке)."],"stepsEn":["Hold a knocked-out permanent tooth by the crown, not the root.","If dirty, gently rinse briefly in saline or milk, do not scrub.","Seek emergency dental care. Transport the tooth in milk or appropriate tooth storage solution."],"avoidRu":"Нельзя возвращать на место выбитый молочный зуб.","avoidEn":"Do not reimplant a knocked-out baby tooth.","icon":"✚"},{"id":"infant-choking","ru":"Младенец подавился (до года)","en":"Infant choking (under 1 year)","level":"critical","category":"children","aliases":"малыш грудничок поперхнулся не может плакать infant choking","stepsRu":["Если младенец не может эффективно кашлять, плакать или дышать, попроси вызвать экстренную помощь; если один — используй громкую связь.","Поддерживая голову и шею, положи младенца животом вниз на предплечье, головой ниже груди. Сделай до 5 резких ударов между лопатками.","Если не помогло, переверни на спину с поддержкой головы, сделай до 5 резких толчков в нижнюю половину грудины двумя большими пальцами, обхватив грудную клетку.","Чередуй эти действия до восстановления дыхания. При потере сознания переходи к детской СЛР, следуя диспетчеру."],"stepsEn":["If the infant cannot cough effectively, cry or breathe, ask someone to call emergency services; use speakerphone if alone.","Support the head and neck, place the infant face down on your forearm, head below chest. Give up to five firm blows between the shoulder blades.","If unsuccessful, turn the infant face up while supporting the head. Give up to five sharp thrusts on the lower half of the breastbone using two thumbs with hands encircling the chest.","Alternate until breathing returns. If unresponsive, start paediatric CPR with dispatcher guidance."],"avoidRu":"Не делай толчки в живот, не тряси ребёнка и не доставай предмет вслепую.","avoidEn":"No abdominal thrusts, shaking or blind finger sweeps.","icon":"✚"},{"id":"child-cpr","ru":"Ребёнок или младенец не дышит нормально","en":"Child or infant not breathing normally","level":"critical","category":"children","aliases":"детская реанимация слр ребенок грудничок child infant cpr","stepsRu":["Убедись, что безопасно подходить. Если ребёнок не реагирует, вызови экстренную службу на громкой связи и проверь дыхание.","При отсутствии нормального дыхания открой дыхательные пути. У младенца сохраняй нейтральное положение головы. Сделай 5 начальных спасательных вдохов, если можешь.","Начни надавливания на нижнюю половину грудины с частотой 100–120 в минуту, примерно на треть глубины грудной клетки. Следуй указаниям диспетчера.","Если обучен детской СЛР, чередуй 15 надавливаний с 2 вдохами; если обучен только взрослой СЛР — 30:2. Если вдохи невозможны, выполняй надавливания. Используй AED по его указаниям."],"stepsEn":["Check scene safety. If the child is unresponsive, call emergency services on speakerphone and assess breathing.","If breathing is abnormal or absent, open the airway; keep an infant's head neutral. Give five initial rescue breaths if able.","Start compressions on the lower half of the breastbone, 100–120 per minute, about one third of chest depth. Follow the dispatcher.","Use 15:2 if trained in paediatric CPR, or 30:2 if trained only in adult CPR. If unable to give breaths, give compressions. Follow AED prompts."],"avoidRu":"Не применяй взрослую глубину надавливаний к младенцу. Не откладывай помощь из-за отсутствия обучения.","avoidEn":"Do not use adult compression depth on an infant. Do not delay help because of lack of training.","icon":"✚"},{"id":"co-poison","ru":"Подозрение на отравление угарным газом","en":"Suspected carbon monoxide poisoning","level":"critical","category":"environment","aliases":"угарный газ co печка генератор дым","stepsRu":["Немедленно выйди на свежий воздух и предупреди окружающих, если это безопасно.","Вызови экстренные службы снаружи, сообщи о возможном угарном газе.","При нарушении сознания или дыхания следуй диспетчеру; оказывай помощь только в безопасной зоне.","Даже при улучшении самочувствия необходима медицинская оценка."],"stepsEn":["Move outdoors immediately and warn others if safe.","Call emergency services from outside; report possible carbon monoxide exposure.","Follow dispatcher guidance if responsiveness or breathing is abnormal; give aid only in a safe area.","Seek medical assessment even if symptoms improve."],"avoidRu":"Не возвращайся в помещение до разрешения спасателей.","avoidEn":"Do not re-enter until emergency services say it is safe.","icon":"✚"},{"id":"battery-ingestion","ru":"Ребёнок проглотил батарейку или магнит","en":"Child swallowed a battery or magnet","level":"critical","category":"children","aliases":"таблетка батарейка магнит проглотил button battery magnet","stepsRu":["При подозрении на проглатывание немедленно организуй экстренную медицинскую помощь, даже если ребёнок выглядит здоровым.","Сообщи диспетчеру возраст, предполагаемое время и тип предмета. Возьми аналогичную батарейку или упаковку, если это не задерживает поездку.","Следуй указаниям специалиста о еде и питье. При нарушении дыхания действуй по возрастному алгоритму удушья."],"stepsEn":["Arrange emergency medical assessment immediately, even if the child appears well.","Tell the dispatcher the child's age, approximate time and object type. Bring matching packaging if it causes no delay.","Follow professional advice about food or drink. If breathing is obstructed, follow age-specific choking guidance."],"avoidRu":"Не жди появления симптомов и не вызывай рвоту.","avoidEn":"Do not wait for symptoms or induce vomiting.","icon":"✚"},{"id":"sepsis","ru":"Подозрение на сепсис","en":"Suspected sepsis","level":"critical","category":"emergency","aliases":"сепсис инфекция спутанность дыхание сыпь sepsis","stepsRu":["На фоне инфекции спутанность сознания, выраженная одышка, необычная бледность или резкое ухудшение могут означать опасное состояние.","Немедленно вызови экстренную помощь и сообщи о возможной инфекции и изменении состояния.","Оставайся рядом, следи за сознанием и дыханием; при отсутствии нормального дыхания начинай СЛР по возрасту."],"stepsEn":["Confusion, severe breathing difficulty, unusual pallor or rapid deterioration during an infection can signal a dangerous condition.","Call emergency services and describe the infection and changes in condition.","Stay nearby, monitor responsiveness and breathing; start age-appropriate CPR if breathing is abnormal or absent."],"avoidRu":"Не жди, пока появятся все симптомы, и не пытайся самостоятельно лечить сепсис антибиотиками.","avoidEn":"Do not wait for every symptom or attempt to treat sepsis yourself with antibiotics.","icon":"✚"},{"id":"meningitis","ru":"Подозрение на менингит","en":"Suspected meningitis","level":"critical","category":"emergency","aliases":"менингит сыпь ригидность шеи светобоязнь meningitis","stepsRu":["Сильная головная боль с температурой, скованностью шеи, светобоязнью, сонливостью или необычной сыпью требует срочной оценки.","При подозрении на менингит или резком ухудшении немедленно обращайся за экстренной помощью.","Следи за дыханием и реакцией на обращение, выполняй указания диспетчера."],"stepsEn":["Severe headache with fever, stiff neck, sensitivity to light, drowsiness or an unusual rash needs urgent assessment.","If meningitis is suspected or the person deteriorates rapidly, seek emergency help immediately.","Monitor breathing and responsiveness, and follow dispatcher instructions."],"avoidRu":"Не жди появления сыпи: она бывает не всегда.","avoidEn":"Do not wait for a rash; it may never appear.","icon":"✚"},{"id":"pulmonary-embolism","ru":"Внезапная одышка и боль в груди","en":"Sudden breathlessness and chest pain","level":"critical","category":"emergency","aliases":"тромбоэмболия легочная артерия тромб кровохарканье pulmonary embolism","stepsRu":["Внезапная одышка, боль в груди при вдохе, кровохарканье или обморок могут быть признаками опасного состояния.","При выраженной одышке, боли в груди или потере сознания вызови экстренную службу.","Помоги принять удобное положение, не оставляй одного; при отсутствии нормального дыхания начинай СЛР."],"stepsEn":["Sudden breathlessness, chest pain on breathing, coughing blood or collapse can indicate a dangerous condition.","Call emergency services for severe breathlessness, chest pain or loss of consciousness.","Help the person rest comfortably; stay nearby and start CPR if normal breathing stops."],"avoidRu":"Не пытайся самостоятельно лечить предполагаемый тромб антикоагулянтами и не садись за руль.","avoidEn":"Do not self-treat a suspected clot with anticoagulants or drive yourself.","icon":"✚"},{"id":"dka","ru":"Диабет: подозрение на кетоацидоз","en":"Suspected diabetic ketoacidosis","level":"critical","category":"emergency","aliases":"диабет высокий сахар кетоны рвота глубокое дыхание dka","stepsRu":["У человека с диабетом выраженная жажда, рвота, глубокое дыхание, фруктовый запах изо рта или сонливость могут указывать на кетоацидоз.","При таких признаках немедленно организуй экстренную медицинскую помощь. Если доступны показатели глюкозы и кетонов, сообщи их специалисту.","Не оставляй человека одного, следи за дыханием и сознанием."],"stepsEn":["In diabetes, marked thirst, vomiting, deep breathing, fruity breath or drowsiness can suggest ketoacidosis.","Arrange emergency medical help immediately. If glucose and ketone readings are available, tell the clinician.","Stay with the person and monitor breathing and responsiveness."],"avoidRu":"Не назначай дополнительные дозы инсулина самостоятельно; следуй индивидуальному плану и указаниям специалиста.","avoidEn":"Do not independently prescribe extra insulin; follow the personal plan and clinician's advice.","icon":"✚"},{"id":"ectopic","ru":"Беременность: резкая боль и обморок","en":"Pregnancy: sudden pain and fainting","level":"critical","category":"emergency","aliases":"внематочная беременность кровотечение боль плечо ectopic","stepsRu":["При возможной беременности резкая боль в животе, слабость, обморок или боль в кончике плеча могут указывать на внутреннее кровотечение.","Немедленно вызови экстренную помощь, сообщи о возможной беременности.","Помоги принять безопасное удобное положение, следи за сознанием и дыханием."],"stepsEn":["With possible pregnancy, sudden abdominal pain, weakness, fainting or shoulder-tip pain may indicate internal bleeding.","Call emergency services immediately and mention possible pregnancy.","Help the person rest safely and monitor responsiveness and breathing."],"avoidRu":"Не откладывай вызов ради домашнего теста на беременность.","avoidEn":"Do not delay emergency help to perform a pregnancy test.","icon":"✚"},{"id":"testicular-pain","ru":"Внезапная сильная боль в яичке","en":"Sudden severe testicular pain","level":"critical","category":"emergency","aliases":"перекрут яичка мошонка torsion","stepsRu":["Внезапная сильная боль в яичке, особенно с тошнотой или болью в животе, требует немедленного осмотра.","Организуй доставку в отделение экстренной помощи; при невозможности безопасной поездки вызови экстренную службу.","Сообщи врачу точное время начала боли."],"stepsEn":["Sudden severe testicular pain, especially with nausea or abdominal pain, requires immediate assessment.","Arrange transport to an emergency department; call emergency services if safe transport is unavailable.","Tell the clinician exactly when the pain began."],"avoidRu":"Не жди самостоятельного улучшения и не пытайся вправлять яичко.","avoidEn":"Do not wait for improvement or attempt to manipulate the testicle.","icon":"✚"},{"id":"shock","ru":"Признаки шока","en":"Signs of shock","category":"emergency","aliases":"шок холодная кожа бледность слабость","stepsRu":["При резкой слабости, холодном поте, бледности или спутанности после травмы или болезни вызови экстренную помощь.","Если есть сильное кровотечение, останови его. Помоги лечь, если это безопасно и не ухудшает дыхание.","Укрой человека, наблюдай за дыханием и сознанием."],"stepsEn":["Call emergency services for marked weakness, clammy skin, pallor or confusion after injury or illness.","Control severe bleeding if present. Help the person lie down if safe and comfortable for breathing.","Keep them warm and monitor breathing and responsiveness."],"avoidRu":"Не давай еду и питьё, не перемещай при подозрении на травму позвоночника.","avoidEn":"Do not give food or drink or move someone with suspected spinal injury.","level":"critical","icon":"✚"},{"id":"chest-wound","ru":"Открытая рана грудной клетки","en":"Open chest wound","category":"injuries","aliases":"рана грудь проникающая травма pneumothorax","stepsRu":["Сразу вызови экстренную помощь.","Не закрывай отверстие герметичной повязкой: воздух должен свободно выходить. При необходимости прижми локальный источник кровотечения, не закупоривая отверстие.","Помоги оставаться в удобном положении, контролируй дыхание."],"stepsEn":["Call emergency services immediately.","Keep the opening unobstructed rather than sealing it. If needed, apply local pressure to bleeding without blocking the opening.","Help the person rest comfortably and monitor breathing."],"avoidRu":"Не извлекай застрявший предмет и не закрывай рану плёнкой.","avoidEn":"Do not remove embedded objects or seal the wound with plastic.","level":"critical","icon":"✚"},{"id":"amputation","ru":"Травматическая ампутация","en":"Traumatic amputation","category":"injuries","aliases":"оторван палец кисть конечность","stepsRu":["Вызови экстренную помощь; сначала останови опасное кровотечение.","Если безопасно, найди отделённую часть. Заверни в чистую ткань, слегка смоченную водой или физраствором, помести в герметичный пакет.","Положи закрытый пакет в другой контейнер с холодной водой и льдом. Передай спасателям вместе с пострадавшим."],"stepsEn":["Call emergency services and prioritise severe bleeding.","If safe, retrieve the separated part. Wrap it in clean cloth dampened with water or saline and seal in a watertight bag.","Cool the sealed bag in a separate container of ice and water. Send it with the patient."],"avoidRu":"Не клади ткань непосредственно на лёд и не замораживай её.","avoidEn":"Do not place tissue directly on ice or freeze it.","level":"critical","icon":"✚"},{"id":"opioid-overdose","ru":"Подозрение на передозировку опиоидов","en":"Suspected opioid overdose","category":"emergency","aliases":"налоксон опиоиды дыхание передозировка","stepsRu":["Если человек крайне сонлив или не реагирует и дышит редко либо ненормально, вызови экстренную помощь.","Если нормального дыхания нет, начинай СЛР. Если обучен применению налоксона и он доступен, используй его по инструкции.","Следи за дыханием до прибытия помощи; повторное применение — согласно инструкции и указаниям диспетчера."],"stepsEn":["Call emergency services if someone is barely responsive with slow or abnormal breathing.","Start CPR if breathing is not normal. If trained and naloxone is available, administer it according to instructions.","Monitor until help arrives; follow product and dispatcher advice about repeat administration."],"avoidRu":"Не оставляй человека одного, даже если после налоксона ему лучше.","avoidEn":"Do not leave the person alone even if they improve after naloxone.","level":"critical","icon":"✚"},{"id":"snakebite","ru":"Укус змеи","en":"Snake bite","category":"environment","aliases":"змея гадюка яд","stepsRu":["Отойди от змеи, вызови экстренную помощь.","Сохраняй покой, не двигай укушенной конечностью. Сними кольца и тесные предметы до развития отёка.","Следуй местным рекомендациям диспетчера; медицинская оценка нужна даже при отсутствии симптомов."],"stepsEn":["Move away from the snake and call emergency services.","Rest and keep the bitten limb still. Remove rings and tight items before swelling occurs.","Follow local dispatcher advice; medical assessment is needed even without symptoms."],"avoidRu":"Не разрезай рану, не отсасывай яд, не накладывай жгут и не лови змею.","avoidEn":"Do not cut or suck the wound, use a tourniquet or catch the snake.","level":"critical","icon":"✚"},{"id":"febrile-seizure","ru":"Судороги при температуре у ребёнка","en":"Febrile seizure","category":"children","aliases":"фебрильные судороги жар ребенок","stepsRu":["Засеки время, убери опасные предметы, защищай голову от травмы.","Вызови экстренную помощь при первых судорогах, длительности более 5 минут, нарушении дыхания или если ребёнок не приходит в себя.","После прекращения судорог оцени дыхание; при нормальном дыхании и отсутствии травмы поверни на бок."],"stepsEn":["Time the seizure, clear nearby hazards and protect the head.","Call emergency services for a first seizure, duration over five minutes, breathing problems or failure to recover.","When movements stop, assess breathing; if breathing normally and uninjured, turn onto the side."],"avoidRu":"Не удерживай ребёнка, не клади ничего в рот, не охлаждай ледяной водой.","avoidEn":"Do not restrain the child, put anything in the mouth or use ice water.","level":"critical","icon":"✚"},{"id":"croup","ru":"Лающий кашель и шумное дыхание у ребёнка","en":"Barking cough and noisy breathing","category":"children","aliases":"круп ларингит стридор","stepsRu":["При лающем кашле и осиплости успокой ребёнка, оставь в удобном вертикальном положении.","При выраженном затруднении дыхания, посинении, сонливости или втяжении грудной клетки немедленно вызывай экстренную помощь.","При менее тяжёлых симптомах организуй медицинскую консультацию."],"stepsEn":["For a barking cough and hoarseness, keep the child calm and comfortably upright.","Call emergency services for severe breathing difficulty, blue colouring, drowsiness or marked chest retractions.","Seek medical advice for less severe symptoms."],"avoidRu":"Не заставляй дышать горячим паром и не укладывай насильно.","avoidEn":"Do not use hot steam or force the child to lie down.","level":"critical","icon":"✚"},{"id":"epiglottitis","ru":"Слюнотечение и затруднённое дыхание","en":"Drooling with breathing difficulty","category":"emergency","aliases":"надгортанник эпиглоттит глотание стридор","stepsRu":["При внезапном затруднении дыхания с сильной болью в горле, слюнотечением или невозможностью глотать вызови экстренную помощь.","Оставь человека в положении, в котором ему легче дышать. Сохраняй спокойствие.","Следи за дыханием и выполняй указания диспетчера."],"stepsEn":["Call emergency services for sudden breathing difficulty with severe throat pain, drooling or inability to swallow.","Let the person remain in the position that eases breathing; stay calm.","Monitor breathing and follow dispatcher instructions."],"avoidRu":"Не пытайся осмотреть горло ложкой или пальцами и не заставляй лежать.","avoidEn":"Do not inspect the throat with a spoon or fingers or force the person to lie down.","level":"critical","icon":"✚"},{"id":"gi-bleeding","ru":"Рвота кровью или чёрный стул","en":"Vomiting blood or black stools","category":"emergency","aliases":"кровавая рвота кофейная гуща мелена","stepsRu":["Рвота кровью требует медицинской помощи. При слабости, обмороке, холодной коже, боли или чёрном стуле вызови экстренную службу.","Оставайся рядом, следи за дыханием. Сообщи специалисту о лекарствах, особенно антикоагулянтах.","Даже если рвота прекратилась, организуй срочную оценку."],"stepsEn":["Vomiting blood requires medical assessment. Call emergency services if accompanied by faintness, clammy skin, pain or black stools.","Stay nearby and monitor breathing. Tell clinicians about medicines, particularly anticoagulants.","Arrange urgent assessment even if vomiting stops."],"avoidRu":"Не принимай самостоятельно дополнительные обезболивающие и не садись за руль при слабости.","avoidEn":"Do not self-administer extra painkillers or drive when faint.","level":"critical","icon":"✚"},{"id":"alcohol-poisoning","ru":"Алкогольное отравление","en":"Alcohol poisoning","category":"emergency","aliases":"алкоголь не просыпается интоксикация","stepsRu":["При подозрении на алкогольное отравление вызови экстренную помощь.","Оставайся рядом. Если человек без сознания, но нормально дышит и нет травмы, поверни на бок. При ненормальном дыхании начинай СЛР.","Согревай и контролируй состояние до приезда помощи."],"stepsEn":["Call emergency services for suspected alcohol poisoning.","Stay with the person. If unconscious but breathing normally and uninjured, turn them onto their side. Start CPR for abnormal breathing.","Keep warm and monitor until help arrives."],"avoidRu":"Не давай кофе, не помещай в холодный душ и не вызывай рвоту.","avoidEn":"Do not give coffee, use a cold shower or induce vomiting.","level":"critical","icon":"✚"},{"id":"rabies-exposure","ru":"Укус с риском бешенства","en":"Possible rabies exposure","category":"injuries","aliases":"бешенство летучая мышь собака укус","stepsRu":["После укуса или царапины потенциально заражённого млекопитающего промой рану водой с мылом в течение 15 минут.","Как можно быстрее обратись за медицинской оценкой риска бешенства, даже при небольшой ране или контакте с летучей мышью.","Сообщи место и время контакта и сведения о животном; врач решит вопрос профилактики."],"stepsEn":["After a bite or scratch from a potentially infected mammal, wash the wound with soap and water for 15 minutes.","Seek prompt rabies risk assessment even for a small wound or bat contact.","Tell clinicians when and where exposure occurred and what animal was involved; they will assess preventive treatment."],"avoidRu":"Не жди появления симптомов и не пытайся поймать животное.","avoidEn":"Do not wait for symptoms or attempt to catch the animal.","level":"urgent","icon":"✚"},{"id":"thunderclap","ru":"Внезапная крайне сильная головная боль","en":"Sudden extremely severe headache","category":"emergency","aliases":"громоподобная головная боль кровоизлияние","stepsRu":["Если головная боль возникла внезапно и очень сильная, вызови экстренную помощь.","Сообщи время начала и любые дополнительные признаки: слабость, нарушение речи, рвоту, потерю сознания.","Обеспечь покой и наблюдай за дыханием до прибытия помощи."],"stepsEn":["Call emergency services for a sudden extremely severe headache.","Report onset time and associated weakness, speech difficulty, vomiting or loss of consciousness.","Keep the person resting and monitor breathing until help arrives."],"avoidRu":"Не жди действия обезболивающего, не садись за руль самостоятельно.","avoidEn":"Do not wait for painkillers to work or drive yourself.","level":"critical","icon":"✚"},{"id":"vision-loss","ru":"Внезапная потеря зрения","en":"Sudden vision loss","category":"emergency","aliases":"не вижу глаз слепота тень зрение","stepsRu":["При внезапной потере зрения сразу организуй экстренную медицинскую помощь.","Сообщи точное время начала, один или оба глаза затронуты, есть ли боль или нарушение речи.","Не садись за руль. При других признаках инсульта следуй инструкции по инсульту."],"stepsEn":["Seek emergency medical help immediately for sudden vision loss.","Report the time of onset, whether one or both eyes are affected, and any pain or speech problems.","Do not drive. Follow the stroke guide if other stroke signs occur."],"avoidRu":"Не жди, пока зрение восстановится само.","avoidEn":"Do not wait for vision to return on its own.","level":"critical","icon":"✚"},{"id":"retinal-warning","ru":"Вспышки и тёмная завеса перед глазом","en":"Flashes and a dark curtain in vision","category":"injuries","aliases":"отслойка сетчатка мушки завеса","stepsRu":["Внезапные вспышки, новые множественные плавающие пятна или тёмная завеса требуют срочной оценки глазным специалистом.","Организуй осмотр без промедления. Если зрение внезапно пропало, обращайся за экстренной помощью.","Сообщи о недавних травмах или операциях на глазах."],"stepsEn":["New flashes, many new floaters or a dark curtain require urgent eye assessment.","Arrange assessment without delay. Seek emergency help if vision is suddenly lost.","Report recent eye injuries or surgery."],"avoidRu":"Не пытайся лечить эти признаки случайными каплями.","avoidEn":"Do not try to treat these symptoms with random eye drops.","level":"urgent","icon":"✚"},{"id":"cauda-equina","ru":"Боль в спине и нарушение мочеиспускания","en":"Back pain with new bladder problems","category":"emergency","aliases":"конский хвост онемение промежности спина мочевой пузырь","stepsRu":["Если вместе с болью в спине появились нарушение мочеиспускания, онемение промежности или слабость ног, нужна немедленная оценка в отделении экстренной помощи.","При невозможности безопасно добраться вызови экстренную службу.","Сообщи врачу время появления новых признаков."],"stepsEn":["Back pain with new bladder problems, numbness around the saddle area or leg weakness requires immediate emergency department assessment.","Call emergency services if safe transport is unavailable.","Report the time the new symptoms began."],"avoidRu":"Не жди планового приёма и не пытайся самостоятельно вправлять позвоночник.","avoidEn":"Do not wait for a routine appointment or attempt spinal manipulation.","level":"critical","icon":"✚"},{"id":"pregnancy-warning","ru":"Беременность: сильная головная боль или нарушение зрения","en":"Pregnancy: severe headache or visual changes","category":"emergency","aliases":"преэклампсия беременность отеки давление","stepsRu":["Во время беременности или вскоре после родов сильная головная боль, необычные нарушения зрения или резкое увеличение отёков требуют немедленной медицинской оценки.","Свяжись с экстренной или акушерской службой; при судорогах, потере сознания или тяжёлом состоянии вызови экстренную помощь.","Не оставляй человека одного при тяжёлом состоянии."],"stepsEn":["Severe headache, visual changes or rapidly increasing swelling during pregnancy or soon after birth need immediate medical assessment.","Contact emergency or maternity services; call emergency services for seizures, collapse or severe illness.","Stay with the person if severely unwell."],"avoidRu":"Не откладывай обращение из-за нормальных показателей домашнего измерения давления.","avoidEn":"Do not delay assessment because a home blood pressure reading is normal.","level":"critical","icon":"✚"},{"id":"adrenal-crisis","ru":"Надпочечниковая недостаточность: резкое ухудшение","en":"Adrenal insufficiency: sudden deterioration","category":"emergency","aliases":"аддисон криз гидрокортизон стероиды","stepsRu":["При известной надпочечниковой недостаточности резкая слабость, рвота, обморок или спутанность могут означать опасное состояние.","Вызови экстренную помощь и сообщи диагноз. Если человеку назначен экстренный набор гидрокортизона, следуй его индивидуальному плану и указаниям диспетчера.","Контролируй дыхание и реакцию до прибытия помощи."],"stepsEn":["In known adrenal insufficiency, sudden weakness, vomiting, collapse or confusion can indicate a dangerous condition.","Call emergency services and report the diagnosis. If an emergency hydrocortisone kit has been prescribed, follow the personal plan and dispatcher instructions.","Monitor breathing and responsiveness until help arrives."],"avoidRu":"Не подбирай дозу стероидов самостоятельно и не задерживай вызов.","avoidEn":"Do not independently select a steroid dose or delay calling for help.","level":"critical","icon":"✚"},{"id":"severe-abdominal","ru":"Внезапная или очень сильная боль в животе","en":"Sudden or severe abdominal pain","category":"emergency","aliases":"острый живот панкреатит аппендицит сильная боль","stepsRu":["При внезапной очень сильной боли в животе, коллапсе или резком ухудшении вызови экстренную помощь.","Сообщи о рвоте, крови, беременности, травме и принимаемых лекарствах, если известно.","Оставайся в удобном положении и выполняй указания диспетчера."],"stepsEn":["Call emergency services for sudden extremely severe abdominal pain, collapse or rapid deterioration.","Report vomiting, blood, pregnancy, trauma and medicines if known.","Rest in a comfortable position and follow dispatcher instructions."],"avoidRu":"Не откладывай обращение ради самостоятельного определения диагноза.","avoidEn":"Do not delay seeking help to diagnose the cause yourself.","level":"critical","icon":"✚"},{"id":"head-injury-anticoagulant","ru":"Удар головой на фоне антикоагулянтов","en":"Head injury while taking anticoagulants","category":"injuries","aliases":"варфарин апиксабан удар головой кроверазжижающие","stepsRu":["После удара головой у человека, принимающего антикоагулянты, организуй срочную медицинскую оценку даже при внешне хорошем самочувствии.","При потере сознания, судорогах, выраженной сонливости или нарушении движений вызови экстренную помощь.","Сообщи медикам название препарата и время травмы."],"stepsEn":["Arrange urgent medical assessment after head injury in a person taking anticoagulants, even if they appear well.","Call emergency services for unconsciousness, seizures, severe drowsiness or movement problems.","Tell clinicians the medicine name and time of injury."],"avoidRu":"Не меняй схему антикоагулянта самостоятельно.","avoidEn":"Do not independently change anticoagulant treatment.","level":"urgent","icon":"✚"},{"id":"severe-eye-pain","ru":"Сильная боль в глазу","en":"Severe eye pain","category":"injuries","aliases":"глаз боль красный светобоязнь глаукома","stepsRu":["Сильная боль в глазу, особенно с нарушением зрения, требует срочной медицинской оценки.","Если зрение пропало внезапно, вызывай экстренную помощь; при химическом воздействии переходи к инструкции промывания.","Не дави на глаз и не садись за руль при нарушенном зрении."],"stepsEn":["Severe eye pain, especially with changes in vision, requires urgent medical assessment.","Seek emergency help for sudden vision loss; for chemical exposure follow the irrigation guide.","Do not press on the eye or drive with impaired vision."],"avoidRu":"Не используй чужие глазные капли или обезболивающие капли без назначения.","avoidEn":"Do not use someone else's eye drops or anaesthetic drops without professional direction.","level":"urgent","icon":"✚"},{"id":"chemical-eye","ru":"Химическое вещество попало в глаз","en":"Chemical splash in the eye","category":"injuries","aliases":"кислота щелочь отбеливатель глаз химия","stepsRu":["Немедленно начни промывать глаз большим количеством чистой, не горячей воды. Продолжай промывание не менее 20 минут.","Удерживай веки открытыми, если возможно; вода должна течь мягко. Сними линзы, только если это легко и не задерживает промывание.","Организуй экстренную медицинскую помощь; продолжай промывание по указаниям специалистов. Возьми упаковку вещества, если безопасно."],"stepsEn":["Start rinsing the eye immediately with plenty of clean, non-hot water for at least 20 minutes.","Keep the eyelids open if possible, using a gentle flow. Remove contact lenses only if easy and without delaying rinsing.","Arrange emergency medical help; continue rinsing as advised. Bring the chemical container if safe."],"avoidRu":"Не нейтрализуй вещество другой химией и не три глаз.","avoidEn":"Do not neutralise with another chemical or rub the eye.","level":"critical","icon":"✚"},{"id":"dvt","ru":"Односторонний отёк и боль в ноге","en":"One-sided leg swelling and pain","category":"emergency","aliases":"тромбоз глубоких вен тромб нога отек","stepsRu":["Новая боль и отёк одной ноги требуют срочной медицинской оценки.","Если одновременно появилась одышка или боль в груди, немедленно вызови экстренную помощь.","Сообщи врачу о недавних операциях, длительной неподвижности и принимаемых лекарствах."],"stepsEn":["New swelling and pain in one leg require urgent medical assessment.","Call emergency services if breathlessness or chest pain also develops.","Tell clinicians about recent surgery, prolonged immobility and medicines."],"avoidRu":"Не начинай самостоятельно приём антикоагулянтов.","avoidEn":"Do not start anticoagulants on your own.","level":"urgent","icon":"✚"},{"id":"palpitations","ru":"Сердцебиение с болью или обмороком","en":"Palpitations with chest pain or faintness","category":"emergency","aliases":"аритмия сердце быстро пульс перебои","stepsRu":["Если сердцебиение не прекращается либо сопровождается болью в груди, одышкой или предобморочным состоянием, вызови экстренную помощь.","Оставайся рядом и помоги человеку отдохнуть в удобном положении.","При отсутствии нормального дыхания начинай СЛР и следуй диспетчеру."],"stepsEn":["Call emergency services for palpitations that persist or occur with chest pain, breathlessness or faintness.","Stay with the person and help them rest comfortably.","Start CPR if breathing is abnormal or absent; follow dispatcher instructions."],"avoidRu":"Не принимай дополнительные сердечные лекарства без медицинского указания.","avoidEn":"Do not take extra heart medicines without medical direction.","level":"critical","icon":"✚"},{"id":"dental-abscess","ru":"Зубная инфекция и отёк лица","en":"Dental infection and facial swelling","category":"everyday","aliases":"абсцесс зуб флюс отек челюсть","stepsRu":["При подозрении на зубной абсцесс организуй срочный осмотр стоматологом.","При затруднённом дыхании или глотании, выраженном отёке рта либо распространении отёка на глаз обращайся за экстренной помощью.","Сообщи о температуре, аллергиях и лекарствах."],"stepsEn":["Arrange urgent dental assessment for a suspected dental abscess.","Seek emergency help for breathing or swallowing difficulty, marked swelling inside the mouth or swelling affecting the eye.","Report fever, allergies and medicines."],"avoidRu":"Не вскрывай отёк самостоятельно и не используй остатки антибиотиков.","avoidEn":"Do not drain it yourself or use leftover antibiotics.","level":"urgent","icon":"✚"},{"id":"sudden-hearing","ru":"Внезапное снижение слуха","en":"Sudden hearing loss","category":"everyday","aliases":"не слышу ухо внезапно глухота","stepsRu":["При внезапной потере слуха на одном или обоих ушах организуй срочную медицинскую оценку.","Сообщи о времени начала, травме, шумовом воздействии и головокружении.","Если появились признаки инсульта, вызывай экстренную помощь."],"stepsEn":["Arrange urgent medical assessment for sudden hearing loss in one or both ears.","Report onset, injury, noise exposure and dizziness.","Call emergency services if stroke signs develop."],"avoidRu":"Не откладывай осмотр ради чистки уха и не вставляй в ухо предметы.","avoidEn":"Do not delay assessment to clean the ear or insert objects into it.","level":"urgent","icon":"✚"},{"id":"mastoiditis","ru":"Отёк и боль за ухом","en":"Pain and swelling behind the ear","category":"children","aliases":"мастоидит ухо температура отек за ухом","stepsRu":["Боль, припухлость за ухом, температура или выпирающая ушная раковина требуют срочной медицинской оценки.","Сообщи о недавнем воспалении уха и лечении.","При резком ухудшении, спутанности или нарушении дыхания вызови экстренную помощь."],"stepsEn":["Pain or swelling behind the ear, fever or an ear pushed outward require urgent medical assessment.","Report recent ear infection and treatment.","Call emergency services for rapid deterioration, confusion or breathing problems."],"avoidRu":"Не пытайся вскрыть припухлость или самостоятельно подобрать антибиотик.","avoidEn":"Do not drain the swelling or choose an antibiotic yourself.","level":"urgent","icon":"✚"},{"id":"wound-infection","ru":"Признаки инфекции раны","en":"Signs of wound infection","category":"injuries","aliases":"гной рана покраснение кожа инфекция целлюлит","stepsRu":["При нарастающих боли, отёке, горячей коже или выделениях из раны организуй срочный осмотр.","При резком ухудшении, спутанности, необычно частом дыхании или обмороке вызывай экстренную помощь.","Защити рану чистой повязкой и сообщи врачу о травме и прививках."],"stepsEn":["Seek urgent assessment for increasing pain, swelling, heat or discharge from a wound.","Call emergency services for rapid deterioration, confusion, unusually fast breathing or fainting.","Protect the wound with a clean dressing and report the injury and vaccination history."],"avoidRu":"Не выдавливай гной и не начинай лечение оставшимися антибиотиками.","avoidEn":"Do not squeeze pus or start leftover antibiotics.","level":"urgent","icon":"✚"},{"id":"toxic-shock","ru":"Подозрение на токсический шок","en":"Suspected toxic shock syndrome","category":"emergency","aliases":"токсический шок температура сыпь тампон рана","stepsRu":["При резком ухудшении с температурой, сыпью, рвотой, головокружением или спутанностью организуй срочную медицинскую помощь.","При признаках тяжёлого состояния вызови экстренную службу. Сообщи об использовании тампонов, менструальной чаши или недавней ране.","Если это легко сделать, удали тампон или чашу; не задерживай обращение. Наблюдай за дыханием."],"stepsEn":["Seek urgent medical help for rapid illness with fever, rash, vomiting, dizziness or confusion.","Call emergency services for severe illness. Report tampon or menstrual cup use or a recent wound.","Remove a tampon or cup if easy, without delaying care. Monitor breathing."],"avoidRu":"Не жди появления всех признаков.","avoidEn":"Do not wait for all signs to appear.","level":"critical","icon":"✚"},{"id":"hip-fracture","ru":"Подозрение на перелом бедра после падения","en":"Suspected hip fracture after a fall","category":"injuries","aliases":"шейка бедра таз падение пожилой","stepsRu":["При сильной боли в бедре и невозможности встать после падения вызови экстренную помощь.","Оставь человека в удобном положении, не пытайся заставить ходить.","Сохраняй тепло, наблюдай за дыханием и состоянием."],"stepsEn":["Call emergency services for severe hip pain and inability to stand after a fall.","Keep the person comfortable without making them walk.","Keep warm and monitor breathing and condition."],"avoidRu":"Не проверяй подвижность ноги силой.","avoidEn":"Do not force the leg to move.","level":"critical","icon":"✚"},{"id":"shoulder-dislocation","ru":"Подозрение на вывих плеча","en":"Suspected shoulder dislocation","category":"injuries","aliases":"вывих плечо рука деформация","stepsRu":["При сильной боли, деформации или невозможности двигать плечом после травмы организуй срочный осмотр.","Поддержи руку в удобном положении; можно приложить холод через ткань.","При тяжёлой травме или невозможности безопасной поездки вызови экстренную помощь."],"stepsEn":["Arrange urgent assessment for severe shoulder pain, deformity or inability to move it after injury.","Support the arm comfortably; apply a wrapped cold pack if appropriate.","Call emergency services for major trauma or if safe transport is unavailable."],"avoidRu":"Не вправляй плечо самостоятельно.","avoidEn":"Do not attempt to put the shoulder back yourself.","level":"urgent","icon":"✚"},{"id":"compartment","ru":"Резко усиливающаяся боль в конечности после травмы","en":"Rapidly worsening limb pain after injury","category":"injuries","aliases":"компартмент синдром сдавление отек онемение гипс","stepsRu":["Внезапная очень сильная боль в конечности, особенно после травмы или под гипсом, требует экстренной оценки.","Вызови помощь или организуй немедленную безопасную доставку в отделение экстренной помощи.","Сообщи о травме, гипсе, отёке и изменении чувствительности."],"stepsEn":["Sudden severe limb pain, especially after injury or under a cast, requires emergency assessment.","Call for help or arrange immediate safe transport to an emergency department.","Report injury, casting, swelling and altered sensation."],"avoidRu":"Не жди самостоятельного уменьшения боли.","avoidEn":"Do not wait for pain to settle on its own.","level":"critical","icon":"✚"},{"id":"rib-injury","ru":"Травма рёбер","en":"Rib injury","category":"injuries","aliases":"ребра перелом грудная клетка ушиб","stepsRu":["После сильного удара по грудной клетке оцени дыхание и наличие других травм.","При ухудшении дыхания, нарастающей боли, кровохарканье или серьёзной аварии вызови экстренную помощь.","При подозрении на перелом организуй медицинскую оценку."],"stepsEn":["Assess breathing and other injuries after a major blow to the chest.","Call emergency services for worsening breathlessness, increasing pain, coughing blood or a serious accident.","Arrange medical assessment if a fracture is suspected."],"avoidRu":"Не стягивай грудную клетку тугой повязкой.","avoidEn":"Do not tightly bind the chest.","level":"urgent","icon":"✚"},{"id":"broken-nose","ru":"Травма носа","en":"Nose injury","category":"injuries","aliases":"перелом носа удар кровь","stepsRu":["Если идёт кровь, сядь с наклоном вперёд и прижми мягкую часть носа.","При деформации, сильной боли или нарушении дыхания организуй медицинскую оценку.","После серьёзного удара, потери сознания или выделения прозрачной жидкости из носа обратись за экстренной помощью."],"stepsEn":["If bleeding, sit leaning forward and pinch the soft part of the nose.","Arrange medical assessment for deformity, severe pain or breathing problems.","Seek emergency help after major injury, unconsciousness or clear fluid from the nose."],"avoidRu":"Не пытайся выпрямить нос самостоятельно.","avoidEn":"Do not straighten the nose yourself.","level":"urgent","icon":"✚"},{"id":"hemoptysis","ru":"Кашель с кровью","en":"Coughing up blood","category":"emergency","aliases":"кровохарканье кровь мокрота кашель","stepsRu":["Даже небольшое количество крови в мокроте требует медицинской оценки.","Если крови больше нескольких прожилок либо есть боль в груди, выраженная одышка или частое сердцебиение, вызови экстренную помощь.","Сообщи медикам о количестве крови и принимаемых лекарствах."],"stepsEn":["Even a small amount of blood in sputum needs medical assessment.","Call emergency services for more than a few streaks or with chest pain, marked breathlessness or a rapid heartbeat.","Report the amount of blood and medicines taken."],"avoidRu":"Не откладывай помощь при нарушении дыхания.","avoidEn":"Do not delay help when breathing is affected.","level":"critical","icon":"✚"},{"id":"bronchiolitis","ru":"Младенец: кашель и затруднение дыхания","en":"Infant cough and breathing difficulty","category":"children","aliases":"бронхиолит рсв свист грудничок","stepsRu":["При выраженном затруднении дыхания, паузах дыхания, посинении или невозможности разбудить малыша вызови экстренную помощь.","Если ребёнок хуже ест, редко мочится или становится более вялым, организуй срочную меди
