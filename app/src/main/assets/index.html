цинскую оценку.","Следи за дыханием и кормлением; держи ребёнка в удобном положении, когда он бодрствует."],"stepsEn":["Call emergency services for severe breathing difficulty, pauses in breathing, blue colouring or inability to wake the infant.","Seek urgent assessment for poor feeding, reduced urine or increasing lethargy.","Monitor breathing and feeding; keep the awake infant comfortable."],"avoidRu":"Не давай случайные лекарства от кашля вместо осмотра.","avoidEn":"Do not give random cough medicines instead of assessment.","level":"critical","icon":"✚"},{"id":"severe-dehydration","ru":"Признаки тяжёлого обезвоживания","en":"Signs of severe dehydration","category":"emergency","aliases":"мало мочи спутанность обезвоживание шок","stepsRu":["При спутанности, трудном пробуждении, холодной коже или нарушении дыхания на фоне потери жидкости вызови экстренную помощь.","При менее тяжёлых, но выраженных признаках обезвоживания организуй срочный осмотр.","Если человек бодрствует и безопасно глотает, давай небольшие глотки раствора для регидратации; следуй указаниям специалистов."],"stepsEn":["Call emergency services for confusion, difficulty waking, cold skin or abnormal breathing after fluid loss.","Arrange urgent assessment for marked but less severe dehydration.","If alert and able to swallow safely, offer small sips of oral rehydration solution and follow professional advice."],"avoidRu":"Не вливай жидкость человеку с нарушенным сознанием.","avoidEn":"Do not give oral fluids to someone with impaired consciousness.","level":"critical","icon":"✚"},{"id":"heat-exhaustion","ru":"Тепловое истощение","en":"Heat exhaustion","category":"environment","aliases":"перегрев слабость жара пот","stepsRu":["Переведи человека в прохладное место, убери лишнюю одежду.","Охлаждай кожу прохладной водой и движением воздуха. Если человек бодр и нормально глотает, предложи прохладную жидкость.","Если за 30 минут не становится лучше либо появились спутанность, судороги или потеря сознания, вызови экстренную помощь и продолжай охлаждать."],"stepsEn":["Move the person to a cool place and remove excess clothing.","Cool the skin with cool water and airflow. Offer cool fluids if alert and able to swallow.","Call emergency services and continue cooling if not improving within 30 minutes or if confusion, seizures or unconsciousness occur."],"avoidRu":"Не возвращайся к нагрузке сразу после улучшения.","avoidEn":"Do not resume exertion immediately after recovery.","level":"urgent","icon":"✚"},{"id":"sunburn","ru":"Солнечный ожог","en":"Sunburn","category":"environment","aliases":"солнце кожа обгорел волдыри","stepsRu":["Уйди с солнца, охлаждай кожу прохладной водой или влажной тканью.","Пей воду, если можешь нормально глотать, и защищай кожу от солнца.","При выраженных волдырях, отёке, лихорадке или головокружении обратись за медицинской помощью."],"stepsEn":["Get out of the sun and cool the skin with cool water or a damp cloth.","Drink water if able to swallow and protect the skin from sunlight.","Seek medical advice for extensive blistering, swelling, fever or dizziness."],"avoidRu":"Не прикладывай лёд непосредственно к коже и не вскрывай волдыри.","avoidEn":"Do not apply ice directly or burst blisters.","level":"common","icon":"✚"},{"id":"kidney-infection","ru":"Температура и боль в боку","en":"Fever with flank pain","category":"everyday","aliases":"почки пиелонефрит температура поясница моча","stepsRu":["При температуре с болью в боку или спине, особенно с нарушением мочеиспускания, организуй срочную медицинскую оценку.","При спутанности, выраженной сонливости или нарушении дыхания вызови экстренную помощь.","Сообщи врачу о беременности, болезнях почек и принимаемых лекарствах."],"stepsEn":["Arrange urgent medical assessment for fever with flank or back pain, especially with urinary symptoms.","Call emergency services for confusion, marked drowsiness or abnormal breathing.","Report pregnancy, kidney disease and medicines."],"avoidRu":"Не начинай лечение оставшимися антибиотиками.","avoidEn":"Do not start leftover antibiotics.","level":"urgent","icon":"✚"},{"id":"acute-pancreatitis","ru":"Сильная постоянная боль вверху живота","en":"Severe persistent upper abdominal pain","category":"emergency","aliases":"панкреатит боль в животе отдает в спину рвота","stepsRu":["Внезапная сильная боль вверху живота, которая не проходит, особенно с рвотой, требует срочной оценки.","При распространении боли в спину, одышке или резком ухудшении вызови экстренную помощь.","Не оставляй человека одного при тяжёлом состоянии."],"stepsEn":["Sudden severe persistent upper abdominal pain, especially with vomiting, needs urgent assessment.","Call emergency services if pain spreads to the back, breathlessness develops or the condition deteriorates.","Stay with the person if severely unwell."],"avoidRu":"Не пытайся определить диагноз самостоятельно и не задерживай помощь.","avoidEn":"Do not try to diagnose the cause yourself or delay help.","level":"critical","icon":"✚"},{"id":"acute-confusion","ru":"Внезапная спутанность сознания","en":"Sudden confusion","category":"emergency","aliases":"делирий дезориентация не узнает людей","stepsRu":["Если человек внезапно стал дезориентированным или ведёт себя необычно, вызови экстренную помощь.","Оставайся рядом, говори спокойно и короткими фразами. Сообщи время начала симптомов.","Наблюдай за дыханием; при возможности сообщи медикам о диабете, травме и лекарствах."],"stepsEn":["Call emergency services for sudden disorientation or unusual behaviour.","Stay nearby and use calm, short sentences. Report onset time.","Monitor breathing; tell clinicians about diabetes, injury and medicines if known."],"avoidRu":"Не оставляй человека одного и не пытайся самостоятельно назначать успокоительные.","avoidEn":"Do not leave the person alone or independently give sedatives.","level":"critical","icon":"✚"},{"id":"drug-rash","ru":"Распространённая сыпь с волдырями после лекарства","en":"Widespread blistering rash after medicine","category":"emergency","aliases":"стивенса джонсона сыпь слизистые лекарство волдыри","stepsRu":["Если после нового лекарства появилась распространяющаяся сыпь с волдырями, шелушением кожи или болезненными поражениями рта и глаз, необходима экстренная оценка.","При тяжёлом состоянии или затруднённом дыхании вызови экстренную помощь.","Возьми упаковки недавно использованных препаратов и сообщи время их приёма."],"stepsEn":["A spreading rash with blisters, peeling skin or painful mouth and eye lesions after a new medicine requires emergency assessment.","Call emergency services if severely unwell or having breathing difficulty.","Bring recently used medicine packages and report when they were taken."],"avoidRu":"Не принимай следующую дозу подозреваемого нового препарата до срочного медицинского указания; не задерживай помощь.","avoidEn":"Do not take another dose of the suspected new medicine before urgent medical advice; do not delay care.","level":"critical","icon":"✚"},{"id":"sickle-crisis","ru":"Серповидноклеточная болезнь: опасное ухудшение","en":"Sickle cell disease: dangerous deterioration","category":"emergency","aliases":"серповидноклеточная анемия криз боль","stepsRu":["При известной серповидноклеточной болезни выраженная боль, не поддающаяся индивидуальному плану, или лихорадка требуют срочного обращения за помощью.","При боли в груди, нарушении дыхания или признаках инсульта вызови экстренную помощь.","Сообщи диагноз и имеющийся план лечения; следуй указаниям специалиста."],"stepsEn":["In known sickle cell disease, severe pain not controlled by the personal plan or fever requires urgent medical advice.","Call emergency services for chest pain, breathing difficulty or stroke signs.","Report the diagnosis and care plan; follow professional advice."],"avoidRu":"Не откладывай помощь, если симптомы необычны для человека.","avoidEn":"Do not delay help if symptoms are unusual for the person.","level":"critical","icon":"✚"},{"id":"appendicitis","ru":"Нарастающая боль в правой нижней части живота","en":"Worsening lower-right abdominal pain","category":"everyday","aliases":"аппендицит боль справа пупок","stepsRu":["Нарастающая боль, особенно перемещающаяся к правой нижней части живота, требует срочной медицинской оценки.","При очень сильной боли, спутанности или резком ухудшении вызывай экстренную помощь.","Сообщи время начала, температуру, тошноту и другие признаки."],"stepsEn":["Worsening pain, especially moving to the lower right abdomen, needs urgent medical assessment.","Call emergency services for severe pain, confusion or rapid deterioration.","Report onset, fever, nausea and other symptoms."],"avoidRu":"Не откладывай осмотр ради домашнего лечения.","avoidEn":"Do not delay assessment for home treatment.","level":"urgent","icon":"✚"},{"id":"battery-ear-nose","ru":"Батарейка в носу или ухе ребёнка","en":"Button battery in a child's nose or ear","category":"children","aliases":"батарейка таблетка нос ухо ребенок","stepsRu":["При подозрении, что в носу или ухе застряла батарейка, немедленно доставь ребёнка в отделение экстренной помощи.","Если трудно безопасно добраться или нарушено дыхание, вызови экстренную службу.","Сообщи время происшествия и тип батарейки, если известно."],"stepsEn":["Take the child to an emergency department immediately if a battery may be lodged in the nose or ear.","Call emergency services if safe transport is unavailable or breathing is affected.","Report the time and battery type if known."],"avoidRu":"Не промывай и не пытайся извлечь батарейку инструментом.","avoidEn":"Do not irrigate or attempt removal with tools.","level":"critical","icon":"✚"},{"id":"postpartum-bleeding","ru":"Сильное кровотечение после родов","en":"Heavy bleeding after birth","category":"emergency","aliases":"послеродовое кровотечение роженица слабость","stepsRu":["При внезапном обильном кровотечении после родов, особенно со слабостью, головокружением или частым сердцебиением, вызови экстренную помощь.","Помоги лечь в безопасном положении и сохраняй тепло.","Сообщи диспетчеру, когда были роды, и следи за дыханием."],"stepsEn":["Call emergency services for sudden heavy bleeding after birth, especially with weakness, dizziness or a rapid heartbeat.","Help the person lie safely and keep warm.","Tell the dispatcher when the birth occurred and monitor breathing."],"avoidRu":"Не оставляй человека одного и не пытайся остановить внутреннее кровотечение домашними средствами.","avoidEn":"Do not leave the person alone or try home remedies for internal bleeding.","level":"critical","icon":"✚"},{"id":"pregnancy-bleeding","ru":"Кровотечение во время беременности","en":"Bleeding during pregnancy","category":"emergency","aliases":"беременность кровь кровянистые выделения","stepsRu":["При любом кровотечении во время беременности свяжись с медицинской или акушерской службой.","При обильной кровопотере, сильной боли, слабости или обмороке вызови экстренную помощь.","Сообщи срок беременности и примерный объём кровопотери."],"stepsEn":["Contact a clinician or maternity service for any bleeding during pregnancy.","Call emergency services for heavy bleeding, severe pain, weakness or fainting.","Report gestational age and approximate blood loss."],"avoidRu":"Не откладывай обращение и не используй тампоны для оценки кровотечения.","avoidEn":"Do not delay care or use tampons to assess bleeding.","level":"urgent","icon":"✚"},{"id":"newborn-jaundice","ru":"Желтуха у новорождённого: тревожные признаки","en":"Newborn jaundice: warning signs","category":"children","aliases":"желтая кожа желтые глаза новорожденный билирубин","stepsRu":["Жёлтая окраска кожи или глаз в первые сутки жизни требует немедленной медицинской оценки.","Если ребёнок трудно просыпается, не ест, плохо дышит или необычно вялый, организуй экстренную помощь.","При появлении желтухи позже первых суток также свяжись с медицинским специалистом."],"stepsEn":["Yellow skin or eyes in the first 24 hours of life require immediate medical assessment.","Seek emergency help for difficulty waking, poor feeding, breathing problems or unusual lethargy.","Contact a health professional if jaundice appears later as well."],"avoidRu":"Не заменяй медицинскую оценку солнечными ваннами.","avoidEn":"Do not substitute sun exposure for medical assessment.","level":"urgent","icon":"✚"},{"id":"urinary-retention","ru":"Внезапная невозможность помочиться","en":"Sudden inability to pass urine","category":"emergency","aliases":"острая задержка мочи мочевой пузырь не могу пописать","stepsRu":["Если человек внезапно не может помочиться, особенно при боли и распирании внизу живота, требуется немедленная медицинская оценка.","Организуй безопасную доставку в отделение экстренной помощи; вызови экстренную службу при тяжёлом состоянии.","Сообщи о лекарствах, операциях и новых нарушениях чувствительности или движений ног."],"stepsEn":["Sudden inability to pass urine, especially with lower abdominal pain and distension, requires immediate medical assessment.","Arrange safe transport to an emergency department; call emergency services if severely unwell.","Report medicines, surgery and new leg weakness or sensory changes."],"avoidRu":"Не пытайся самостоятельно вводить катетер или пить большие объёмы воды для устранения задержки.","avoidEn":"Do not attempt self-catheterisation without training or drink large volumes to resolve retention.","level":"urgent","icon":"✚"},{"id":"embedded-object","ru":"Предмет застрял в ране","en":"Object embedded in a wound","category":"injuries","aliases":"стекло осколок рана предмет торчит","stepsRu":["При серьёзной ране или сильном кровотечении вызови экстренную помощь.","Не извлекай предмет. При кровотечении прижимай края раны вокруг него, избегая давления на сам предмет.","Защити рану чистой повязкой вокруг предмета и следи за состоянием."],"stepsEn":["Call emergency services for serious wounds or severe bleeding.","Leave the object in place. For bleeding, apply pressure around it rather than directly on it.","Protect the wound with clean dressings around the object and monitor the person."],"avoidRu":"Не вынимай предмет и не проталкивай его глубже.","avoidEn":"Do not remove or push the object deeper.","level":"urgent","icon":"✚"},{"id":"wrist-fracture","ru":"Подозрение на перелом кисти или предплечья","en":"Suspected wrist or forearm fracture","category":"injuries","aliases":"запястье кисть предплечье падение перелом","stepsRu":["После травмы с выраженной болью, отёком или деформацией организуй срочный осмотр.","Поддержи руку в удобном положении, сними кольца и часы, если это легко.","При открытом переломе, сильном кровотечении или тяжёлой травме вызови экстренную помощь."],"stepsEn":["Arrange urgent assessment for marked pain, swelling or deformity after injury.","Support the arm comfortably; remove rings and watches if easy.","Call emergency services for an open fracture, major bleeding or severe trauma."],"avoidRu":"Не выпрямляй конечность силой.","avoidEn":"Do not force the limb straight.","level":"urgent","icon":"✚"},{"id":"ankle-fracture","ru":"Подозрение на перелом лодыжки","en":"Suspected broken ankle","category":"injuries","aliases":"лодыжка голеностоп сломал ногу","stepsRu":["После травмы с сильной болью, отёком или невозможностью опираться на ногу организуй срочную оценку.","Не нагружай повреждённую ногу; поддерживай её в удобном положении.","При деформации, открытой ране, выраженном онемении или тяжёлой травме организуй экстренную помощь."],"stepsEn":["Arrange urgent assessment after injury with severe pain, swelling or inability to bear weight.","Avoid weight-bearing and support the limb comfortably.","Seek emergency help for deformity, an open wound, marked numbness or major trauma."],"avoidRu":"Не пытайся проверить перелом ходьбой.","avoidEn":"Do not test a possible fracture by walking.","level":"urgent","icon":"✚"},{"id":"intussusception","ru":"Малыш: приступы сильной боли в животе","en":"Infant: episodes of severe abdominal pain","category":"children","aliases":"инвагинация ребенок плачет живот приступы","stepsRu":["У малыша повторяющиеся приступы сильной боли, рвота или необычная вялость требуют экстренной оценки.","Организуй немедленную доставку в больницу; при тяжёлом состоянии вызови экстренную помощь.","Сообщи о времени начала, характере приступов и наличии крови в стуле."],"stepsEn":["Repeated episodes of severe pain, vomiting or unusual lethargy in an infant require emergency assessment.","Arrange immediate hospital evaluation; call emergency services if severely unwell.","Report onset, pattern of episodes and any blood in the stool."],"avoidRu":"Не жди появления крови в стуле, чтобы обратиться за помощью.","avoidEn":"Do not wait for blood in the stool before seeking help.","level":"critical","icon":"✚"},{"id":"blood-urine","ru":"Кровь в моче","en":"Blood in urine","category":"everyday","aliases":"гематурия моча красная кровь","stepsRu":["Видимая кровь в моче требует медицинской оценки, даже если появилась впервые или боли нет.","При невозможности мочиться, сильной боли или резком ухудшении обращайся за неотложной помощью.","Сообщи врачу о лекарствах, травмах, температуре и сопутствующих симптомах."],"stepsEn":["Visible blood in urine needs medical assessment, even if it is the first episode or painless.","Seek urgent help for inability to urinate, severe pain or rapid deterioration.","Report medicines, injuries, fever and accompanying symptoms."],"avoidRu":"Не прекращай назначенные антикоагулянты самостоятельно.","avoidEn":"Do not stop prescribed anticoagulants independently.","level":"urgent","icon":"✚"},{"id":"kidney-stone","ru":"Приступ сильной боли в боку с отдачей в пах","en":"Severe flank pain radiating to the groin","category":"everyday","aliases":"почечная колика камень мочеточник","stepsRu":["При сильной боли в боку, особенно с тошнотой или кровью в моче, организуй срочный осмотр.","Температура, озноб или невозможность мочиться на фоне такой боли требуют неотложной оценки.","При тяжёлом состоянии или невозможности безопасно добраться вызови экстренную службу."],"stepsEn":["Arrange urgent assessment for severe flank pain, especially with nausea or blood in urine.","Fever, chills or inability to urinate with this pain require urgent assessment.","Call emergency services if severely unwell or safe transport is unavailable."],"avoidRu":"Не пытайся устранить боль чрезмерным питьём или случайными препаратами.","avoidEn":"Do not try to resolve the pain by excessive drinking or random medicines.","level":"urgent","icon":"✚"},{"id":"hernia-emergency","ru":"Болезненная грыжа с рвотой","en":"Painful hernia with vomiting","category":"emergency","aliases":"ущемление грыжа живот пах выпячивание","stepsRu":["Внезапная сильная боль в области грыжи, рвота или твёрдое болезненное выпячивание требуют немедленной медицинской оценки.","Организуй экстренную помощь; при тяжёлом состоянии вызови экстренную службу.","Сообщи о времени начала, рвоте и нарушениях стула."],"stepsEn":["Sudden severe hernia pain, vomiting or a firm tender lump require immediate medical assessment.","Arrange emergency care; call emergency services if severely unwell.","Report onset time, vomiting and bowel symptoms."],"avoidRu":"Не пытайся вправить болезненную грыжу силой.","avoidEn":"Do not forcibly push a painful hernia back.","level":"critical","icon":"✚"},{"id":"swallowed-object","ru":"Проглочен посторонний предмет","en":"Swallowed foreign object","category":"children","aliases":"монета игрушка проглотил предмет","stepsRu":["Если нарушено дыхание, вызови экстренную помощь и действуй по возрастному алгоритму удушья.","При проглатывании батарейки, магнита или острого предмета нужна немедленная медицинская оценка.","При боли, слюнотечении, трудности глотания или рвоте срочно обращайся за помощью. Сообщи тип предмета."],"stepsEn":["For breathing obstruction call emergency services and follow age-specific choking guidance.","A swallowed battery, magnet or sharp object needs immediate medical assessment.","Seek urgent help for pain, drooling, swallowing difficulty or vomiting. Report the object type."],"avoidRu":"Не вызывай рвоту и не пытайся протолкнуть предмет едой.","avoidEn":"Do not induce vomiting or try to push the object down with food.","level":"urgent","icon":"✚"},{"id":"aed","ru":"Использование автоматического дефибриллятора (AED)","en":"Using an automated external defibrillator (AED)","category":"emergency","aliases":"аед дефибриллятор разряд электроды остановка сердца","stepsRu":["При отсутствии сознания и нормального дыхания вызови экстренную помощь, начни СЛР. Попроси другого человека принести AED.","Включи аппарат. Обнажи грудную клетку, размести электроды как показано на их рисунках и выполняй голосовые команды.","Во время анализа и разряда никто не должен касаться пострадавшего. После команды аппарата сразу возобнови СЛР."],"stepsEn":["For unresponsiveness and abnormal or absent breathing, call emergency services and start CPR. Ask someone else to bring an AED.","Switch it on, expose the chest, position pads as shown and follow its prompts.","Keep everyone clear during analysis and shock delivery. Resume CPR promptly when instructed."],"avoidRu":"Не прекращай СЛР ради самостоятельного поиска AED, если рядом некому помочь.","avoidEn":"Do not interrupt CPR to search for an AED yourself if no one else is available.","level":"critical","icon":"✚"},{"id":"tia","ru":"Признаки инсульта прошли","en":"Stroke-like symptoms have resolved","category":"emergency","aliases":"транзиторная ишемическая атака тиа микроинсульт речь","stepsRu":["Даже если внезапная слабость, перекос лица или нарушение речи уже исчезли, вызывай экстренную помощь.","Сообщи время начала и исчезновения симптомов, какие именно признаки были.","Оставайся рядом и наблюдай за состоянием."],"stepsEn":["Call emergency services even if sudden weakness, facial asymmetry or speech problems have resolved.","Report when the symptoms began and ended and what happened.","Stay nearby and monitor the person."],"avoidRu":"Не отменяй вызов из-за улучшения.","avoidEn":"Do not cancel help because the symptoms improved.","level":"critical","icon":"✚"},{"id":"double-vision","ru":"Внезапное двоение в глазах","en":"Sudden double vision","category":"injuries","aliases":"диплопия двоится два изображения","stepsRu":["Внезапное двоение требует срочной медицинской оценки.","Если одновременно появилась сильная головная боль, травма головы, слабость или нарушилась речь, обращайся за экстренной помощью.","Сообщи время начала и сопутствующие симптомы."],"stepsEn":["Sudden double vision needs urgent assessment.","Seek emergency help if it follows head injury or occurs with severe headache, weakness or speech problems.","Report onset time and associated symptoms."],"avoidRu":"Не управляй транспортом при двоении.","avoidEn":"Do not drive with double vision.","level":"urgent","icon":"✚"},{"id":"angioedema","ru":"Внезапный отёк губ, языка или горла","en":"Sudden swelling of lips, tongue or throat","category":"emergency","aliases":"ангиоотек квинке опух язык горло","stepsRu":["При внезапном отёке губ, языка или горла вызови экстренную помощь.","При признаках анафилаксии следуй её алгоритму и помоги применить назначенный автоинъектор адреналина, если он есть.","Следи за дыханием, не оставляй человека одного; при отсутствии нормального дыхания начинай СЛР."],"stepsEn":["Call emergency services for sudden swelling of lips, tongue or throat.","If anaphylaxis is suspected, follow its guide and assist with a prescribed adrenaline autoinjector if available.","Monitor breathing, stay with the person and start CPR if breathing is not normal."],"avoidRu":"Не жди действия антигистаминного средства при угрозе дыханию.","avoidEn":"Do not wait for an antihistamine to work when breathing may be threatened.","level":"critical","icon":"✚"},{"id":"hives","ru":"Крапивница без нарушения дыхания","en":"Hives without breathing difficulty","category":"everyday","aliases":"крапивница зуд волдыри аллергия","stepsRu":["При зудящих приподнятых высыпаниях следи за общим состоянием и возможным распространением отёка.","Если появились внезапный отёк губ, языка, горла, затруднение дыхания или обморок, вызывай экстренную помощь.","При сохраняющейся или усиливающейся сыпи обратись за медицинской консультацией."],"stepsEn":["For itchy raised welts, watch the person's condition and possible swelling.","Call emergency services if sudden lip, tongue or throat swelling, breathing difficulty or collapse develops.","Seek medical advice for persistent or worsening rash."],"avoidRu":"Не считай любую сыпь безопасной аллергией.","avoidEn":"Do not assume every rash is a harmless allergy.","level":"common","icon":"✚"},{"id":"septic-joint","ru":"Внезапно горячий, опухший и болезненный сустав","en":"Suddenly hot, swollen, painful joint","category":"injuries","aliases":"септический артрит сустав температура инфекция","stepsRu":["Внезапная сильная боль, отёк и жар в одном суставе требуют срочной медицинской оценки.","Сообщи о лихорадке, протезе сустава, недавних вмешательствах и лекарствах.","При резком ухудшении, спутанности или нарушении дыхания вызывай экстренную помощь."],"stepsEn":["Sudden severe pain, swelling and heat in one joint require urgent assessment.","Report fever, joint replacement, recent procedures and medicines.","Call emergency services for rapid deterioration, confusion or breathing problems."],"avoidRu":"Не откладывай осмотр, считая это обычным растяжением.","avoidEn":"Do not delay assessment assuming it is a simple sprain.","level":"urgent","icon":"✚"},{"id":"rectal-bleeding","ru":"Кровь из прямой кишки","en":"Rectal bleeding","category":"everyday","aliases":"кровь стул задний проход кровотечение","stepsRu":["При непрекращающемся или обильном кровотечении, слабости или обмороке вызывай экстренную помощь.","При небольшом кровотечении организуй медицинскую оценку; сообщи о крови в стуле, боли и лекарствах.","При потере сознания оцени дыхание и следуй указаниям диспетчера."],"stepsEn":["Call emergency services for heavy or ongoing bleeding, weakness or collapse.","Arrange assessment for smaller amounts; report blood in stool, pain and medicines.","If unresponsive, assess breathing and follow dispatcher instructions."],"avoidRu":"Не отменяй самостоятельно назначенные антикоагулянты.","avoidEn":"Do not independently stop prescribed anticoagulants.","level":"urgent","icon":"✚"},{"id":"priapism","ru":"Длительная болезненная эрекция","en":"Prolonged painful erection","category":"emergency","aliases":"приапизм болезненная эрекция","stepsRu":["Если болезненная эрекция продолжается несколько часов, нужна экстренная оценка; не дожидайся четырёх часов.","При серповидноклеточной болезни болезненная эрекция продолжительностью около часа требует экстренной оценки.","Организуй немедленную безопасную поездку в больницу; при невозможности вызови экстренную помощь."],"stepsEn":["A painful erection lasting several hours requires emergency assessment; do not wait until four hours.","In sickle cell disease, a painful erection lasting about an hour requires emergency assessment.","Arrange immediate safe transport to hospital or call emergency services if unavailable."],"avoidRu":"Не пытайся устранить состояние случайными лекарствами или травмирующими действиями.","avoidEn":"Do not try random medicines or injurious methods.","level":"urgent","icon":"✚"},{"id":"altitude-sickness","ru":"Горная болезнь","en":"Altitude sickness","category":"environment","aliases":"высота горы головная боль тошнота гипоксия","stepsRu":["При головной боли, тошноте или головокружении после подъёма прекрати набор высоты. Отдыхай и наблюдай за состоянием.","Если симптомы усиливаются или не проходят, спускайся на меньшую высоту безопасным способом.","При одышке в покое, спутанности, нарушении координации или выраженной сонливости организуй экстренную помощь и срочный безопасный спуск с сопровождением."],"stepsEn":["Stop ascending if headache, nausea or dizziness develop after ascent. Rest and monitor symptoms.","Descend safely if symptoms persist or worsen.","For breathlessness at rest, confusion, poor coordination or marked drowsiness, seek emergency help and urgent assisted descent."],"avoidRu":"Не продолжай подъём при симптомах и не оставляй тяжело больного одного.","avoidEn":"Do not keep ascending with symptoms or leave a severely ill person alone.","level":"urgent","icon":"✚"},{"id":"marine-sting","ru":"Ужаление медузы или другого морского животного","en":"Jellyfish or other marine sting","category":"environment","aliases":"медуза море щупальца ожог","stepsRu":["Выйди из воды, если это безопасно, и обратись к спасателю. У разных видов морских животных рекомендации различаются.","При нарушении дыхания, боли в груди, коллапсе или тяжёлом состоянии вызови экстренную помощь.","Следуй местным рекомендациям спасателей или токсикологической службы по удалению щупалец и обработке кожи."],"stepsEn":["Leave the water safely and ask a lifeguard for help. Guidance differs by marine species.","Call emergency services for breathing difficulty, chest pain, collapse or severe illness.","Follow local lifeguard or poison service advice on removing tentacles and treating the skin."],"avoidRu":"Не три поражённую кожу и не применяй мочу.","avoidEn":"Do not rub the affected skin or apply urine.","level":"urgent","icon":"✚"},{"id":"friction-blister","ru":"Мозоль с пузырём от трения","en":"Friction blister","category":"injuries","aliases":"мозоль волдырь натер ногу","stepsRu":["Прекрати трение и аккуратно очисти кожу.","Защити пузырь чистой мягкой или гидроколлоидной повязкой; не вскрывай его намеренно.","При гное, усиливающемся покраснении, боли или признаках инфекции обратись за медицинской помощью."],"stepsEn":["Stop friction and gently clean the skin.","Protect the blister with a clean soft or hydrocolloid dressing; do not deliberately burst it.","Seek medical help for pus, spreading redness, increasing pain or other signs of infection."],"avoidRu":"Не срывай оставшуюся кожу над вскрывшимся пузырём.","avoidEn":"Do not peel off remaining skin over a burst blister.","level":"common","icon":"✚"},{"id":"nose-ear-object","ru":"Посторонний предмет в носу или ухе","en":"Foreign object in nose or ear","category":"children","aliases":"бусина игрушка нос ухо ребенок застрял","stepsRu":["Если нарушено дыхание, немедленно вызывай экстренную помощь.","При подозрении на батарейку или магниты нужна экстренная медицинская оценка.","Если предмет застрял, организуй осмотр и сообщи, что это за предмет."],"stepsEn":["Call emergency services immediately if breathing is affected.","Suspected batteries or magnets need emergency assessment.","Arrange assessment if an object is lodged and tell the clinician what it is."],"avoidRu":"Не проталкивай предмет глубже ватной палочкой или инструментом.","avoidEn":"Do not push the object deeper with a cotton bud or tool.","level":"urgent","icon":"✚"},{"id":"smoke-inhalation","ru":"Вдыхание дыма при пожаре","en":"Smoke inhalation after fire","category":"environment","aliases":"дым пожар надышался копоть ожог дыхательных путей","stepsRu":["Не входи в задымлённое помещение. Вызови пожарную и экстренную службу с безопасного места.","Если человек уже находится в безопасной зоне, оцени дыхание и сознание. При нарушенном дыхании следуй диспетчеру.","После вдыхания дыма нужна медицинская оценка, особенно при кашле, охриплости, одышке или ожогах лица."],"stepsEn":["Do not enter a smoke-filled building. Call fire and emergency services from safety.","If the person is already in a safe area, assess breathing and responsiveness. Follow dispatcher advice if breathing is abnormal.","Smoke exposure needs medical assessment, especially with cough, hoarseness, breathlessness or facial burns."],"avoidRu":"Не возвращайся за вещами и не жди ухудшения дыхания.","avoidEn":"Do not return for belongings or wait for breathing to worsen.","level":"critical","icon":"✚"},{"id":"motion-sickness","ru":"Укачивание в транспорте","en":"Motion sickness","category":"everyday","aliases":"укачало тошнит машина корабль самолет","stepsRu":["Если возможно, прекрати движение или сядь так, чтобы меньше ощущать его. Смотри на неподвижный горизонт.","Обеспечь свежий воздух, избегай чтения и просмотра экрана. При нормальном глотании пей небольшими глотками.","При необычно сильном головокружении, обмороке, неврологических симптомах или постоянной рвоте обратись за медицинской помощью."],"stepsEn":["Stop moving if possible or sit where motion is less pronounced. Look at a fixed horizon.","Get fresh air, avoid reading and screens, and sip fluids if able to swallow.","Seek medical assessment for unusually severe dizziness, collapse, neurological symptoms or persistent vomiting."],"avoidRu":"Не управляй транспортом, если состояние мешает безопасному вождению.","avoidEn":"Do not drive if symptoms affect safe driving.","level":"common","icon":"✚"},{"id":"needlestick","ru":"Укол использованной иглой","en":"Injury from a used needle","category":"injuries","aliases":"игла шприц укол инфекция кровь гепатит вич","stepsRu":["Промой место прокола проточной водой с мылом, не растирая рану.","Закрой повреждение чистой водостойкой повязкой.","Немедленно обратись за медицинской оценкой риска заражения. Если травма произошла на работе, сообщи ответственному за безопасность."],"stepsEn":["Wash the puncture under running water with soap without scrubbing.","Cover with a clean waterproof dressing.","Seek immediate medical assessment of infection risk. If the injury occurred at work, notify the relevant safety team."],"avoidRu":"Не отсасывай кровь и не откладывай обращение до появления симптомов.","avoidEn":"Do not suck the wound or wait for symptoms.","level":"urgent","icon":"✚"},{"id":"dirty-puncture","ru":"Глубокая или загрязнённая колотая рана","en":"Deep or contaminated puncture wound","category":"injuries","aliases":"гвоздь прокол ржавый земля столбняк","stepsRu":["Если есть кровотечение, прижми рану чистой повязкой. Если внутри остался предмет, не извлекай его.","Если возможно без травмирования, промой загрязнённую рану чистой водой и защити повязкой.","Организуй срочную медицинскую оценку, сообщи о загрязнении и дате последней вакцинации от столбняка, если известна."],"stepsEn":["Control bleeding with a clean dressing. If an object remains embedded, leave it in place.","If possible without causing further injury, rinse contamination with clean water and protect with a dressing.","Arrange urgent assessment; report contamination and the last tetanus vaccination date if known."],"avoidRu":"Не пытайся вычищать глубокий прокол инструментами и не закрывай его клеем.","avoidEn":"Do not probe a deep puncture with tools or close it with glue.","level":"urgent","icon":"✚"},{"id":"human-bite","ru":"Укус человека с повреждением кожи","en":"Human bite breaking the skin","category":"injuries","aliases":"человек укусил зубы драка кисть кровь","stepsRu":["Промой рану водой с мылом. При кровотечении приложи чистую повязку с давлением.","Защити рану чистой повязкой и обратись за медицинской оценкой: укусы человека могут инфицироваться.","Сообщи о локализации укуса, контакте с кровью и прививках. При неконтролируемом кровотечении вызывай экстренную помощь."],"stepsEn":["Wash the wound with soap and water. Apply pressure with a clean dressing if bleeding.","Protect with a clean dressing and seek medical assessment because human bites can become infected.","Report the bite location, blood exposure and vaccinations. Call emergency services for uncontrolled bleeding."],"avoidRu":"Не заклеивай рану герметично и не начинай оставшиеся антибиотики.","avoidEn":"Do not seal the wound or start leftover antibiotics.","level":"urgent","icon":"✚"},{"id":"broken-tooth","ru":"Скол или перелом зуба","en":"Chipped or broken tooth","category":"injuries","aliases":"сломался зуб откололся кусочек зуба","stepsRu":["Найди отколовшийся фрагмент, если это безопасно. Сохрани его в чистой ёмкости с молоком или слюной, не во рту.","Организуй осмотр стоматологом; сообщи о боли, подвижности зуба и травме.","При серьёзной травме лица, нарушении дыхания или сильном кровотечении нужна экстренная помощь."],"stepsEn":["If safe, find the broken fragment and keep it in a clean container of milk or saliva, not inside the mouth.","Arrange dental assessment; report pain, loose teeth and injury.","Seek emergency help for major facial injury, breathing difficulty or severe bleeding."],"avoidRu":"Не приклеивай фрагмент бытовым клеем.","avoidEn":"Do not attach the fragment with household glue.","level":"urgent","icon":"✚"},{"id":"eardrum-injury","ru":"Подозрение на повреждение барабанной перепонки","en":"Suspected eardrum injury","category":"injuries","aliases":"ухо хлопок удар кровь перепонка шум","stepsRu":["При боли, ухудшении слуха или выделениях после удара, перепада давления или травмы уха организуй медицинскую оценку.","До осмотра сохраняй ухо сухим и защищай от попадания воды.","При серьёзной травме головы, нарушении сознания или внезапной потере слуха обращайся за неотложной помощью."],"stepsEn":["Arrange medical assessment for pain, reduced hearing or discharge after impact, pressure change or ear injury.","Keep the ear dry and protected from water until assessed.","Seek urgent or emergency help for sudden hearing loss, altered consciousness or major head injury."],"avoidRu":"Не вставляй предметы в слуховой проход и не применяй ушные капли без медицинского указания.","avoidEn":"Do not insert objects into the ear canal or use ear drops without professional advice.","level":"urgent","icon":"✚"},{"id":"contact-lens-eye","ru":"Красный болезненный глаз при ношении линз","en":"Painful red eye in a contact lens wearer","category":"injuries","aliases":"контактные линзы красный глаз инфекция роговица","stepsRu":["Сними контактные линзы, если это легко сделать, и не надевай их снова до осмотра.","При болезненном красном глазе на фоне ношения линз срочно обратись к глазному специалисту.","При внезапном нарушении зрения, сильной боли или светобоязни нужна неотложная медицинская оценка."],"stepsEn":["Remove contact lenses if easy and do not wear them again until assessed.","Seek urgent eye assessment for a painful red eye while wearing contact lenses.","Sudden vision change, severe pain or light sensitivity require urgent medical assessment."],"avoidRu":"Не используй чужие капли или остатки глазных антибиотиков и не три глаз.","avoidEn":"Do not use someone else's drops or leftover eye antibiotics, and do not rub the eye.","level":"urgent","icon":"✚"},{"id":"child-green-vomit","ru":"Зелёная рвота у младенца или ребёнка","en":"Green vomit in an infant or child","category":"children","aliases":"желчь зеленая рвота ребенок новорожденный","stepsRu":["Зелёная или жёлто-зелёная рвота у ребёнка требует немедленной оценки в отделении экстренной помощи.","Организуй безопасную доставку; при выраженной вялости, нарушении дыхания или тяжёлом состоянии вызови экстренную службу.","Сообщи возраст, время начала, цвет рвоты, боли в животе и изменения стула."],"stepsEn":["Green or yellow-green vomit in a child requires immediate emergency department assessment.","Arrange safe transport; call emergency services for marked lethargy, breathing difficulty or severe illness.","Report age, onset, vomit colour, abdominal pain and bowel changes."],"avoidRu":"Не жди следующего эпизода и не давай противорвотные средства вместо осмотра.","avoidEn":"Do not wait for another episode or give antiemetics instead of assessment.","level":"critical","icon":"✚"},{"id":"diabetic-foot-wound","ru":"Рана или волдырь на стопе при диабете","en":"Foot wound or blister in diabetes","category":"injuries","aliases":"диабетическая стопа язва нога волдырь диабет","stepsRu":["При новой ране, волдыре или изменении цвета стопы у человека с диабетом организуй быструю медицинскую оценку, даже если боли нет.","Защити повреждение чистой повязкой и уменьши давление на поражённый участок.","При резком ухудшении, лихорадке, спутанности или признаках тяжёлой инфекции обращайся за экстренной помощью."],"stepsEn":["Arrange prompt medical assessment for a new wound, blister or colour change on a foot in someone with diabetes, even without pain.","Protect the injury with a clean dressing and reduce pressure on the affected area.","Seek emergency help for rapid deterioration, fever with severe illness, confusion or other signs of serious infection."],"avoidRu":"Не вскрывай волдырь и не срезай мозоли самостоятельно.","avoidEn":"Do not burst blisters or cut away calluses yourself.","level":"urgent","icon":"✚"},{"id":"tourniquet","ru":"Опасное кровотечение из руки или ноги: турникет","en":"Life-threatening limb bleeding: tourniquet","category":"injuries","aliases":"жгут турникет конечность артерия кровь","stepsRu":["Вызови экстренную помощь и сразу сильно прижми источник кровотечения чистой тканью или повязкой.","Если опасное кровотечение из конечности не останавливается прямым давлением, используй готовый кровоостанавливающий турникет по инструкции. Размести его на 5–7 см выше раны, не на суставе.","Затяни до остановки кровотечения, запиши время наложения и передай сведения медикам."],"stepsEn":["Call emergency services and immediately apply firm direct pressure with a clean dressing or cloth.","If life-threatening limb bleeding continues despite direct pressure, use a commercial tourniquet according to its instructions, 5–7 cm above the wound and not over a joint.","Tighten until bleeding stops, record the application time and tell responders."],"avoidRu":"Не ослабляй и не снимай наложенный турникет самостоятельно.","avoidEn":"Do not loosen or remove the applied tourniquet yourself.","level":"critical","icon":"✚"},{"id":"imminent-birth","ru":"Роды начались вне больницы","en":"Imminent birth outside hospital","category":"emergency","aliases":"роды потуги ребенок рождается дома","stepsRu":["Если ребёнок уже рождается или появились непреодолимые потуги, вызови экстренную помощь и включи громкую связь.","Оставайся рядом, обеспечь тепло, приватность и безопасное положение. Выполняй команды диспетчера.","Если ребёнок родился, сообщи об этом диспетчеру и следуй его указаниям по дыханию и согреванию."],"stepsEn":["Call emergency services on speakerphone if the baby is coming now or there is a strong urge to push.","Stay nearby, provide warmth, privacy and a safe position. Follow dispatcher instructions.","If the baby is born, tell the dispatcher and follow instructions on breathing and keeping warm."],"avoidRu":"Не тяни ребёнка, плаценту или пуповину; не перерезай пуповину самостоятельно.","avoidEn":"Do not pull the baby, placenta or cord, or cut the cord yourself.","level":"critical","icon":"✚"},{"id":"cord-prolapse","ru":"Выпадение пуповины до рождения","en":"Umbilical cord prolapse before birth","category":"emergency","aliases":"пуповина выпала беременность воды","stepsRu":["Если после отхождения вод видна или ощущается пуповина до рождения ребёнка, немедленно вызови экстренную помощь.","Сообщи диспетчеру о подозрении на выпадение пуповины. Выполняй указания по положению тела и ожиданию бригады.","Не оставляй роженицу одну."],"stepsEn":["Call emergency services immediately if the cord is seen or felt before birth after the waters break.","Tell the dispatcher about suspected cord prolapse and follow positioning and waiting instructions.","Stay with the person."],"avoidRu":"Не трогай и не пытайся вправить пуповину.","avoidEn":"Do not touch or attempt to push the cord back.","level":"critical","icon":"✚"},{"id":"reduced-fetal-movement","ru":"Ребёнок в утробе стал двигаться меньше","en":"Reduced fetal movements","category":"everyday","aliases":"беременность шевеления плода меньше перестал","stepsRu":["Если привычные движения плода ослабли, исчезли или изменились, немедленно свяжись с акушерской службой.","Не жди следующего дня; сообщи срок беременности и когда заметила изменения.","Если после предыдущего осмотра проблема повторилась, обратись повторно."],"stepsEn":["Contact maternity services immediately if the baby's usual movements slow, stop or change.","Do not wait until the next day; report gestational age and when the change began.","Seek help again if the problem recurs after assessment."],"avoidRu":"Не полагайся на домашний допплер для исключения опасности.","avoidEn":"Do not rely on a home Doppler to rule out danger.","level":"urgent","icon":"✚"},{"id":"kneecap-dislocation","ru":"Подозрение на вывих надколенника","en":"Suspected dislocated kneecap","category":"injuries","aliases":"колено чашечка вывих надколенник","stepsRu":["При деформации колена или подозрении на вывих организуй срочную медицинскую оценку.","Поддержи колено в найденном удобном положении, не нагружай ногу.","При тяжёлой травме, сильном кровотечении или невозможности безопасно добраться вызови экстренную помощь."],"stepsEn":["Arrange urgent assessment for a deformed knee or suspected dislocation.","Support the knee in its comfortable position and avoid weight-bearing.","Call emergency services for major injury, severe bleeding or unsafe transport."],"avoidRu":"Не вправляй чашечку и не выпрямляй колено силой, даже если вывих кажется небольшим.","avoidEn":"Do not force the kneecap back or straighten the knee.","level":"urgent","icon":"✚"},{"id":"finger-fracture","ru":"Подозрение на перелом пальца руки","en":"Suspected broken finger","category":"injuries","aliases":"палец сломан кисть большой палец","stepsRu":["При выраженной боли, отёке или изменении формы пальца организуй медицинский осмотр.","Сними кольца, если это можно сделать без усилия. Поддержи кисть, приложи холод через ткань.","Если палец побледнел, посинел, онемел, сильно деформирован или видна кость, нужна экстренная оценка."],"stepsEn":["Arrange medical assessment for marked pain, swelling or altered finger shape.","Remove rings if easy. Support the hand and apply a wrapped cold pack.","Seek emergency assessment for a pale, blue, numb or badly deformed finger or exposed bone."],"avoidRu":"Не выпрямляй повреждённый палец самостоятельно.","avoidEn":"Do not straighten the injured finger yourself.","level":"urgent","icon":"✚"},{"id":"toe-fracture","ru":"Травма пальца ноги","en":"Toe injury","category":"injuries","aliases":"перелом палец нога мизинец большой","stepsRu":["Отдохни, приподними стопу и приложи холод через ткань.","При сильной боли, травме большого пальца, выраженной деформации или повреждении кожи организуй медицинский осмотр.","При онемении, нарушении кровоснабжения или видимой кости нужна неотложная оценка."],"stepsEn":["Rest, elevate the foot and apply a wrapped cold pack.","Arrange assessment for severe pain, big toe injury, marked deformity or a wound.","Seek urgent assessment for numbness, impaired circulation or exposed bone."],"avoidRu":"Не выпрямляй палец и не фиксируй самостоятельно большой или деформированный палец к соседнему.","avoidEn":"Do not straighten the toe or self-tape a big or deformed toe to the next toe.","level":"common","icon":"✚"},{"id":"achilles-rupture","ru":"Резкая боль над пяткой после движения","en":"Sudden pain above heel after movement","category":"injuries","aliases":"ахилл ахиллово сухожилие щелчок пятка","stepsRu":["После резкого щелчка или боли над пяткой прекрати нагрузку.","Если трудно оттолкнуться стопой или ходить, организуй срочный медицинский осмотр.","Поддерживай ногу в удобном положении, избегай опоры до получения указаний специалиста."],"stepsEn":["Stop exertion after a sudden snap or pain above the heel.","Arrange urgent assessment if pushing off or walking becomes difficult.","Support the leg comfortably and avoid weight-bearing until advised."],"avoidRu":"Не растягивай сухожилие и не проверяй его повторными прыжками.","avoidEn":"Do not stretch the tendon or test it by repeated jumping.","level":"urgent","icon":"✚"},{"id":"paracetamol-overdose","ru":"Возможная передозировка парацетамола","en":"Possible paracetamol overdose","category":"emergency","aliases":"парацетамол ацетаминофен передозировка таблетки","stepsRu":["Если принято больше рекомендованного количества парацетамола или есть сомнение, срочно обратись в токсикологическую или экстренную медицинскую службу.","Сообщи названия препаратов, количество и время приёма, если известны. Возьми упаковки.","При потере сознания или нарушении дыхания вызывай экстренную помощь; следуй диспетчеру."],"stepsEn":["If more than the recommended amount of paracetamol may have been taken, seek urgent poison service or emergency medical advice.","Report medicine names, amounts and timing if known. Keep the packaging.","Call emergency services for unconsciousness or abnormal breathing; follow dispatcher directions."],"avoidRu":"Не жди симптомов и не вызывай рвоту.","avoidEn":"Do not wait for symptoms or induce vomiting.","level":"urgent","icon":"✚"},{"id":"bowel-obstruction","ru":"Вздутие живота с рвотой и задержкой стула","en":"Abdominal distension with vomiting and no stool or gas","category":"emergency","aliases":"непроходимость кишечника вздутие рвота газы","stepsRu":["Если появились боль и вздутие живота, рвота и невозможность отхождения стула или газов, организуй немедленную медицинскую оценку.","При сильной боли, слабости, обмороке или резком ухудшении вызывай экстренную помощь.","Сообщи о прежних операциях, грыжах и времени начала симптомов."],"stepsEn":["Arrange immediate medical assessment for abdominal pain and distension with vomiting and inability to pass stool or gas.","Call emergency services for severe pain, weakness, fainting or rapid deterioration.","Report previous surgery, hernias and symptom onset."],"avoidRu":"Не применяй слабительные или клизмы для устранения возможной непроходимости без указания врача.","avoidEn":"Do not use laxatives or enemas for possible obstruction without medical advice.","level":"urgent","icon":"✚"},{"id":"scene-safety","ru":"Первый на месте происшествия","en":"First at an emergency scene","category":"emergency","aliases":"безопасность место происшествия помощь несколько пострадавших","stepsRu":["Оцени угрозы себе и окружающим. Не входи в опасную зону, не подходи к огню, проводам, движущемуся транспорту или агрессивным людям.","Из безопасного места вызови нужную службу; сообщи адрес, угрозы и число пострадавших.","Если безопасно, оцени сознание, дыхание и наличие сильного кровотечения. Следуй указаниям диспетчера."],"stepsEn":["Check for hazards to yourself and others. Stay clear of fire, live cables, moving traffic or violence.","From safety, call for help and report location, hazards and the number of casualties.","If safe, assess responsiveness, breathing and severe bleeding. Follow dispatcher instructions."],"avoidRu":"Не становись ещё одним пострадавшим и не рискуй ради вещей.","avoidEn":"Do not become another casualty or risk injury to retrieve belongings.","level":"critical","icon":"✚"},{"id":"traffic-collision","ru":"Дорожно-транспортное происшествие","en":"Road traffic collision","category":"injuries","aliases":"дтп авария машина мотоцикл автомобиль","stepsRu":["Остановись в безопасном месте и оцени риск от движения транспорта, огня и топлива.","Вызови экстренные службы. Сообщи место аварии, количество пострадавших и заблокированных людей.","Если безопасно подойти, проверь сознание, дыхание и опасное кровотечение; помоги в первую очередь при угрозе жизни."],"stepsEn":["Stop in a safe location and assess hazards from traffic, fire and fuel.","Call emergency services with location, number of casualties and any trapped people.","If safe to approach, assess responsiveness, breathing and severe bleeding; prioritise life-threatening problems."],"avoidRu":"Не извлекай пострадавшего из машины без необходимости спасения жизни или указаний диспетчера.","avoidEn":"Do not pull someone out of a vehicle unless necessary to save life or directed by emergency services.","level":"critical","icon":"✚"},{"id":"aortic-aneurysm","ru":"Внезапная сильная боль в животе или спине с коллапсом","en":"Sudden severe abdominal or back pain with collapse","category":"emergency","aliases":"аневризма аорты разрыв живот спина бледность обморок","stepsRu":["При внезапной очень сильной боли в животе или спине, особенно со слабостью, бледностью или потерей сознания, вызывай экстренную помощь.","Оставь человека в удобном положении и наблюдай за сознанием и дыханием.","Сообщи диспетчеру о известной аневризме, если она есть. При отсутствии нормального дыхания начинай СЛР."],"stepsEn":["Call emergency services for sudden severe abdominal or back pain, especially with pallor, weakness or collapse.","Keep the person comfortable and monitor responsiveness and breathing.","Report any known aneurysm. Start CPR if breathing is not normal."],"avoidRu":"Не жди, пока боль пройдёт, и не вези тяжело больного за рулём самостоятельно.","avoidEn":"Do not wait for pain to resolve or drive yourself when severely ill.","level":"critical","icon":"✚"},{"id":"hyperglycemia","ru":"Диабет: высокий сахар и ухудшение состояния","en":"Diabetes: high blood sugar and deterioration","category":"emergency","aliases":"гипергликемия гиперосмолярное состояние высокий сахар жажда","stepsRu":["При известном диабете и признаках высокого сахара, если возможно, измерь глюкозу и следуй индивидуальному плану.","При рвоте, необычном дыхании, сильной сонливости или спутанности немедленно обратись за экстренной помощью.","Сообщи медикам результаты измерений и лекарства; не оставляй человека с ухудшением состояния одного."],"stepsEn":["In known diabetes with signs of high glucose, check blood glucose if possible and follow the personal care plan.","Seek emergency help for vomiting, unusual breathing, marked drowsiness or confusion.","Report measurements and medicines; stay with a deteriorating person."],"avoidRu":"Не изменяй дозы инсулина вне индивидуального плана или медицинского указания.","avoidEn":"Do not alter insulin doses outside a personal plan or professional advice.","level":"urgent","icon":"✚"},{"id":"whooping-cough","ru":"Приступы кашля у младенца: тревожные признаки","en":"Infant coughing fits: warning signs","category":"children","aliases":"коклюш приступ кашля паузы дыхания младенец","stepsRu":["Если у малыша есть паузы дыхания, посинение или выраженная одышка, вызывай экстренную помощь.","При подозрении на коклюш у ребёнка младше шести месяцев немедленно свяжись с медицинской службой.","Следи за дыханием и кормлением; сообщи о контактах с больными и прививках."],"stepsEn":["Call emergency services for pauses in breathing, blue colouring or severe breathing difficulty.","Contact a medical service immediately for suspected pertussis in an infant under six months.","Monitor breathing and feeding; report exposure and vaccination history."],"avoidRu":"Не пытайся подавлять приступ случайными лекарствами от кашля.","avoidEn":"Do not try to suppress attacks with random cough medicines.","level":"urgent","icon":"✚"},{"id":"child-asthma","ru":"Приступ астмы у ребёнка","en":"Asthma attack in a child","category":"children","aliases":"ребенок астма свист спейсер ингалятор","stepsRu":["Помоги ребёнку сесть удобно и оставаться спокойным. Помоги применить назначенный экстренный ингалятор со спейсером, если это предусмотрено его планом.","Если дыхание резко затруднено, ребёнок не может говорить или пить либо назначенная помощь не действует, вызови экстренную службу.","Оставайся рядом и выполняй указания диспетчера и индивидуального плана."],"stepsEn":["Help the child sit comfortably and stay calm. Assist with the prescribed reliever and spacer if included in their care plan.","Call emergency services if breathing is severely affected, the child cannot speak or drink, or prescribed rescue treatment is not helping.","Stay nearby and follow dispatcher instructions and the individual care plan."],"avoidRu":"Не заставляй ребёнка лежать и не заменяй назначенный ингалятор чужим препаратом.","avoidEn":"Do not force the child to lie down or substitute someone else's medicine.","level":"critical","icon":"✚"},{"id":"acute-glaucoma","ru":"Внезапная боль в глазу с радужными кругами и тошнотой","en":"Sudden eye pain with halos and nausea","category":"emergency","aliases":"острая глаукома глаз радужные круги тошнота","stepsRu":["Внезапная сильная боль в глазу вместе с ухудшением зрения, радужными кругами или тошнотой требует экстренной медицинской оценки.","Организуй немедленный осмотр в отделении экстренной помощи; не управляй транспортом.","Сообщи о глазных заболеваниях и недавно использованных каплях."],"stepsEn":["Sudden severe eye pain with reduced vision, halos or nausea requires emergency assessment.","Arrange immediate emergency department assessment and do not drive.","Report eye conditions and recently used eye drops."],"avoidRu":"Не пытайся самостоятельно подобрать капли для снижения глазного давления.","avoidEn":"Do not independently choose pressure-lowering eye drops.","level":"urgent","icon":"✚"},{"id":"chemo-fever","ru":"Лихорадка или недомогание после химиотерапии","en":"Fever or illness after chemotherapy","category":"emergency","aliases":"химиотерапия температура нейтропения озноб рак","stepsRu":["Если после противоопухолевого лечения появился жар, озноб или необычное недомогание, немедленно свяжись с выданной онкологической службой.","Если есть выраженная одышка, спутанность, коллапс или тяжёлое состояние, вызывай экстренную помощь.","Сообщи дату последнего лечения, температуру и лекарства; покажи карточку пациента, если она есть."],"stepsEn":["For fever, chills or unusual illness after anticancer treatment, immediately contact the oncology service provided to the patient.","Call emergency services for marked breathlessness, confusion, collapse or severe illness.","Report the last treatment date, temperature and medicines; show the patient alert card if available."],"avoidRu":"Не жди высокой температуры: опасная инфекция возможна и без неё.","avoidEn":"Do not wait for a high temperature; serious infection may occur without fever.","level":"urgent","icon":"✚"},{"id":"jaw-injury","ru":"Тяжёлая травма лица или челюсти","en":"Serious facial or jaw injury","category":"injuries","aliases":"челюсть лицо перелом удар рот кровь","stepsRu":["При тяжёлой травме лица или челюсти вызови экстренную помощь, особенно если нарушено дыхание или есть сильное кровотечение.","Не перемещай человека без необходимости; помоги сохранить удобное положение и свободное дыхание, следуя диспетчеру.","Наблюдай за сознанием и дыханием; при отсутствии нормального дыхания начинай СЛР."],"stepsEn":["Call emergency services for serious facial or jaw injury, especially with breathing difficulty or severe bleeding.","Avoid unnecessary movement; help maintain a comfortable position and airway as directed by the dispatcher.","Monitor responsiveness and breathing; start CPR if breathing is not normal."],"avoidRu":"Не пытайся вправлять челюсть и не давай еду или питьё.","avoidEn":"Do not try to realign the jaw or give food or drink.","level":"critical","icon":"✚"},{"id":"mushroom-poisoning","ru":"Подозрение на отравление дикорастущими грибами","en":"Suspected wild mushroom poisoning","category":"environment","aliases":"грибы отравление поганка съел лес","stepsRu":["Если есть подозрение на употребление ядовитых грибов, немедленно обращайся в токсикологическую или экстренную медицинскую службу, даже без симптомов.","Сообщи время употребления, количество, признаки и кто ещё ел грибы. Если безопасно, сохрани остатки или фотографии для специалистов.","При нарушении сознания или дыхания вызови экстренную помощь и следуй диспетчеру."],"stepsEn":["Seek immediate poison service or emergency medical advice for suspected poisonous mushroom ingestion, even without symptoms.","Report timing, quantity, symptoms and other diners. Keep leftovers or photos for professionals if safe.","Call emergency services for altered consciousness or breathing and follow dispatcher directions."],"avoidRu":"Не вызывай рвоту и не жди появления симптомов.","avoidEn":"Do not induce vomiting or wait for symptoms.","level":"urgent","icon":"✚"},{"id":"severe-hypoglycaemia","ru":"Тяжёлая гипогликемия: потеря сознания","en":"Severe hypoglycaemia with unconsciousness","level":"critical","category":"emergency","aliases":"сахар диабет гипо без сознания low blood sugar unconscious","stepsRu":["Вызови экстренную помощь, проверь реакцию и нормальное дыхание.","Если человек дышит нормально и нет подозрения на травму, уложи его на бок. Если дыхание ненормальное, следуй указаниям диспетчера и начни СЛР.","Если доступен назначенный человеку глюкагон и ты знаешь, как его применить, используй по инструкции, не откладывая помощь."],"stepsEn":["Call emergency services and assess responsiveness and normal breathing.","If breathing normally and there is no suspected trauma, place them on their side. If breathing is abnormal, follow the dispatcher and start CPR.","If their prescribed glucagon is available and you know how to use it, follow its instructions without delaying help."],"avoidRu":"Не давай пищу, напитки или таблетки человеку без сознания.","avoidEn":"Do not give food, drinks or tablets to an unconscious person.","icon":"✚"},{"id":"neck-compression","ru":"После сдавления шеи","en":"After neck compression","level":"critical","category":"injuries","aliases":"удушение сдавили шею травма шеи strangulation neck compression","stepsRu":["Перейди в безопасное место. При затруднении дыхания, потере сознания или других серьёзных симптомах немедленно вызови экстренную помощь.","После сдавления шеи нужна срочная медицинская оценка, даже если внешних следов нет.","Если человек без сознания, проверь дыхание и выполняй указания диспетчера."],"stepsEn":["Move to safety. Call emergency services immediately for breathing difficulty, loss of consciousness or other serious symptoms.","Seek urgent medical assessment after neck compression even if there are no visible marks.","If unresponsive, assess breathing and follow the dispatcher's instructions."],"avoidRu":"Не считай отсутствие синяков доказательством отсутствия травмы.","avoidEn":"Do not assume that lack of bruising excludes injury.","icon":"✚"},{"id":"nonblanching-rash","ru":"Сыпь не бледнеет при надавливании и человек болен","en":"Non-blanching rash with illness","level":"critical","category":"emergency","aliases":"сыпь стекло не исчезает meningitis sepsis purple spots","stepsRu":["При сыпи, которая не бледнеет при надавливании, вместе с выраженным недомоганием немедленно вызови экстренную помощь.","Сообщи диспетчеру о температуре, изменении сознания, дыхания и сыпи, если они есть.","Наблюдай за дыханием и реакцией человека до прибытия помощи."],"stepsEn":["Call emergency services immediately for a non-blanching rash with marked illness.","Tell the dispatcher about fever, altered responsiveness, breathing changes and the rash if present.","Monitor breathing and responsiveness until help arrives."],"avoidRu":"Не жди появления сыпи, если уже есть опасные признаки болезни.","avoidEn":"Do not wait for a rash if serious signs of illness are already present.","icon":"✚"},{"id":"infant-dehydration","ru":"Младенец: признаки обезвоживания","en":"Infant dehydration warning signs","level":"urgent","category":"children","aliases":"мало мокрых подгузников запавший родничок baby dehydration","stepsRu":["Обрати внимание на уменьшение числа мокрых подгузников, сухость рта и необычную сонливость.","При признаках обезвоживания у младенца срочно свяжись с медицинским специалистом. Продолжай обычное грудное вскармливание или смесь, если ребёнок может пить.","При нарушении сознания, выраженной слабости или необычном дыхании вызови экстренную помощь."],"stepsEn":["Look for fewer wet nappies, a dry mouth and unusual sleepiness.","Seek urgent medical advice for signs of dehydration in an infant. Continue usual breast or formula feeds if the child can drink.","Call emergency services for altered responsiveness, severe weakness or abnormal breathing."],"avoidRu":"Не разбавляй детскую смесь сверх указаний производителя.","avoidEn":"Do not dilute formula beyond the manufacturer's instructions.","icon":"✚"},{"id":"shingles-eye","ru":"Опоясывающий лишай около глаза","en":"Shingles near the eye","level":"urgent","category":"everyday","aliases":"пузырьки вокруг глаза носа herpes zoster shingles eye","stepsRu":["При болезненной пузырьковой сыпи около глаза или на носу срочно обратись за медицинской помощью.","Сообщи о красноте глаза, боли, ухудшении зрения и снижении иммунитета.","При внезапной потере зрения обращайся за экстренной помощью."],"stepsEn":["Seek urgent medical assessment for a painful blistering rash around the eye or on the nose.","Report eye redness, pain, changes in vision and immune suppression.","Seek emergency help for sudden vision loss."],"avoidRu":"Не наноси непредназначенные для глаз препараты на поверхность глаза.","avoidEn":"Do not put products not intended for the eye onto its surface.","icon":"✚"},{"id":"uveitis-warning","ru":"Болезненный красный глаз и светобоязнь","en":"Painful red eye with light sensitivity","level":"urgent","category":"everyday","aliases":"увеит светобоязнь красный глаз uveitis photophobia","stepsRu":["При боли в глазу, непереносимости света или затуманенном зрении срочно обратись к врачу или офтальмологу.","Сообщи, когда начались симптомы и были ли травмы, операции или инфекции.","При внезапной потере зрения обращайся за экстренной помощью."],"stepsEn":["Seek urgent medical or eye specialist assessment for eye pain, light sensitivity or blurred vision.","Report when symptoms began and any injuries, surgery or infections.","Seek emergency help for sudden vision loss."],"avoidRu":"Не используй оставшиеся от прежнего лечения стероидные глазные капли без назначения.","avoidEn":"Do not use leftover steroid eye drops without a prescription for this episode.","icon":"✚"},{"id":"hand-foot-mouth","ru":"Ребёнок: язвочки во рту и сыпь на кистях и стопах","en":"Child with mouth sores and hand or foot rash","level":"common","category":"children","aliases":"энтеровирус коксаки hand foot mouth disease","stepsRu":["Если ребёнок может пить, предлагай прохладное питьё небольшими порциями.","Следи за мочеиспусканием и общим состоянием. При уменьшении мочи или невозможности пить нужна срочная консультация.","При выраженном ухудшении состояния или затруднении дыхания вызывай экстренную помощь."],"stepsEn":["Offer small amounts of cool drinks if the child can swallow.","Monitor urination and general condition. Seek urgent advice for reduced urination or inability to drink.","Call emergency services for severe deterioration or difficulty breathing."],"avoidRu":"Не заставляй пить при нарушении глотания или сознания.","avoidEn":"Do not force drinks if swallowing or responsiveness is impaired.","icon":"✚"},{"id":"chickenpox-risk","ru":"Ветрянка у новорождённого или при беременности","en":"Chickenpox exposure in newborn or pregnancy","level":"urgent","category":"children","aliases":"ветрянка беременная новорожденный chickenpox pregnancy newborn","stepsRu":["Если новорождённый заболел ветрянкой или контактировал с заболевшим, срочно свяжись с врачом.","Беременной или человеку с ослабленным иммунитетом при контакте с ветрянкой также нужна срочная консультация.","Перед посещением клиники предупреди о возможной заразной инфекции."],"stepsEn":["Contact a clinician urgently if a newborn has chickenpox or has been exposed.","Urgent advice is also needed after exposure during pregnancy or with a weakened immune system.","Notify the clinic of possible contagious infection before visiting."],"avoidRu":"Не жди появления сыпи у человека из группы риска после контакта.","avoidEn":"Do not wait for a rash after exposure in a high-risk person.","icon":"✚"},{"id":"cellulitis","ru":"Распространяющееся болезненное покраснение кожи","en":"Spreading painful skin redness","level":"urgent","category":"everyday","aliases":"целлюлит рожистое воспаление горячая кожа cellulitis","stepsRu":["При болезненном горячем отёке или увеличивающемся покраснении кожи срочно обратись к врачу.","Сообщи о температуре, диабете, ране или ослабленном иммунитете.","При спутанности сознания, затруднении дыхания или резком ухудшении вызывай экстренную помощь."],"stepsEn":["Seek urgent medical assessment for painful hot swelling or spreading skin redness.","Report fever, diabetes, a wound or immune suppression.","Call emergency services for confusion, breathing difficulty or rapid deterioration."],"avoidRu":"Не пытайся самостоятельно вскрывать припухлость или заменять лечение остатками антибиотиков.","avoidEn":"Do not cut into swelling or substitute leftover antibiotics for medical care.","icon":"✚"},{"id":"breast-abscess","ru":"Болезненное уплотнение груди с температурой","en":"Painful breast lump with fever","level":"urgent","category":"everyday","aliases":"абсцесс груди мастит breast abscess mastitis","stepsRu":["При болезненном горячем уплотнении груди, особенно с температурой, срочно обратись к врачу.","Сообщи о кормлении грудью, предшествующем мастите и времени появления симптомов.","Если состояние резко ухудшается или появляется спутанность сознания, вызывай экстренную помощь."],"stepsEn":["Seek urgent medical assessment for a painful hot breast lump, particularly with fever.","Report breastfeeding, previous mastitis and the timing of symptoms.","Call emergency services if there is rapid deterioration or confusion."],"avoidRu":"Не пытайся самостоятельно прокалывать или выдавливать уплотнение.","avoidEn":"Do not try to puncture or squeeze the lump.","icon":"✚"},{"id":"pneumonia-warning","ru":"Кашель с одышкой: тревожные признаки","en":"Cough with breathlessness warning signs","level":"urgent","category":"everyday","aliases":"пневмония кашель одышка pneumonia chest infection","stepsRu":["При кашле с одышкой или болью при дыхании обратись за срочной медицинской оценкой.","При тяжёлом нарушении дыхания, синюшности или внезапной спутанности сознания немедленно вызывай экстренную помощь.","Сообщи о длительности симптомов, хронических болезнях и принимаемых лекарствах."],"stepsEn":["Seek urgent medical assessment for cough with breathlessness or pain on breathing.","Call emergency services immediately for severe breathing difficulty, blue coloration or sudden confusion.","Report symptom duration, chronic conditions and current medicines."],"avoidRu":"Не начинай оставшиеся антибиотики без назначения.","avoidEn":"Do not start leftover antibiotics without clinical advice.","icon":"✚"},{"id":"ear-infection-warning","ru":"Боль в ухе с тревожными признаками","en":"Earache with warning signs","level":"urgent","category":"everyday","aliases":"отит ухо болит выделения ear infection earache","stepsRu":["При боли в ухе с выделениями, изменением слуха, высокой температурой или выраженным недомоганием обратись за срочной консультацией.","При припухлости за ухом или быстром ухудшении нужна срочная медицинская оценка.","Береги ухо от воды до консультации."],"stepsEn":["Seek urgent advice for ear pain with discharge, hearing changes, high fever or marked illness.","Seek urgent assessment for swelling behind the ear or rapid deterioration.","Keep water out of the ear until assessed."],"avoidRu":"Не вводи ватные палочки и другие предметы в слуховой проход.","avoidEn":"Do not insert cotton buds or other objects into the ear canal.","icon":"✚"}];

function oneEdit(a,b){
 if(Math.abs(a.length-b.length)>1)return false;
 let i=0,j=0,d=0;while(i<a.length&&j<b.length){
 if(a[i]===b[j]){i++;j++;continue}
 if(++d>1)return false;
 if(a.length>b.length)i++;else if(b.length>a.length)j++;else{i++;j++}
 }
 return d+(a.length-i)+(b.length-j)<=1;
}


let toastHide;
function toastMessage(msg){const el=document.querySelector("#puls-toast");if(!el)return;el.textContent=msg;el.hidden=false;if(toastHide)clearTimeout(toastHide);toastHide=setTimeout(()=>{el.hidden=true},2800)}
function makeBackup(){
 const ids=new Set(PAGES.map(p=>p.id)),allowed=new Set(KITS.flatMap(k=>k.items.map((_,i)=>k.id+":"+i)));
 return {format:"puls-backup",schema:1,lang:state.lang,light:!!state.light,large:!!state.large,hicontrast:!!state.hicontrast,num:state.num,keepAwake:state.keepAwake!==false,kitOpen:state.kitOpen,saved:[...new Set(state.saved.filter(id=>ids.has(id)))],recent:[...new Set(state.recent.filter(id=>ids.has(id)))].slice(0,7),check:Object.fromEntries(Object.entries(state.check).filter(([k,v])=>allowed.has(k)&&v===true))};
}
function showBackup(){const area=document.querySelector("#backup-text");if(!area)return;area.value=JSON.stringify(makeBackup(),null,2);area.focus();area.select();toastMessage(t("backupSaved"))}
async function copyBackup(){const area=document.querySelector("#backup-text");if(!area)return;if(!area.value.trim())showBackup();try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(area.value);toastMessage(t("backupCopied"))}else{area.focus();area.select();toastMessage(t("backupSaved"))}}catch(e){area.focus();area.select();toastMessage(t("backupSaved"))}}
function importBackup(){
 const area=document.querySelector("#backup-text");if(!area)return;
 try{
  const src=area.value.trim();if(!src){toastMessage(t("backupEmpty"));return}
  if(src.length>25000)throw Error("size");
  const v=JSON.parse(src);
  if(!v||Array.isArray(v)||v.format!=="puls-backup"||v.schema!==1)throw Error("format");
  if(!["ru","en"].includes(v.lang)||typeof v.light!=="boolean"||typeof v.large!=="boolean"||typeof v.hicontrast!=="boolean")throw Error("options");
  if(typeof v.num!=="string"||!new RegExp("^\\+?[0-9]{2,7}$").test(v.num))throw Error("phone");
  if(!Array.isArray(v.saved)||!Array.isArray(v.recent)||v.saved.length>Math.max(PAGES.length,1000)||v.recent.length>100||!v.check||Array.isArray(v.check)||typeof v.check!=="object"||Object.keys(v.check).length>Math.max(KITS.reduce((n,k)=>n+k.items.length,0),150))throw Error("entries");
  if(v.keepAwake!==undefined&&typeof v.keepAwake!=="boolean")throw Error("awake");
  if(v.kitOpen!==undefined&&v.kitOpen!==""&&!KITS.some(k=>k.id===v.kitOpen))throw Error("kit");
  if(!confirm(t("backupAsk")))return;
  const ids=new Set(PAGES.map(p=>p.id)),keys=new Set(KITS.flatMap(k=>k.items.map((_,i)=>k.id+":"+i)));
  const saved=[...new Set(v.saved.filter(x=>typeof x==="string"&&ids.has(x)))];
  const recent=[...new Set(v.recent.filter(x=>typeof x==="string"&&ids.has(x)))].slice(0,7);
  const check=Object.fromEntries(Object.entries(v.check).filter(([key,val])=>keys.has(key)&&val===true));
  Object.assign(state,{lang:v.lang,light:v.light,large:v.large,hicontrast:v.hicontrast,num:v.num,saved,recent,check,keepAwake:v.keepAwake??state.keepAwake,kitOpen:v.kitOpen??state.kitOpen});
  const fields=["lang","light","large","hicontrast","num","saved","recent","check","keepAwake","kitOpen"];
  const allSaved=fields.map(key=>store.set(key,state[key])).every(Boolean);
  route();toastMessage(allSaved?t("backupRestored"):t("backupFail"));
 }catch(e){toastMessage(t("backupError"))}
}

let normalizedSearchPhrases;
function phrasePriorities(normalized){
 const query=" "+normalized+" ";
 const entries=normalizedSearchPhrases||(normalizedSearchPhrases=SEARCH_PHRASES.flatMap(([ids,phrases])=>phrases.map(v=>({ids,phrase:norm(v)}))));
 const hits=entries.filter(v=>query.includes(" "+v.phrase+" "));
 // Prefer specific multiword situations to overlapping generic words. A search is not a diagnosis.
 const specific=hits.filter(a=>!hits.some(b=>b.phrase.length>a.phrase.length&&(" "+b.phrase+" ").includes(" "+a.phrase+" ")));
 const result=new Map();
 for(const {ids,phrase} of specific)ids.forEach((id,i)=>result.set(id,Math.max(result.get(id)||0,10000+phrase.split(" ").length*1000-i*300)));
 return result;
}
const topicTitleIndex=new WeakMap();
function searchTopicRows(q,category="all",criticalOnly=false){
 const normalized=norm(q);
 if(!normalized||!normalized.split(" ").some(w=>w.length>1))return [];
 const priority=phrasePriorities(normalized),terms=normalized.split(" ").filter(w=>w.length>1);
 return PAGES.filter(p=>(!criticalOnly||p.level==="critical")&&(category==="all"||p.category===category)&&(priority.has(p.id)||match(p,normalized))).map((p,i)=>{
 let entry=topicTitleIndex.get(p);if(!entry){entry={title:norm(p.ru+" "+p.en),aliases:norm(p.aliases),ru:norm(p.ru),en:norm(p.en)};topicTitleIndex.set(p,entry)}
 const {title,aliases}=entry,exactTitle=normalized===entry.ru||normalized===entry.en;
 const score=(priority.get(p.id)||0)+(exactTitle?180:(" "+title+" ").includes(" "+normalized+" ")?100:(" "+aliases+" ").includes(" "+normalized+" ")?65:0)+terms.reduce((n,w)=>n+(title.includes(w)?12:aliases.includes(w)?6:0),0);
 return {p,i,score};
 }).sort((a,b)=>b.score-a.score||a.i-b.i).map(x=>x.p);
}

function medicineHay(m){let hay=medicineSearchIndex.get(m);if(hay===undefined){hay=norm(m.ru+" "+m.en+" "+(m.aliases||""));medicineSearchIndex.set(m,hay)}return hay}
function medMatches(m,q){const terms=norm(q).split(" ").filter(Boolean);if(!terms.length)return !String(q??"").trim();return terms.every(w=>medicineHay(m).includes(w))}
